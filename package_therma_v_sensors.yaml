  #      slave: 1
  #      input_type: holding
  #      scale: 1
  #      state_class: measurement
  #      device_class: temperature
  #      unit_of_measurement: "°C"

      - name: "Therma V DHW target temperature" # 0.1C
        unique_id: therma_v_dhw_target_temperature
        scan_interval: 5
        address: 8
        slave: 1
        input_type: holding
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

  #    - name: "Therma V energy state register"
  #      scan_interval: 10
  #      address: 9
  #      slave: 1
  #      input_type: holding

  # COIL REGISTERS
    switches:
      - name: "Therma V Heating/Cooling on/off"
        unique_id: therma_v_heating_Cooling_on_off
        slave: 1
        address: 0
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 0
            state_on: 1
            state_off: 0
            
      - name: "Therma V DHW on/off"
        unique_id: therma_v_dhw_on_off
        slave: 1
        address: 1
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 1
            state_on: 1
            state_off: 0
            
      - name: "Therma V Silent Mode"
        unique_id: therma_v_silent_mode
        slave: 1
        address: 2
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 2
            state_on: 1
            state_off: 0

      - name: "Therma V Trigger DHW disinfection cycle"
        unique_id: therma_v_trigger_dhw_disinfection_cycle
        slave: 1
        address: 3
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 3
            state_on: 1
            state_off: 0

  # DISCRETE REGISTERS
    binary_sensors:
      - name: "Therma V Water flow state" # 0 OK, 1 LOW
        unique_id: therma_v_water_flow_state
        slave: 1
        address: 0
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V water pump state" # 0 OFF, 1 ON
        unique_id: therma_v_water_pump_state
        slave: 1
        address: 1
        scan_interval: 30
        input_type: discrete_input
      
      - name: "Therma V external water pump state" # 0 OFF, 1 ON
        unique_id: therma_v_external_water_pump_state
        slave: 1
        address: 2
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V compressor state" # 0 OFF, 1 ON
        unique_id: therma_v_compressor_state
        slave: 1
        address: 3
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V defrost state" # 0 OFF, 1 ON
