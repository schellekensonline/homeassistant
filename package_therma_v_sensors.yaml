template:
  - sensor:
      # Thermal power delivered to the water: flow x specific heat x delta T. DHW mode can be
      # reported before the 3-way valve and compressor settle, so its branch waits for the
      # compressor. Normal heating and cooling pump runs keep the existing calculation.
    - name: "Therma V thermal power"
      unique_id: therma_v_thermal_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      availability: >
        {% set Tout_lg   = states('sensor.therma_v_buffer_temperatures_in_from_heatpump_t1') | float("unknown") %}
        {% set Tin_lg    = states('sensor.therma_v_buffer_temperatures_return_to_heatpump_t4') | float("unknown") %}
        {{ Tout_lg|is_number and Tin_lg|is_number}}
      state: >
        {% set cooling_p  = is_state('sensor.therma_v_outdoor_unit_state','1') %} {#  0 off, 1 cooling, 2 heating #}
        {% set heating_p  = is_state('sensor.therma_v_outdoor_unit_state','2') %} 
        {% set dhw_p      = is_state('binary_sensor.therma_v_dhw_heating_state','on') %}
        {% set compressor_p = (states('sensor.therma_v_compressor_hz') | float(0)) > 1 %}
        {% set boost1_p   = is_state('binary_sensor.therma_v_dhw_booster_state','on') %}
        {% set boost2_p   = is_state('binary_sensor.therma_v_dhw_booster_2_state_s1','on') %}

        {% set flow_lg   = states('sensor.therma_v_water_flow_rate') | float(0) %}
        {% set Tout_lg   = states('sensor.therma_v_buffer_temperatures_in_from_heatpump_t1') | float(0) %}
        {% set Tin_lg    = states('sensor.therma_v_buffer_temperatures_return_to_heatpump_t4') | float(0) %}
        {% set rho_water = 1.0 | float(0) %}
        {% set c_water   = 4184.0 | float(0) %}

        {% if ( boost1_p or boost2_p ) %}
          {% set p_boost = 1500.0 | float(0) %}
        {% else %}
          {% set p_boost = 0.0 | float(0) %}
        {% endif %}

        {% if (flow_lg > 8) %}
          {# DHW starts before the compressor; suppress the water-side formula until it runs. #}
          {% if dhw_p %}
            {% if compressor_p %}
              {{ ((rho_water*flow_lg/60*c_water*(Tout_lg-Tin_lg)) + p_boost) | round(0) }}
            {% else %}
              {{ p_boost | round(0) }}
            {% endif %}
          {% elif heating_p %}
            {{ ((rho_water*flow_lg/60*c_water*(Tout_lg-Tin_lg)) + p_boost) | round(0) }}
          {% elif cooling_p %}
            {{ ((rho_water*flow_lg/60*c_water*(Tin_lg-Tout_lg)) + p_boost) | round(0) }}
          {% else %}
            {{ ( (Tout_lg-Tin_lg) + p_boost ) | round(0) }}  
          {% endif %}    
        {% else %}
          {{ ( (Tout_lg-Tin_lg) + p_boost ) | round(0) }}
        {% endif %}
      # At or below 8 L/min the flow term is not calculated; this branch reports delta T
      # numerically as W plus the booster and is diagnostic only.

    # Total electric power of the heat pump: its own kWh meter plus the DHW circulation
    # pump, which sits behind a Shelly plug.
    - name: "Therma V electric power"
      unique_id: therma_v_electric_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >
        {% set p_dhw_cir = states('sensor.shelly_plug_s3_power') | float(0) %}
        {% set p_hp      = states('sensor.kwh_meter_heat_pump_active_power') | float(0) %}

        {{ (p_hp+p_dhw_cir) | round(0) }}

    # Electrical boundary used by the EMHASS thermal loads: heat pump meter plus the external
    # DHW booster. Exclude the unplanned circulation pump so plan-versus-reality stays comparable.
    - name: "Therma V planned-load electric power"
      unique_id: therma_v_planned_load_electric_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      availability: >-
        {{ states('sensor.kwh_meter_heat_pump_active_power') | is_number
           and states('sensor.shelly_plug_s1_power') | is_number }}
      state: >-
        {{ (states('sensor.kwh_meter_heat_pump_active_power') | float(0)
            + states('sensor.shelly_plug_s1_power') | float(0)) | round(0) }}

    # Actual power series for the dry-run comparison charts. The HP meter contains compressor and
    # internal-booster power; the Shelly meter is the parallel path to that same tank element.
    - name: "Therma V DHW actual electric power"
      unique_id: therma_v_dhw_actual_electric_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      availability: >-
        {{ states('sensor.kwh_meter_heat_pump_active_power') | is_number
           and states('sensor.shelly_plug_s1_power') | is_number
           and has_value('binary_sensor.therma_v_dhw_heating_state')
           and has_value('binary_sensor.therma_v_dhw_booster_state')
           and has_value('binary_sensor.therma_v_dhw_booster_2_state_s1') }}
      state: >-
        {% set active = is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
                        or is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
                        or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on') %}
        {{ (states('sensor.kwh_meter_heat_pump_active_power') | float(0)
            + states('sensor.shelly_plug_s1_power') | float(0)) | round(0)
           if active else 0 }}
      attributes:
        hp_meter_power: "{{ states('sensor.kwh_meter_heat_pump_active_power') | float(0) | round(0) }}"
        booster_switch_power: "{{ states('sensor.shelly_plug_s1_power') | float(0) | round(0) }}"

    - name: "Therma V DHW booster actual power"
      unique_id: therma_v_dhw_booster_actual_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >-
        {{ 1500 if is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
                    or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on')
           else 0 }}

    - name: "Therma V space heating actual power"
      unique_id: therma_v_space_heating_actual_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >-
        {% set dhw_active =
             is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on') %}
        {{ states('sensor.kwh_meter_heat_pump_active_power') | float(0) | round(0)
           if is_state('sensor.therma_v_outdoor_unit_state', '2') and not dhw_active else 0 }}

    - name: "Therma V space cooling actual power"
      unique_id: therma_v_space_cooling_actual_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >-
        {% set dhw_active =
             is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on') %}
        {{ states('sensor.kwh_meter_heat_pump_active_power') | float(0) | round(0)
           if is_state('sensor.therma_v_outdoor_unit_state', '1') and not dhw_active else 0 }}

    - name: "Therma V space heating actual thermal power"
      unique_id: therma_v_space_heating_actual_thermal_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >-
        {% set dhw_active =
             is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on') %}
        {{ states('sensor.therma_v_thermal_power') | float(0) | round(0)
           if is_state('sensor.therma_v_outdoor_unit_state', '2') and not dhw_active else 0 }}

    - name: "Therma V space cooling actual thermal power"
      unique_id: therma_v_space_cooling_actual_thermal_power
      state_class: measurement
      device_class: power
      unit_of_measurement: "W"
      state: >-
        {% set dhw_active =
             is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_state', 'on')
             or is_state('binary_sensor.therma_v_dhw_booster_2_state_s1', 'on') %}
        {{ states('sensor.therma_v_thermal_power') | float(0) | round(0)
           if is_state('sensor.therma_v_outdoor_unit_state', '1') and not dhw_active else 0 }}

    # Cost of delivered heat in EUR per kWh (electricity price divided by COP)
    - name: "Price of heat incl tax"
      unique_id: price_of_heat_incl_tax
      state_class: measurement
      unit_of_measurement: "€/kWh"
      availability: >
        {{ states('sensor.therma_v_heatpump_cop') | is_number
           and states('sensor.electricity_buying_price') | is_number }}
      state: >
        {% set CoP      = states('sensor.therma_v_heatpump_cop') | float(0) %}
        {% set E_price  = states('sensor.electricity_buying_price') | float(0) %}

        {% if (CoP > 1) %}
          {{ ( E_price/CoP ) | round(2)}}
        {% else %}
          {{ 0.00 | round(2)}}
        {% endif %}

      # COP is reported only with > 500 W thermal power, a running compressor and non-zero
      # electric power. Values are capped at 10; all other cases report 0.
    - name: "Therma V Heatpump CoP"
      unique_id: therma_v_heatpump_cop
      state_class: measurement
      availability: >
        {% set pt_cop = states('sensor.therma_v_thermal_power') | float("unknown") %}
        {% set pe_cop = states('sensor.therma_v_electric_power') | float("unknown") %}
        {{ pt_cop|is_number and pe_cop|is_number and pe_cop > 0 }}
      # Use the 5 s compressor-Hz register for the running signal instead of the slower discrete state.
      state: >
        {% set pt_cop = states('sensor.therma_v_thermal_power') | float(0) | abs %}
        {% set pe_cop = states('sensor.therma_v_electric_power') | float(0) %}
        {% set on_cop  = (states('sensor.therma_v_compressor_hz') | float(0)) > 1 %}

        {% if (pt_cop > 500.0) and on_cop and (pe_cop > 0.0) %}
          {{ min( (pt_cop / pe_cop) , 10.0) | round(2) }}
        {% else %}
          {{ 0.00 | round(2) }}
        {% endif %}

      # Seasonal COP, from the integrated thermal and electric energy counters
    - name: "Therma V Heatpump SCoP"
      unique_id: therma_v_heatpump_scop
      state_class: measurement
      availability: >
        {% set et_scop     = states('sensor.therma_v_scop_thermal_energy') | float("unknown") %}
        {% set ee_scop     = states('sensor.therma_v_scop_electric_energy') | float("unknown") %}
        {{ et_scop|is_number and ee_scop|is_number}}
      state: >
        {% set et_scop     = states('sensor.therma_v_scop_thermal_energy') | float(0) %}
        {% set ee_scop     = states('sensor.therma_v_scop_electric_energy') | float(0) %}

        {{ min( max(et_scop,1.0)/max(ee_scop,1.0) , 10.0) | round(2) }}

    # Temperature difference across the heat pump (flow minus return)
    - name: "Therma V water delta T"
      unique_id: therma_v_water_delta_t
      state_class: measurement
      device_class: temperature
      unit_of_measurement: "°C"
      availability: >
        {% set Tout_lg   = states('sensor.therma_v_buffer_temperatures_in_from_heatpump_t1') | float("unknown") %}
        {% set Tin_lg    = states('sensor.therma_v_buffer_temperatures_return_to_heatpump_t4') | float("unknown") %}
        {{ Tout_lg|is_number and Tin_lg|is_number}}
      state: >
        {% set Tout_lg   = states('sensor.therma_v_buffer_temperatures_in_from_heatpump_t1') | float(0) %}
        {% set Tin_lg    = states('sensor.therma_v_buffer_temperatures_return_to_heatpump_t4') | float(0) %}

        {{ (Tout_lg-Tin_lg) | round(2) }}

    # Temperature difference across the heating circuit (buffer flow minus return)
    - name: "Heating water delta T"
      unique_id: heating_water_delta_t
      state_class: measurement
      device_class: temperature
      unit_of_measurement: "°C"
      availability: >
        {% set Tout_buf   = states('sensor.therma_v_buffer_temperatures_out_to_heating_t2') | float("unknown") %}
        {% set Tin_buf    = states('sensor.therma_v_buffer_temperatures_return_from_heating_t3') | float("unknown") %}
        {{ Tout_buf|is_number and Tin_buf|is_number}}
      state: >
        {% set Tout_buf   = states('sensor.therma_v_buffer_temperatures_out_to_heating_t2') | float(0) %}
        {% set Tin_buf    = states('sensor.therma_v_buffer_temperatures_return_from_heating_t3') | float(0) %}

        {{ (Tout_buf-Tin_buf) | round(2) }}

    # Compressor pressure ratio (high side divided by low side)
    - name: "Therma V compression ratio"
      unique_id: therma_v_compression_ratio
      state_class: measurement
      availability: >
        {% set Pin_com   = states('sensor.therma_v_compressor_pressure_low') | float("unknown") %}
        {% set Pout_com  = states('sensor.therma_v_compressor_pressure_high') | float("unknown") %}
        {{ Pin_com|is_number and Pout_com|is_number and Pin_com > 0 }}
      state: >
        {% set Pin_com   = states('sensor.therma_v_compressor_pressure_low') | float(0) %}
        {% set Pout_com    = states('sensor.therma_v_compressor_pressure_high') | float(0) %}

        {{ (Pout_com/Pin_com) | round(2) }}

sensor:
# Energy
  - platform: integration
    source: sensor.therma_v_electric_power
    name: "Therma V electric energy"
    unique_id: therma_v_electric_energy
    method: left
    unit_prefix: k
    unit_time: h
    round: 2

  - platform: integration
    source: sensor.therma_v_electric_power
    name: "Therma V SCOP electric energy"
    unique_id: therma_v_scop_electric_energy
    method: left
    unit_prefix: k
    unit_time: h
    round: 2

  - platform: integration
    source: sensor.therma_v_thermal_power
    name: "Therma V SCOP thermal energy"
    unique_id: therma_v_scop_thermal_energy
    method: left
    unit_prefix: k
    unit_time: h
    round: 2


modbus:
  # Custom Modbus interface for the LG Therma V, reached through an RTU-over-TCP gateway.
  # The gateway's serial side towards the heat pump is configured as:
  #   9600 baud, 8 data bits, no parity, 1 stop bit, RTU (slave id 1)
  # Register addresses come from part 1 of the Therma V Modbus manual.
  # Poll budget (2026-10-10): the start-up layer needs the controlled water temperature and
  # the compressor speed fast, so inlet/outlet/Hz sit at 5 s and the 5 s holding set stays. That
  # is paid for by the registers nothing reads: room air temperature circuit 1 and the eight
  # unused 30 s inputs moved to 60 s. Everything together is ~170 requests/min, the same as
  # before. refrigerant_temperature_suction stays at 30 s - the silent-OFF safety reads it.
  - name: "modbus_gateway_therma_v"
    type: rtuovertcp
    host: 10.43.110.20
    port: 502
    delay: 0
    # message_wait_milliseconds: 150 # was 200ms

    sensors:
      # INPUT REGISTERS
      - name: "Therma V error code"
        unique_id: therma_v_error_code
        scan_interval: 60
        address: 0
        slave: 1
        input_type: input

      - name: "Therma V outdoor unit state" # 0 off, 1 cooling, 2 heating
        unique_id: therma_v_outdoor_unit_state
        scan_interval: 10
        address: 1
        slave: 1
        input_type: input

      - name: "Therma V inlet temperature"
        unique_id: therma_v_inlet_temperature
        scan_interval: 5
        address: 2
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V outlet temperature"
        unique_id: therma_v_outlet_temperature
        scan_interval: 5
        address: 3
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V DHW temperature"
        unique_id: therma_v_dhw_temperature
        scan_interval: 10
        address: 5
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        device_class: temperature
        # state_class makes Home Assistant keep long-term statistics forever, instead of only
        # the 60 days of raw states the recorder holds. The DHW/heat model needs months of
        # tank temperature.
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "Therma V room temperature"
        unique_id: therma_v_room_temperature
        scan_interval: 10
        address: 7
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        device_class: temperature
        # Same reason as the DHW temperature: the house thermal model needs a whole heating
        # season, and long-term statistics are the only history that outlives purge_keep_days.
        state_class: measurement
        unit_of_measurement: "°C"

      - name: "Therma V water flow rate"
        unique_id: therma_v_water_flow_rate
        scan_interval: 10
        address: 8
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: volume_flow_rate
        unit_of_measurement: "L/min"

      - name: "Therma V energy state"
        unique_id: therma_v_energy_state
        scan_interval: 10
        address: 11
        slave: 1
        input_type: input

      - name: "Therma V outside temperature"
        unique_id: therma_v_outside_temperature
        scan_interval: 60
        address: 12
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      # Does not work on the R32 outdoor unit
      # - name: "Therma V water pressure"
      #   scan_interval: 20
      #   address: 13
      #   slave: 1
      #   input_type: input
      #   scale: 0.1
      #   state_class: measurement
      #   device_class: pressure
      #   unit_of_measurement: "bar"

      - name: "Therma V refrigerant liquid-line temperature"
        unique_id: therma_v_refrigerant_liquid_line_temperature
        scan_interval: 60
        address: 16
        slave: 1
        input_type: input
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
      
      # This register reports a wrong value on this model
      # - name: "Therma V pipe out temperature"
      #   scan_interval: 20
      #   address: 17
      #   slave: 1
      #   input_type: input
      #   scale: 0.1
      #   state_class: measurement
      #   device_class: temperature
      #   unit_of_measurement: "°C"

      - name: "Therma V refrigerant suction temperature"
        unique_id: therma_v_refrigerant_suction_temperature
        scan_interval: 30
        address: 18
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V refrigerant hot-gas discharge temperature"
        unique_id: therma_v_refrigerant_hot_gas_discharge_temperature
        scan_interval: 60
        address: 19
        slave: 1
        input_type: input
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V refrigerant evaporator inlet temperature"
        unique_id: therma_v_temperature_before_heat_exchanger
        scan_interval: 60
        address: 20
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V refrigerant evaporator outlet temperature"
        unique_id: therma_v_temperature_after_heat_exchanger
        scan_interval: 60
        address: 21
        slave: 1
        input_type: input
        precision: 1
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V refrigerant high pressure"
        unique_id: therma_v_compressor_pressure_high
        scan_interval: 60
        address: 22
        slave: 1
        input_type: input
        # Raw registers are hundredths of a bar, i.e. 10 mbar per count.
        scale: 10
        precision: 0
        state_class: measurement
        device_class: pressure
        unit_of_measurement: "mbar"

      - name: "Therma V refrigerant low pressure"
        unique_id: therma_v_compressor_pressure_low
        scan_interval: 60
        address: 23
        slave: 1
        input_type: input
        scale: 10
        precision: 0
        state_class: measurement
        device_class: pressure
        unit_of_measurement: "mbar"

      - name: "Therma V compressor Hz"
        unique_id: therma_v_compressor_frequency
        scan_interval: 5
        address: 24
        slave: 1
        input_type: input
        scale: 1 #60 for rpm
        state_class: measurement
        device_class: frequency
        unit_of_measurement: "Hz"

  # HOLDING REGISTERS

      - name: "Therma V operation mode" # 0 cooling 4 heating 3 auto
        unique_id: therma_v_operation_mode
        scan_interval: 5
        address: 0
        slave: 1
        input_type: holding

      - name: "Therma V control mode" # 0 water outlet 1 water inlet 2 room
        unique_id: therma_v_control_mode
        scan_interval: 5
        address: 1
        slave: 1
        input_type: holding

      - name: "Therma V target temperature circuit 1" # 0.1C  ENABLE IN CASE OF AUTOMODE
        unique_id: therma_v_target_temperature_circuit_1
        scan_interval: 5
        address: 2
        slave: 1
        input_type: holding
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V room air temperature circuit 1" # 0.1C
        unique_id: therma_v_room_air_temperature_circuit_1
        scan_interval: 60
        address: 3
        slave: 1
        input_type: holding
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      - name: "Therma V auto mode target temperature delta circuit 1" # 1C
        unique_id: therma_v_auto_mode_target_temperature_delta_circuit_1
        scan_interval: 5
        address: 4
        slave: 1
        input_type: holding
        scale: 1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

      # - name: "Therma V target temperature circuit 2" # 0.1C
      #   scan_interval: 5
      #   address: 5
      #   slave: 1
      #   input_type: holding
      #   scale: 0.1
      #   state_class: measurement
      #   device_class: temperature
      #   unit_of_measurement: "°C"

      # - name: "Therma V room air temperature circuit 2" # 0.1C
      #   scan_interval: 5
      #   address: 6
      #   slave: 1
      #   input_type: holding
      #   scale: 0.1
      #   state_class: measurement
      #   device_class: temperature
      #   unit_of_measurement: "°C"

  #    - name: "Therma V auto mode target temperature delta circuit 2" # 1C
  #      scan_interval: 5
  #      address: 7
  #      slave: 1
  #      input_type: holding
  #      scale: 1
  #      state_class: measurement
  #      device_class: temperature
  #      unit_of_measurement: "°C"

      - name: "Therma V DHW target temperature" # 0.1C
        unique_id: therma_v_dhw_target_temperature
        scan_interval: 5
        address: 8
        slave: 1
        input_type: holding
        scale: 0.1
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"

  #    - name: "Therma V energy state register"
