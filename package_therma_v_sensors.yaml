  # COIL REGISTERS
    switches:
      - name: "Therma V Heating/Cooling on/off"
        unique_id: therma_v_heating_cooling_on_off
        slave: 1
        address: 0
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 0
            state_on: 1
            state_off: 0
            
      - name: "Therma V DHW on/off"
        unique_id: therma_v_dhw_on_off
        slave: 1
        address: 1
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 1
            state_on: 1
            state_off: 0
            
      - name: "Therma V Silent Mode"
        unique_id: therma_v_silent_mode
        slave: 1
        address: 2
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 2
            state_on: 1
            state_off: 0

      - name: "Therma V Trigger DHW disinfection cycle"
        unique_id: therma_v_trigger_dhw_disinfection_cycle
        slave: 1
        address: 3
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
            input_type: coil
            address: 3
            state_on: 1
            state_off: 0

  # DISCRETE REGISTERS
    binary_sensors:
      - name: "Therma V Water flow state" # 0 OK, 1 LOW
        unique_id: therma_v_water_flow_state
        slave: 1
        address: 0
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V water pump state" # 0 OFF, 1 ON
        unique_id: therma_v_water_pump_state
        slave: 1
        address: 1
        scan_interval: 30
        input_type: discrete_input
      
      - name: "Therma V external water pump state" # 0 OFF, 1 ON
        unique_id: therma_v_external_water_pump_state
        slave: 1
        address: 2
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V compressor state" # 0 OFF, 1 ON
        unique_id: therma_v_compressor_state
        slave: 1
        address: 3
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V defrost state" # 0 OFF, 1 ON
        unique_id: therma_v_defrost_state
        slave: 1
        address: 4
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V DHW heating state" # 0 OFF, 1 ON
        unique_id: therma_v_dhw_heating_state
        slave: 1
        address: 5
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V DHW disinfection cycle state" # 0 OFF, 1 ON
        unique_id: therma_v_dhw_disinfection_cycle_state
        slave: 1
        address: 6
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V silent mode state" # 0 OFF, 1 ON
        unique_id: therma_v_silent_mode_state
        slave: 1
        address: 7
        scan_interval: 30
        input_type: discrete_input

