        address: 5
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V DHW disinfection cycle state" # 0 OFF, 1 ON
        unique_id: therma_v_dhw_disinfection_cycle_state
        slave: 1
        address: 6
        scan_interval: 30
        input_type: discrete_input

      - name: "Therma V silent mode state" # 0 OFF, 1 ON
        unique_id: therma_v_silent_mode_state
        slave: 1
        address: 7
        scan_interval: 30
        input_type: discrete_input

