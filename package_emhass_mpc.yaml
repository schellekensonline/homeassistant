# EMHASS package: the quarter-hour MPC (split out of package_emhass.yaml on 2026-10-07).
# rest_command.emhass_naive_mpc_optim is the HTTP layer, automation.emhass_execute_mpc_optimization_auto
# runs it every 15 minutes and publishes the result.
rest_command:
  # Short-horizon MPC optimisation, run every 15 minutes.
  emhass_naive_mpc_optim:
    url: "http://localhost:5000/action/naive-mpc-optim"
    method: POST
    # Same reason as the day-ahead command (package_emhass_dayahead.yaml): give EMHASS room to
    # answer, and enough room for the run that retrains the adjusted-PV model (see there).
    timeout: 90
    content_type: "application/json"
    # The shared payload script builds the body; `emhass_payload` arrives as service data and the
    # fallback intentionally fails inside EMHASS if the caller omits it.
    payload: >-
      {%- set body = emhass_payload | default({'error': 'emhass_payload was not passed by the caller'}) -%}
      {# Dictionaries must be serialised; strings already contain the JSON body. #}
      {{ body if body is string else body | to_json }}

automation:
  - id: emhass_execute_mpc_optimization_auto
    alias: "EMHASS execute MPC optimization auto"
    description: "Triggers EMHASS every 15 minutes for realtime correction and fetches the plan. Also runs right after a Home Assistant restart."
    mode: single
    max_exceeded: silent
    trigger:
      # The prior-heat buffer advances at +2s; start at +5s so this run sees the completed quarter.
      - platform: time_pattern
        minutes: "/15"
        seconds: 5
        id: interval
      - platform: homeassistant
        event: start
        id: ha_start
      # EMHASS coming back is its own event (2026-09-26): after the weekly backup or any other
      # restart, HA can be up minutes before EMHASS answers. Triggering on the health sensor
      # means the first run happens within a minute of EMHASS being ready instead of waiting for
      # the next quarter-hour slot - the difference between a 5-minute gap and an hour.
      - platform: state
        entity_id: binary_sensor.emhass_online
        to: "on"
        id: emhass_up
    condition: []
    action:
      # After a restart: wait until EMHASS answers and the load sensor has real data.
      # EMHASS's published sensors (p_load_forecast and friends) do not survive a
      # Home Assistant restart, so this run recreates them immediately.
      - if:
          - condition: trigger
            id:
              - ha_start
              - emhass_up
        then:
          # A restored sensor can be non-empty while its integration and recorder are not live yet.
          - action: script.emhass_wait_ready
            data:
              grace_seconds: "{{ 120 if trigger.id == 'ha_start' else 30 }}"
          # Republish EMHASS's previous result straight away, so the plan sensors are back
          # within a minute of the restart even if the optimisation below has to wait. It is the
          # plan from before the stop, not a new one - the run that follows replaces it.
          - action: rest_command.emhass_publish
            data: {}
            continue_on_error: true
      # Shared price guard: it logs the problem and returns 'run' or 'skip'.
      - action: script.emhass_price_guard
        data:
          label: "MPC"
        response_variable: price_guard
      - if:
          - condition: template
            # 'run' unless the guard explicitly says otherwise, so a guard that fails to
            # answer does not silently stop the optimisation.
            value_template: "{{ price_guard.decision | default('run') != 'run' }}"
        then:
          - stop: "EMHASS MPC skipped by the price guard"
      # The body comes from script.emhass_build_payload, so both optimisations send the same
      # house; the rest_command itself is only the HTTP layer.
      - action: script.emhass_build_payload
        data:
          plan: mpc
          dhw_booster_enabled: false
        response_variable: mpc_payload
      - action: script.emhass_log_payload_warnings
        data:
          label: "MPC"
      - action: rest_command.emhass_naive_mpc_optim
        data:
          emhass_payload: "{{ mpc_payload.body }}"
        # The response variable is only set when the call succeeded, so an undefined
        # variable means the call never got an answer; an answer with a status other than
        # 200 (EMHASS rejecting the payload) is a failure too. Both get one retry.
        response_variable: mpc_response
        continue_on_error: true
      # Failure path: keep the full thermal model and first reduce only its plan-side minimum
      # on-time, one quarter at a time. The measured elapsed state is never rewritten.
      - if:
          - condition: template
            value_template: >-
              {{ mpc_response is not defined or mpc_response.status | default(0) | int(0) != 200 }}
        then:
          - action: system_log.write
            data:
              level: warning
              message: >-
                {% set c = mpc_response.content | default('') %}EMHASS MPC failed:
                status={{ mpc_response.status | default('no answer') }}
                body={{ (c if c is string else c | tojson)[:200] }}
          # No answer usually means EMHASS is restarting. Wait once and retry the unchanged
          # full thermal payload before treating the failure as an infeasible plan.
          - if:
              - condition: template
                value_template: "{{ mpc_response is not defined }}"
            then:
              - wait_template: "{{ is_state('binary_sensor.emhass_online', 'on') }}"
                timeout: "00:05:00"
                continue_on_timeout: true
              - action: rest_command.emhass_naive_mpc_optim
                data:
                  emhass_payload: "{{ mpc_payload.body }}"
                response_variable: mpc_retry
                continue_on_error: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ mpc_retry is defined
                         and mpc_retry.status | default(0) | int(0) == 200 }}
                then:
                  - action: rest_command.emhass_publish
                    data: {}
                    continue_on_error: true
                  - action: logbook.log
                    data:
                      name: EMHASS
                      message: "MPC recovered after EMHASS became reachable"
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.emhass_last_mpc
                    data:
                      timestamp: "{{ now().timestamp() | int }}"
                  - stop: "MPC recovered after EMHASS became reachable"
          # Any first failure gets one identical retry. Input, HA-data and configuration errors can
          # also be transient, and this bounded retry is cheap compared with an immediate degraded
          # fallback. Only the subsequent countdown is restricted to solver failures.
          - if:
              - condition: state
                entity_id: binary_sensor.emhass_online
                state: "on"
              - condition: template
                value_template: "{{ mpc_retry is not defined }}"
              - condition: template
                value_template: >-
                  {{ mpc_response is defined
                     and mpc_response.status | default(0) | int(0) != 200 }}
            then:
              - action: rest_command.emhass_naive_mpc_optim
                data:
                  emhass_payload: "{{ mpc_payload.body }}"
                response_variable: mpc_retry
                continue_on_error: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ mpc_retry is defined
                         and mpc_retry.status | default(0) | int(0) == 200 }}
                then:
                  - action: rest_command.emhass_publish
                    data: {}
                    continue_on_error: true
                  - action: logbook.log
                    data:
                      name: EMHASS
                      message: "MPC recovered on an identical full-payload retry"
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.emhass_last_mpc
                    data:
                      timestamp: "{{ now().timestamp() | int }}"
                  - stop: "MPC recovered on an identical full-payload retry"
          # Prefer the heat pump over the electric booster. Reduce only the DHW planner minimum
          # first, then enable the booster as the final thermal recovery before dropping models.
          - if:
              - condition: state
                entity_id: binary_sensor.emhass_online
                state: "on"
              - condition: template
                value_template: >-
                  {% set response = mpc_retry if mpc_retry is defined else mpc_response %}
                  {% set content = response.content | default('') if response is defined else '' %}
                  {% set text = content if content is string else content | tojson %}
                  {{ response is defined
                     and response.status | default(0) | int(0) != 200
                     and (('infeasible' in text | lower)
                          or ('user_limit' in text | lower)
                          or ('time limit' in text | lower)
                          or ('solver failed' in text | lower)
                          or ('solver error' in text | lower)
                          or ('unbounded' in text | lower)
                          or ('optimization failed with status' in text | lower)
                          or ('cost function cannot be evaluated' in text | lower)) }}
            then:
              - variables:
                  configured_dhw_steps: >-
                    {{ max(0, ((states('input_number.emhass_dhw_minimum_on_minutes')
                                | float(15) / 15) | round(0, 'ceil') | int)) }}
                  dhw_retry_steps: >-
                    {{ range((configured_dhw_steps | int) - 1, -1, -1) | list }}
              - repeat:
                  for_each: "{{ dhw_retry_steps }}"
                  sequence:
                    - action: script.emhass_build_payload
                      data:
                        plan: mpc
                        dhw_min_on_steps: "{{ repeat.item }}"
                        dhw_booster_enabled: false
                      response_variable: mpc_payload_dhw_reduced
                    - action: rest_command.emhass_naive_mpc_optim
                      data:
                        emhass_payload: "{{ mpc_payload_dhw_reduced.body }}"
                      response_variable: mpc_retry
                      continue_on_error: true
                    - if:
                        - condition: template
                          value_template: >-
                            {{ mpc_retry is defined
                               and mpc_retry.status | default(0) | int(0) == 200 }}
                      then:
                        - action: rest_command.emhass_publish
                          data: {}
                          continue_on_error: true
                        - action: logbook.log
                          data:
                            name: EMHASS
                            message: >-
                              MPC recovered with DHW minimum on-time reduced to
                              {{ repeat.item }} quarter(s), booster disabled
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: input_datetime.emhass_last_mpc
                          data:
                            timestamp: "{{ now().timestamp() | int }}"
                        - stop: "MPC recovered without the DHW booster"
              # The booster remains the last thermal option, with no forced DHW HP quarter.
              - action: script.emhass_build_payload
                data:
                  plan: mpc
                  dhw_min_on_steps: 0
                  dhw_booster_enabled: true
                response_variable: mpc_payload_dhw_booster
              - action: rest_command.emhass_naive_mpc_optim
                data:
                  emhass_payload: "{{ mpc_payload_dhw_booster.body }}"
                response_variable: mpc_retry
                continue_on_error: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ mpc_retry is defined
                         and mpc_retry.status | default(0) | int(0) == 200 }}
                then:
                  - action: rest_command.emhass_publish
                    data: {}
                    continue_on_error: true
                  - action: logbook.log
                    data:
                      name: EMHASS
                      message: "MPC recovered with the DHW booster enabled as final thermal fallback"
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.emhass_last_mpc
                    data:
                      timestamp: "{{ now().timestamp() | int }}"
                  - stop: "MPC recovered with the DHW booster"
          # Count down the planner minimum only to unique constraint values. Once the remaining
          # minimum is already zero, lowering it further cannot change the optimization.
          - if:
              - condition: state
                entity_id: binary_sensor.emhass_online
                state: "on"
              - condition: template
                value_template: >-
                  {% set response = mpc_retry if mpc_retry is defined else mpc_response %}
                  {% set content = response.content | default('') if response is defined else '' %}
                  {% set text = content if content is string else content | tojson %}
                  {{ response is defined
                     and response.status | default(0) | int(0) != 200
                     and (('infeasible' in text | lower)
                          or ('user_limit' in text | lower)
                          or ('time limit' in text | lower)
                          or ('solver failed' in text | lower)
                          or ('solver error' in text | lower)
                          or ('unbounded' in text | lower)
                          or ('optimization failed with status' in text | lower)
                          or ('cost function cannot be evaluated' in text | lower)) }}
            then:
              - variables:
                  configured_steps: >-
                    {{ max(0, ((states('input_number.emhass_space_minimum_on_minutes')
                                | float(60) / 15) | round(0, 'ceil') | int)) }}
                  elapsed_steps: >-
                    {{ (state_attr('binary_sensor.therma_v_hvac_run_active', 'on_timesteps')
                        | int(0))
                       if is_state('binary_sensor.therma_v_hvac_run_active', 'on') else 0 }}
                  retry_steps: >-
                    {{ range((configured_steps | int) - 1,
                             (min((configured_steps | int) - 1, elapsed_steps | int) - 1),
                             -1) | list
                       if (configured_steps | int) > (elapsed_steps | int) else [] }}
              - repeat:
                  for_each: "{{ retry_steps }}"
                  sequence:
                    - action: script.emhass_build_payload
                      data:
                        plan: mpc
                        space_min_on_steps: "{{ repeat.item }}"
                        dhw_min_on_steps: 0
                        dhw_booster_enabled: true
                      response_variable: mpc_payload_reduced
                    - action: rest_command.emhass_naive_mpc_optim
                      data:
                        emhass_payload: "{{ mpc_payload_reduced.body }}"
                      response_variable: mpc_retry
                      continue_on_error: true
                    - if:
                        - condition: template
                          value_template: >-
                            {{ mpc_retry is defined
                               and mpc_retry.status | default(0) | int(0) == 200 }}
                      then:
                        - action: rest_command.emhass_publish
                          data: {}
                          continue_on_error: true
                        - action: logbook.log
                          data:
                            name: EMHASS
                            message: >-
                              MPC recovered with planner minimum on-time reduced to
                              {{ repeat.item }} quarter(s)
                        - action: input_datetime.set_datetime
                          target:
                            entity_id: input_datetime.emhass_last_mpc
                          data:
                            timestamp: "{{ now().timestamp() | int }}"
                        - stop: "MPC recovered with a reduced planner minimum on-time"
          # Only after every plan-side minimum has failed, use the degraded plan without thermal
          # models. This keeps the DHW and heat constraints out of the final recovery only.
          - action: script.emhass_build_payload
            data:
              plan: mpc
              thermal: false
            response_variable: mpc_payload_fallback
          - action: rest_command.emhass_naive_mpc_optim
            data:
              emhass_payload: "{{ mpc_payload_fallback.body }}"
            response_variable: mpc_retry
            continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ mpc_retry is not defined or mpc_retry.status | default(0) | int(0) != 200 }}
                sequence:
                  # Patient retries (2026-09-26): after a restart EMHASS can take minutes to
                  # become usable again (containers coming up, caches loading). Try up to three
                  # more times, two minutes apart, and publish immediately when one succeeds -
                  # a restart then costs minutes instead of an hour, which is the whole point.
                  - repeat:
                      count: 3
                      sequence:
                        - delay:
                            seconds: 120
                        - action: rest_command.emhass_naive_mpc_optim
                          data:
                            emhass_payload: "{{ mpc_payload.body }}"
                          response_variable: mpc_retry
                          continue_on_error: true
                        - if:
                            - condition: template
                              value_template: >-
                                {{ mpc_retry is defined
                                   and mpc_retry.status | default(0) | int(0) == 200 }}
                          then:
                            - action: rest_command.emhass_publish
                              data: {}
                              continue_on_error: true
                            - action: logbook.log
                              data:
                                name: EMHASS
                                message: "MPC succeeded on a later attempt (restart recovery)"
                            # Heartbeat for the watchdog (2026-10-07): a late success is still a
                            # success, so stamp it before this branch stops the automation.
                            - action: input_datetime.set_datetime
                              target:
                                entity_id: input_datetime.emhass_last_mpc
                              data:
                                timestamp: "{{ now().timestamp() | int }}"
                            - stop: "MPC recovered on a later attempt"
                  - action: persistent_notification.create
                    data:
                      title: "EMHASS MPC mislukt"
                      notification_id: emhass_mpc_failed
                      message: >-
                        {% set c1 = mpc_response.content | default('') %}
                        {% set c2 = mpc_retry.content | default('') %}
                        De kwartierrun is mislukt met de volledige warmtemodellen, ook na
                        het verlagen van de plan-side minimum-run tot 0 kwartieren.
                        Eerste poging: {{ mpc_response.status | default('geen antwoord') }}
                        ({{ (c1 if c1 is string else c1 | tojson)[:200] }}).
                        Terugval zonder warmtemodellen:
                        {{ mpc_retry.status | default('geen antwoord') }}
                        ({{ (c2 if c2 is string else c2 | tojson)[:200] }}).
                  - action: logbook.log
                    data:
                      name: EMHASS
                      message: >-
                        MPC failed after reducing planner minimum on-time
                        (first {{ mpc_response.status | default('no answer') }},
                        thermal-free fallback {{ mpc_retry.status | default('no answer') }})
                  - if:
                      - condition: template
                        # EMHASS offline means it is (re)starting: the weekly backup does
                        # `dockers down all` + `up all`, so every stack stops. That is expected,
                        # and the watchdog is the one that warns when the gap gets too long - no
                        # phone notification from the run itself in that case.
                        value_template: "{{ is_state('binary_sensor.emhass_online', 'on') }}"
                    then:
                      - action: notify.mobile_app_iphone_jan
                        data:
                          title: "EMHASS MPC mislukt"
                          message: >-
                            Volledige en verlaagde warmtemodellen plus de terugval faalden
                            ({{ mpc_response.status | default('-') }} en
                            {{ mpc_retry.status | default('-') }}). Details in de melding in HA.
            default:
              - action: persistent_notification.create
                data:
                  title: "EMHASS MPC: terugval gebruikt"
                  notification_id: emhass_mpc_failed
                  message: >-
                    De volledige thermal run bleef mislukken, ook nadat de plan-side
                    minimum-run stapsgewijs was verlaagd. De terugval zonder warmtemodellen
                    slaagde. Er is dus een plan, maar zonder het DHW- en warmtemodel.
              - action: notify.mobile_app_iphone_jan
                data:
                  title: "EMHASS: terugval gebruikt"
                  message: >-
                    Warmtemodellen en verlaagde minimum-run faalden
                    ({{ mpc_response.status | default('-') }}); terugval zonder
                    warmtemodellen werkte. Plan is er, wel gedegradeerd.
      # Heartbeat for the watchdog (2026-10-07): stamp the last *successful* run, so the age
      # measures what we want to know instead of an indirect publication (see the header of
      # package_emhass_watchdog.yaml). The recovered-on-a-later-attempt branch above stamps and
      # stops itself, so this covers the first attempt and the thermal-free fallback.
      - if:
          - condition: template
            value_template: >-
              {{ (mpc_response is defined and mpc_response.status | default(0) | int(0) == 200)
                 or (mpc_retry is defined and mpc_retry.status | default(0) | int(0) == 200) }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.emhass_last_mpc
            data:
              timestamp: "{{ now().timestamp() | int }}"
      - delay:
          seconds: 5
      - action: rest_command.emhass_publish
        data: {}
        # Publishing the previous result is better than aborting the whole run.
        continue_on_error: true
  
