# Therma V control: the "start-hulp" for now. Design 2026-10-10. Step 1: heat and cool;
# the same package will carry the auto-mode help (step 2) and the room temperature control
# (step 3), which is why it is named control rather than startup (2026-10-10).
#
# Why: the pump starts at maximum compressor power for a fixed ~15 minutes. If the controlled
# water temperature reaches setpoint + hysteresis inside that window, the pump does not modulate
# back and switches off. This layer writes a moving water setpoint that keeps the water inside the
# hysteresis band, so the start survives; the demand also stays close to the water, which keeps
# the pump's internal control out of overdrive (a soft start).
#
# Where it sits: the climate template no longer writes Modbus register 2 itself. Its
# `set_temperature` stores the request in `input_number.therma_v_water_target_request`, and the
# writer automation here is the only writer of register 2. Auto mode (register 4, the delta on the
# heating curve) is still written by the template - that is step 2. Room temperature control is
# step 3.
#
# Control law (asymmetric, matching the two hysteresis values in the pump menu, 2026-10-10):
# the pump trips OFF when `water > target + hys_pos` (heat; mirrored in cool) and stops being
# satisfied at `water = target + hys_neg`, with hys_neg negative. Solving both for the target
# gives the same bracket in heat and cool:
#
#     effective = clamp(request, water - hys_pos, water - hys_neg)
#
# The lower bound keeps `water <= target + hys_pos`, so the off-trip cannot be met; the upper
# bound keeps the pump demanding and caps the demand at |hys_neg| above the water (the soft
# start). Set both helpers slightly inside the pump's own values to keep a margin.
#
# The season band from the four min/max helpers is the outer limit, so the band in use is
#
#     water_floor = max(band_min, water - hys_pos)
#     water_ceil  = min(band_max, water - hys_neg)
#
# and in every mode - heat, cool and auto - both ends of that band sit closer to the water
# temperature than the helper alone would put them. Auto is heating-only and therefore reads the
# heat pair (2026-10-11).
#
# Passthrough (effective = request) instead of the clamp when:
#   * the compressor is off - a saturated target sits exactly on the start threshold
#     (`target = water + hys_pos`) and the pump would not start (2026-10-10);
#   * the toggle is off, the pump is off, or the pump is in room control (control mode 2);
#   * request <= the active season's minimum - there the pump may go off on hysteresis, which is
#     exactly what that setting is for. In auto the same thing happens when the asked-for water is
#     at or below `water - hys_pos`, so the layer stops chasing the water downward.

input_number:
  therma_v_startup_hysteresis_pos:
    name: "Therma V startup hysteresis pos"
    min: 0.1
    max: 4
    step: 0.1
    initial: 2.8
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:plus-minus-variant

  # Negative on purpose: it mirrors the pump's own negative hysteresis entry.
  therma_v_startup_hysteresis_neg:
    name: "Therma V startup hysteresis neg"
    min: -4
    max: -0.1
    step: 0.1
    initial: -2.8
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:plus-minus-variant

  # The request the layer steers to: the climate slider writes it (heat/cool/room), and it is the
  # starting point for the clamp. Range covers every mode (cool 10..20, room 15..25, heat 20..35).
  therma_v_water_target_request:
    name: "Therma V water target request"
    min: 10
    max: 35
    step: 1 # The pump only holds whole degrees (measured 2026-10-10: writing 25,5 reads back 25).
    initial: 26 # First-ever value only; Home Assistant restores the last value after that.
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer

  # Auto mode (the heating curve): the pump adds this delta to the curve and publishes the result
  # on register 2. The slider writes this helper, and the layer moves it within -5..+5 to keep the
  # water inside the hysteresis band. Whole degrees, because register 4 is 1 C per step.
  therma_v_auto_delta_request:
    name: "Therma V auto delta request"
    min: -5
    max: 5
    step: 1
    initial: 0 # First-ever value only; Home Assistant restores the last value after that.
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:chart-bell-curve-cumulative

  # The four min/max helpers are also the climate template's mode-dependent write band, so there
  # is one source of truth (2026-10-10). The min is where the layer switches off (passthrough)
  # so the pump may go off on hysteresis. Auto (heating only) reads the heat pair the same way, so
  # the band hugs the water temperature in all three modes (2026-10-11).
  therma_v_min_water_temperature_heat:
    name: "Therma V min water temperature heat"
    min: 10
    max: 45
    step: 0.5
    initial: 20
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  therma_v_max_water_temperature_heat:
    name: "Therma V max water temperature heat"
    min: 10
    max: 45
    step: 0.5
    initial: 35
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

  therma_v_min_water_temperature_cool:
    name: "Therma V min water temperature cool"
    min: 5
    max: 25
    step: 0.5
    initial: 10
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  therma_v_max_water_temperature_cool:
    name: "Therma V max water temperature cool"
    min: 5
    max: 25
    step: 0.5
    initial: 20
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

input_boolean:
  therma_v_controlled_startup:
    name: "Therma V controlled start-up"
    icon: mdi:rocket-launch-outline
    initial: true

template:
  - sensor:
      # The water temperature the pump actually controls: outlet in control mode 0, inlet in
      # control mode 1 (register 1). Room control (2) falls back to the outlet; the algorithm is
      # off there anyway.
      - name: "Therma V controlled water temperature"
        unique_id: therma_v_controlled_water_temperature
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('sensor.therma_v_inlet_temperature')
             and has_value('sensor.therma_v_outlet_temperature')
             and has_value('sensor.therma_v_control_mode') }}
        state: >-
          {% if is_state('sensor.therma_v_control_mode', '1') %}
          {{ states('sensor.therma_v_inlet_temperature') }}
          {% else %}
          {{ states('sensor.therma_v_outlet_temperature') }}
          {% endif %}

      # The value the writer automation puts in register 2 (heat/cool). See the header for the
      # control law. Rounded to a whole degree because the pump truncates register 2 (measured
      # 2026-10-10: writing 25,5 reads back 25, writing 25,8 reads back 25). The direction follows
      # the mode: **heat ceil, cool floor**, because the two modes trip on opposite sides of the
      # band. In heat the off-trip is `water > target + hys_pos`, so the target must not be rounded
      # *down*; in cool it is `water < target + hys_neg`, so it must not be rounded *up*. The sensor
      # therefore shows the value the pump will actually hold, which also makes the writer's
      # register guard an exact comparison.
      - name: "Therma V water setpoint effective"
        unique_id: therma_v_water_setpoint_effective
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('input_number.therma_v_water_target_request')
             and has_value('sensor.therma_v_controlled_water_temperature')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_compressor_hz') }}
        state: >-
          {% set req = states('input_number.therma_v_water_target_request') | float(0) %}
          {% set water = states('sensor.therma_v_controlled_water_temperature') | float(0) %}
          {% set mode = states('sensor.therma_v_operation_mode') %}
          {% set cm = states('sensor.therma_v_control_mode') | int(-1) %}
          {% set hys_pos = states('input_number.therma_v_startup_hysteresis_pos') | float(3) %}
          {% set hys_neg = states('input_number.therma_v_startup_hysteresis_neg') | float(-3) %}
          {% set hz = states('sensor.therma_v_compressor_hz') | float(0) %}
          {% set mode_num = mode | int(-1) %}
          {% set heat = mode_num in [3, 4] %}
          {% set dir = 'floor' if mode_num == 0 else 'ceil' %}
          {% set band_min = (states('input_number.therma_v_min_water_temperature_heat') if heat
                             else states('input_number.therma_v_min_water_temperature_cool')) | float(10) %}
          {% set band_max = (states('input_number.therma_v_max_water_temperature_heat') if heat
                             else states('input_number.therma_v_max_water_temperature_cool')) | float(35) %}
          {% set active = is_state('input_boolean.therma_v_controlled_startup', 'on')
                          and is_state('switch.therma_v_heating_cooling_on_off', 'on')
                          and mode_num in [0, 4]
                          and cm in [0, 1]
                          and hz > 1
                          and req > band_min %}
          {% if not active %}
          {{ req | round(0, dir) | int }}
          {% else %}
          {% set water_floor = max(band_min, water - hys_pos) %}
          {% set water_ceil = min(band_max, water - hys_neg) %}
          {{ min(max(req, water_floor), water_ceil) | round(0, dir) | int }}
          {% endif %}

      # The delta to write on register 4 in auto mode. Auto follows a heating curve, so the
      # reachable water target is `curve +/- 5`; the layer solves for the delta that puts the water
      # where the hysteresis clamp wants it. The heat min/max helpers bound that band exactly as in
      # heat - floor = max(band_min, water - hys_pos), ceiling = min(band_max, water - hys_neg) - so
      # the band hugs the water temperature here too (2026-10-11). Auto only ever heats, so the
      # whole-degree rounding goes up like heat. The curve is derived from the two registers -
      # register 2 is the resulting water target, register 4 the delta the pump applies - verified
      # live 2026-10-10: auto with delta 0 read register 2 = 23, with delta +2 it read 25.
      # Passthrough: the raw request delta when the compressor is off, the toggle is off, the pump
      # is off, the pump is in room control, or the asked-for water is already at/below
      # `water - hys_pos` - in heating that means "let the pump go off on hysteresis".
      - name: "Therma V auto delta effective"
        unique_id: therma_v_auto_delta_effective
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('input_number.therma_v_auto_delta_request')
             and has_value('sensor.therma_v_controlled_water_temperature')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_compressor_hz')
             and has_value('sensor.therma_v_target_temperature_circuit_1')
             and has_value('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1') }}
        state: >-
          {% set req = states('input_number.therma_v_auto_delta_request') | float(0) %}
          {% set water = states('sensor.therma_v_controlled_water_temperature') | float(0) %}
          {% set mode = states('sensor.therma_v_operation_mode') | int(-1) %}
          {% set cm = states('sensor.therma_v_control_mode') | int(-1) %}
          {% set hys_pos = states('input_number.therma_v_startup_hysteresis_pos') | float(3) %}
          {% set hys_neg = states('input_number.therma_v_startup_hysteresis_neg') | float(-3) %}
          {% set hz = states('sensor.therma_v_compressor_hz') | float(0) %}
          {% set applied = states('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1') | float(0) %}
          {% set water_target = states('sensor.therma_v_target_temperature_circuit_1') | float(0) %}
          {% set band_min = states('input_number.therma_v_min_water_temperature_heat') | float(20) %}
          {% set band_max = states('input_number.therma_v_max_water_temperature_heat') | float(35) %}
          {% set curve = water_target - applied %}
          {% set water_request = curve + req %}
          {% set water_floor = max(band_min, water - hys_pos) %}
          {% set water_ceil = min(band_max, water - hys_neg) %}
          {% set active = is_state('input_boolean.therma_v_controlled_startup', 'on')
                          and is_state('switch.therma_v_heating_cooling_on_off', 'on')
                          and mode == 3
                          and cm in [0, 1]
                          and hz > 1
                          and water_request > water - hys_pos %}
          {% if not active %}
          {{ req | round(0, 'ceil') | int }}
          {% else %}
          {% set desired = min(max(water_request, water_floor), water_ceil) %}
          {{ min(max(desired - curve, -5), 5) | round(0, 'ceil') | int }}
          {% endif %}

automation:
  # The only writer of Modbus register 2 (heat/cool/room). Four ways in: the effective value
  # changing, the register changing (the pump's own logic, or a manual change on the unit), a mode
  # change, and a 15-minute heartbeat as the safety net (a Home Assistant restart or a Modbus
  # hiccup). The mode trigger is what closes the gap found live on 2026-10-10: switching auto ->
  # heat leaves the pump's own heating-curve value behind in register 2 (22) while our effective
  # value does not change (26), so a change trigger on the effective value alone never fires. (A
  # template trigger on the divergence was tried first and does not work: a template trigger that is
  # already true at load time never starts its `for:` timer.) The write is guarded by a comparison
  # with the register, so our own writes - and the pump's own clamping, e.g. asking 35 lands as 30 -
  # cannot feed back into a write loop. Auto mode is skipped - register 4 is step 2.
  - id: therma_v_apply_water_setpoint_auto
    alias: "Therma V apply water setpoint auto"
    description: "Writes the controlled-start-up water setpoint (register 2) or the auto delta (register 4)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.therma_v_water_setpoint_effective
      - trigger: state
        entity_id: sensor.therma_v_auto_delta_effective
      - trigger: state
        entity_id: sensor.therma_v_target_temperature_circuit_1
      - trigger: state
        entity_id: sensor.therma_v_auto_mode_target_temperature_delta_circuit_1
      - trigger: state
        entity_id: sensor.therma_v_operation_mode
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: "{{ states('sensor.therma_v_operation_mode') | int(-1) in [0, 3, 4] }}"
    actions:
      - choose:
          # Auto mode: the delta on register 4. It is a signed 16-bit register, so a negative
          # delta goes out as two's complement - the same as the climate template does.
          - conditions:
              - condition: template
                value_template: "{{ states('sensor.therma_v_operation_mode') | int(-1) == 3 }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states('sensor.therma_v_control_mode') | is_number
                         and states('sensor.therma_v_auto_delta_effective') | is_number
                         and (states('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1') | float(0)
                              - states('sensor.therma_v_auto_delta_effective') | float(0)) | abs > 0.5 }}
                then:
                  - variables:
                      delta: "{{ states('sensor.therma_v_auto_delta_effective') | int(0) }}"
                  - action: modbus.write_register
                    data:
                      address: 4
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: "{{ delta + 65536 if delta < 0 else delta }}"
        default:
          # Heat / cool / room control: the water setpoint on register 2. Only write when the
          # register really differs from the effective value, so our own writes (and the pump's own
          # truncation) cannot feed back into a write loop.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.therma_v_operation_mode') | int(-1) in [0, 4]
                     and states('sensor.therma_v_control_mode') | is_number
                     and states('sensor.therma_v_water_setpoint_effective') | is_number }}
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {% set registered = states('sensor.therma_v_target_temperature_circuit_1') %}
                      {% set effective = states('sensor.therma_v_water_setpoint_effective') | float(0) %}
                      {{ not (registered | is_number) or ((registered | float(0)) - effective) | abs > 0.5 }}
                then:
                  - action: modbus.write_register
                    data:
                      address: 2
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: "{{ (states('sensor.therma_v_water_setpoint_effective') | float(0) * 10) | int }}"
