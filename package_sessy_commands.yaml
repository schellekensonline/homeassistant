#  https://forum.sessy.nl/home-assistant/quick-start-sessy-integreren-met-home-assistant/
#  https://forum.sessy.nl/home-assistant/scripts-om-sessys-aan-uit-te-zetten-vanuit-ha/

# STRATEGY [ POWER_STRATEGY_NOM, POWER_STRATEGY_ROI, POWER_STRATEGY_API, POWER_STRATEGY_IDLE, POWER_STRATEGY_SESSY_CONNECT, POWER_STRATEGY_ECO ]

rest_command:
  # sessy_get_active_strategy:
  #   url: "http://{{host}}/api/v1/power/active_strategy"
  #   method: GET
  #   headers:
  #     authorization: "Basic {{auth | base64_encode }}"

  sessy_set_active_strategy:
    url: "http://{{host}}/api/v1/power/active_strategy"
    method: POST
    headers:
      authorization: "Basic {{auth | base64_encode }}"
    content_type: "application/json"
    payload: >-
      {{ { 
            "strategy": strategy
          }  | to_json }}

  sessy_set_ns:
    url: "http://{{host}}/api/v1/eol/ns"
    method: POST
    headers:
      authorization: "Basic {{auth | base64_encode }}"
    content_type: "application/json"
    payload: >-
      {{  {
            "inverters": [
              {
                "inverter": inverter | int,
                "setpoint": setpoint | int 
              }
            ],
            "stop_override": stop_override | bool
          } | to_json }}

  # sessy_get_ns:
  #   url: "http://{{host}}/api/v1/eol/ns"
  #   method: GET
  #   headers:
  #     authorization: "Basic {{auth | base64_encode }}"


script:
  sessy_set_strategy:
    sequence:
      - action: rest_command.sessy_set_active_strategy
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          strategy: '{{strategy}}'

  # sessy_get_strategy:
  #   sequence:
  #     - action: rest_command.sessy_get_active_strategy
  #       data:
  #         host: !secret sessy_url
  #         auth: !secret sessy_auth
  #       response_variable: strategy

  # sessy_get_ns:
  #   sequence:
  #     - action: rest_command.sessy_get_active_strategy
  #       data:
  #         host: !secret sessy_url
  #         auth: !secret sessy_auth
  #       response_variable: ns

  sessy_set_power:
    sequence:
      # - action: rest_command.sessy_set_active_strategy
      #   data:
      #     host: !secret sessy_url
      #     auth: !secret sessy_auth
      #     strategy: "POWER_STRATEGY_API"
      - action: rest_command.sessy_set_ns
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          stop_override: >
                {% if setpoint | int == 0 %}
                  {{ true }}
                {% else %}
                  {{ false }}
                {% endif %}
          inverter: '{{inverter}}'
          setpoint: '{{setpoint}}'


input_select:
  sessy_strategy:
    name: "Sessy Strategy"
    icon: mdi:battery-cog
    options:
      - "POWER_STRATEGY_NOM"
      - "POWER_STRATEGY_ROI"
      - "POWER_STRATEGY_API"
      - "POWER_STRATEGY_IDLE"
      - "POWER_STRATEGY_SESSY_CONNECT"
      - "POWER_STRATEGY_ECO"

input_number:
  sessy_power_setpoint_inv1:
    name: "Sessy power setpoint L1"
    icon: mdi:transmission-tower
    min: -2500  # Maximaal leveren/ontladen (afhankelijk van je Sessy model, pas aan indien nodig)
    max: 2500   # Maximaal laden
    step: 100
    unit_of_measurement: W
    mode: box
  sessy_power_setpoint_inv2:
    name: "Sessy power setpoint L2"
    icon: mdi:transmission-tower
    min: -2500  # Maximaal leveren/ontladen (afhankelijk van je Sessy model, pas aan indien nodig)
    max: 2500   # Maximaal laden
    step: 100
    unit_of_measurement: W
    mode: box
  sessy_power_setpoint_inv3:
    name: "Sessy power setpoint L3"
    icon: mdi:transmission-tower
    min: -2500  # Maximaal leveren/ontladen (afhankelijk van je Sessy model, pas aan indien nodig)
    max: 2500   # Maximaal laden
    step: 100
    unit_of_measurement: W
    mode: box

automation:
  - id: sessy_set_power_inv1_auto
    alias: "Sessy set power inv1 auto"
    description: "Set power on inverter 1"
    trigger:
      - platform: state
        entity_id: input_number.sessy_power_setpoint_inv1
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - action: script.sessy_set_power
        data:
          inverter: 1 
          setpoint: "{{ trigger.to_state.state | int }}"
    mode: single

  - id: sessy_set_power_inv2_auto
    alias: "Sessy set power inv2 auto"
    description: "Set power on inverter 2"
    trigger:
      - platform: state
        entity_id: input_number.sessy_power_setpoint_inv2
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - action: script.sessy_set_power
        data:
          inverter: 2 
          setpoint: "{{ trigger.to_state.state | int }}"
    mode: single

  - id: sessy_set_power_inv3_auto
    alias: "Sessy set power inv3 auto"
    description: "Set power on inverter 3"
    trigger:
      - platform: state
        entity_id: input_number.sessy_power_setpoint_inv3
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - action: script.sessy_set_power
        data:
          inverter: 3 
          setpoint: "{{ trigger.to_state.state | int }}"
    mode: single


  - id: sessy_synchronise_active_strategy_auto
    alias: "Sessy synchronise active strategy auto"
    description: "Synchronizes input select with sessy"
    trigger:
      - platform: state
        entity_id: sensor.sessy_active_strategy
    condition:
      - condition: template
        # Voorkom fouten bij opstarten
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
      - condition: template
        # Pas de input_select ALLEEN aan als deze momenteel iets anders aangeeft dan de sensor
        value_template: "{{ states('input_select.sessy_strategy') != trigger.to_state.state }}"
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.sessy_strategy
        data:
          option: "{{ trigger.to_state.state }}"
    mode: single


  - id: sessy_set_active_strategy_auto
    alias: "Sessy set active strategy auto"
    description: "Sets Sessy active strategy when input select changes"
    trigger:
      - platform: state
        entity_id: input_select.sessy_strategy
    condition:
      - condition: template
        # Voorkomt dat de automatisering triggert bij een Home Assistant herstart (wanneer status 'unknown' of 'unavailable' is)
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - action: script.sessy_set_strategy
        data:
          strategy: "{{ trigger.to_state.state }}"
    mode: single