input_select:
  sessy_strategy:
    name: "Sessy Strategy"
    icon: mdi:battery-cog
    options:
      - "POWER_STRATEGY_NOM"
      - "POWER_STRATEGY_ROI"
      - "POWER_STRATEGY_API"
      - "POWER_STRATEGY_IDLE"
      - "POWER_STRATEGY_SESSY_CONNECT"
      - "POWER_STRATEGY_ECO"

input_number:
  sessy_power_setpoint:
    name: "Sessy power setpoint"
    icon: mdi:transmission-tower
    min: -6000  # Maximaal laden
    max: 6000   # Maximaal ontladem
    step: 100
    unit_of_measurement: W
    mode: box
