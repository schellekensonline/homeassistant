  #               "inverter_index": 2,
  #               "setpoint": setpoint_l3
  #             }
  #           ]
  #         }  | to_json }}

script:
  sessy_set_strategy:
    sequence:
      - action: rest_command.sessy_set_active_strategy
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          strategy: '{{strategy}}'

  sessy_set_power:
    sequence:
      - action: rest_command.sessy_set_power_setpoint
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          setpoint: '{{setpoint}}'

