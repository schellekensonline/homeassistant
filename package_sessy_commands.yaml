# Sessy battery control over its REST API: set the active strategy and the power setpoint.
# This is the low-level layer (scripts plus input helpers); the logic that decides which
# strategy to use lives in package_sessy_algorithms.yaml.
#
# Reference material (Dutch forum threads):
#  https://forum.sessy.nl/home-assistant/quick-start-sessy-integreren-met-home-assistant/
#  https://forum.sessy.nl/home-assistant/scripts-om-sessys-aan-uit-te-zetten-vanuit-ha/

# Valid values for the strategy field of the Sessy API:
# POWER_STRATEGY_NOM, POWER_STRATEGY_ROI, POWER_STRATEGY_API, POWER_STRATEGY_IDLE,
# POWER_STRATEGY_SESSY_CONNECT, POWER_STRATEGY_ECO

rest_command:
  sessy_set_active_strategy:
    url: "http://{{host}}/api/v1/power/active_strategy"
    method: POST
    headers:
      authorization: "Basic {{auth | base64_encode }}"
    content_type: "application/json"
    payload: >-
      {{ { 
            "strategy": strategy
          }  | to_json }}

  sessy_set_power_setpoint:
    url: "http://{{host}}/api/v1/power/setpoint"
    method: POST
    headers:
      authorization: "Basic {{auth | base64_encode }}"
    content_type: "application/json"
    payload: >-
      {{  {
            "setpoint": setpoint | int
          } | to_json }}


  sessy_set_power_setpoint_distributed:
    url: "http://{{host}}/api/v1/power/setpoint"
    method: POST
    headers:
      authorization: "Basic {{auth | base64_encode }}"
    content_type: "application/json"
    payload: >-
      {{  {
            "distributed": [
              {
                "inverter_index": 0,
                "setpoint": setpoint_l1
              },
              {
                "inverter_index": 1,
                "setpoint": setpoint_l2
              },
              {
                "inverter_index": 2,
                "setpoint": setpoint_l3
              }
            ]
          }  | to_json }}

script:
  sessy_set_strategy:
    sequence:
      - action: rest_command.sessy_set_active_strategy
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          strategy: '{{strategy}}'

  sessy_set_power:
    sequence:
      - action: rest_command.sessy_set_power_setpoint
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          setpoint: '{{setpoint}}'

  sessy_set_power_distributed:
    fields:
      setpoint_l1: {}
      setpoint_l2: {}
      setpoint_l3: {}
    sequence:
      - action: rest_command.sessy_set_power_setpoint_distributed
        data:
          host: !secret sessy_url
          auth: !secret sessy_auth
          setpoint_l1: '{{setpoint_l1}}'
          setpoint_l2: '{{setpoint_l2}}'
          setpoint_l3: '{{setpoint_l3}}'
 
input_select:
  sessy_strategy:
    name: "Sessy Strategy"
    icon: mdi:battery-cog
    options:
      - "POWER_STRATEGY_NOM"
      - "POWER_STRATEGY_ROI"
      - "POWER_STRATEGY_API"
      - "POWER_STRATEGY_IDLE"
      - "POWER_STRATEGY_SESSY_CONNECT"
      - "POWER_STRATEGY_ECO"

input_number:
  sessy_power_setpoint:
    name: "Sessy power setpoint"
    icon: mdi:transmission-tower
    min: -6000  # maximum charge
    max: 6000   # maximum discharge
    step: 100
    unit_of_measurement: W
    mode: box

automation:
  - id: sessy_set_power_auto
    alias: "Sessy set power auto"
    description: "Set power on total system for strategy API"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.sessy_power_setpoint
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      # A non-zero setpoint only makes sense in API mode, so switch the strategy over first.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ (trigger.to_state.state | int | abs) > 0 }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.sessy_strategy
                data:
                  option: "POWER_STRATEGY_API"
              - delay: "00:00:05"
      - action: script.sessy_set_power
        data:
          setpoint: "{{ trigger.to_state.state | int }}"

  - id: sessy_synchronise_active_strategy_auto
    alias: "Sessy synchronise active strategy auto"
    description: "Synchronizes input select with sessy"
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.sessy_active_strategy
    conditions:
      - condition: template
        # Avoid errors during startup
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
      - condition: template
        # Only update the input_select when it currently differs from the sensor
        value_template: "{{ states('input_select.sessy_strategy') != trigger.to_state.state }}"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.sessy_strategy
        data:
          option: "{{ trigger.to_state.state }}"

  - id: sessy_set_active_strategy_auto
    alias: "Sessy set active strategy auto"
    description: "Sets Sessy active strategy when input select changes"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.sessy_strategy
    conditions:
      - condition: template
        # Prevents the automation from firing on a Home Assistant restart (state 'unknown' or 'unavailable')
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - action: script.sessy_set_strategy
        data:
          strategy: "{{ trigger.to_state.state }}"
      # Outside API mode the setpoint is ignored, so reset the slider to 0
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not is_state('input_select.sessy_strategy','POWER_STRATEGY_API') }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.sessy_power_setpoint
                data:
                  value: 0
