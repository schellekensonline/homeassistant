template:
  - switch:
      - name: "Sessy Auto API strategy enable"
        unique_id: sessy_auto_api_strategy_enable
        turn_on:
          - action: input_select.select_option
            target:
              entity_id: input_select.sessy_strategy
            data:
              option: "POWER_STRATEGY_API"
        turn_off:
          - action: input_select.select_option
            target:
              entity_id: input_select.sessy_api_strategy
            data:
              option: "Manual"
          - action: script.sessy_set_power
            data:
              setpoint: "{{ 0 | int }}"

  - number:
      - name: "Sessy API strategy zom state"  # State of ZoM integration algorithm
        unique_id: sessy_api_strategy_zom_state
        unit_of_measurement: "W"
        min: "{{ -1 * (states('input_number.sessy_api_strategy_max_charge_power')    | int) }}"
        max: "{{       states('input_number.sessy_api_strategy_max_discharge_power') | int  }}"
        step: 1
        set_value:
          - variables:
              decay:      "{{ 1-5/(30*60) }}" # 5s update, 30min decay --> b~1-Ts/tau
              soc_state: "{{ states('sensor.sessy_battery_state_of_charge') | float(50) | round(0) }}"
              zom_state:  "{{states('number.sessy_api_strategy_zom_state')  | round(0) }}"
              peak_state: "{{states('number.sessy_api_strategy_zom_peak_state') | round(2) }}"
              nom_power:  "{{states('input_number.sessy_api_strategy_inverter_nominal_power') | round(0) }}"
              hyst_power:  "{{states('input_number.sessy_api_strategy_inverter_hysteresis_power') | round(0) }}"
              num_active:  "{{states('number.sessy_api_strategy_active_inverters') | round(0) }}"
              zom_sat:    "{{ (soc_state >= 98 and zom_state < -0.5*nom_power) or (soc_state <= 2 and zom_state > 0.5*nom_power) }}" 
              num_active_next: >-
                {% if nom_power <= 0 %} {# prevent division by zero #}
                  {{ 0 | int(0) }}  
                {% else %}
                  {% set num_up   = min( 3, 1 + ((peak_state/(nom_power+hyst_power)) | int(0)) ) | int(0) %}
                  {% set num_down = min( 3, 1 + ((peak_state/max(nom_power-hyst_power,0)) | int(0)) ) | int(0) %}
                  {% if num_up > num_active %}
                    {{ num_up }}
                  {% elif num_down < num_active %}
                    {{ num_down }}
                  {% else %}
                    {{ num_active }}  
                  {% endif %}
                {% endif %}
              setpoint: >-
                {% if zom_sat %}
                  {{ 0 }}
                {% else %}
                  {{ zom_state / num_active_next }} {# divide across the target active inverters #}
                {% endif %}
          # Update number of active inverters
          - action: number.set_value
            target:
              entity_id: number.sessy_api_strategy_active_inverters
            data:
              value: "{{ num_active_next }}"
          # Update peak power detector
          - action: number.set_value
            target:
              entity_id: number.sessy_api_strategy_zom_peak_state
            data:
              value: >- 
                {% if zom_sat %} {# peak detector tracks |zom_state|, so the right number of inverters is active when saturation ends #}
                  {{ zom_state | abs | round(2) }}
                {% else %}
                  {{ max(zom_state | abs, decay*peak_state) | round(2) }}
                {% endif %}
          - variables:
              active_inverter_event_data: >-
                {# Per-inverter totals; the entity ids start with sessy_inv_, the same as the
                   other per-inverter sensors. Earlier this read sensor.sessy_l1_... which does
                   not exist, so every phase came out as 0 Wh and the phases were never really
                   balanced (2026-09-13). #}
                {% set tot_energy_l1 = states('sensor.sessy_inv_l1_imported_energy') | float(0) + states('sensor.sessy_inv_l1_exported_energy') | float(0) %}
                {% set tot_energy_l2 = states('sensor.sessy_inv_l2_imported_energy') | float(0) + states('sensor.sessy_inv_l2_exported_energy') | float(0) %}
                {% set tot_energy_l3 = states('sensor.sessy_inv_l3_imported_energy') | float(0) + states('sensor.sessy_inv_l3_exported_energy') | float(0) %}
                {% set active_l1 = state_attr('number.sessy_api_strategy_active_inverters', 'l1_active') | bool(false) %}
                {% set active_l2 = state_attr('number.sessy_api_strategy_active_inverters', 'l2_active') | bool(false) %}
                {% set active_l3 = state_attr('number.sessy_api_strategy_active_inverters', 'l3_active') | bool(false) %}
                {% set active_count = active_l1 + active_l2 + active_l3 %}

                {# Keep the current phase assignment while the desired count is unchanged. #}
                {% if num_active_next != active_count %}
                  {% set active_l1 = false %}
                  {% set active_l2 = false %}
                  {% set active_l3 = false %}

                {% if num_active_next == 1 %}
                  {% if tot_energy_l1 <= tot_energy_l2 and tot_energy_l1 <= tot_energy_l3 %}
                    {% set active_l1 = true %}
                  {% elif tot_energy_l2 <= tot_energy_l3 %}
                    {% set active_l2 = true %}
                  {% else %}
                    {% set active_l3 = true %}
                  {% endif %}
                {% elif num_active_next == 2 %}
                  {# Deactivate the highest-energy inverter; ties prefer l3, then l2. #}
                  {% if tot_energy_l3 >= tot_energy_l1 and tot_energy_l3 >= tot_energy_l2 %}
                    {% set active_l1 = true %}
                    {% set active_l2 = true %}
                  {% elif tot_energy_l2 >= tot_energy_l1 and tot_energy_l2 >= tot_energy_l3 %}
                    {% set active_l1 = true %}
                    {% set active_l3 = true %}
                  {% else %}
                    {% set active_l2 = true %}
                    {% set active_l3 = true %}
                  {% endif %}
                {% elif num_active_next >= 3 %}
                  {% set active_l1 = true %}
                  {% set active_l2 = true %}
                  {% set active_l3 = true %}
                {% endif %}
                {% endif %}
                {{ {
                  "l1_active": active_l1,
                  "l2_active": active_l2,
                  "l3_active": active_l3
                } | to_json }}
          # Update active inverters
          - event: update_active_inverters
            event_data:
              l1_active: "{{ (active_inverter_event_data | from_json).l1_active }}"
              l2_active: "{{ (active_inverter_event_data | from_json).l2_active }}"
              l3_active: "{{ (active_inverter_event_data | from_json).l3_active }}"
          # Update number setpoints
          - action: script.sessy_set_power_distributed
            data:
              setpoint_l1: "{{ setpoint if (active_inverter_event_data | from_json).l1_active else 0 }}"
              setpoint_l2: "{{ setpoint if (active_inverter_event_data | from_json).l2_active else 0 }}"
              setpoint_l3: "{{ setpoint if (active_inverter_event_data | from_json).l3_active else 0 }}"

  - number:
      - name: "Sessy API strategy zom peak state"  # State of ZoM integration algorithm
        unique_id: sessy_api_strategy_zom_peak_state
        unit_of_measurement: "W"
        min: 0
        max: "{{ max(states('input_number.sessy_api_strategy_max_discharge_power') | int, states('input_number.sessy_api_strategy_max_charge_power') | int) }}"
        step: 0.01
        set_value: []

  - trigger:
      - trigger: event
        event_type: update_active_inverters
    number:
      - name: "Sessy API strategy active inverters"  # number of active inverters
        unique_id: sessy_api_strategy_active_inverters
        min: 0
        max: 3
        step: 1
        set_value: []
        attributes:
          l1_active: >-
            {{ trigger.event.data.l1_active | default(false) | bool }}
          l2_active: >-
            {{ trigger.event.data.l2_active | default(false) | bool }}
          l3_active: >-
            {{ trigger.event.data.l3_active | default(false) | bool }}

  - trigger:
      - trigger: state
        entity_id:
          - sensor.sessy_battery_state_of_charge
          - input_number.sessy_auto_api_strategy_battery_capacity_wh
          - sensor.energy_production_today_remaining_east
          - sensor.energy_production_today_remaining_west
          - sensor.average_daily_energy_used_in_home
          - sensor.today_s_energy_used_in_home
          - input_number.night_energy_in_percent_of_daily_used_in_home
          - sensor.electricity_buying_price
          - input_number.sessy_pv_forecast_next_day_wh
          - input_number.sessy_api_strategy_pv_forecast_bias
        not_to:
          - unknown
          - unavailable
      # Safety net: recompute every 15 minutes. Without it the sensor keeps its old value
      # whenever a trigger is missed during the startup order (for example when the 7-day
      # average is only rebuilt from the database after this sensor has been created).
      - trigger: time_pattern
        minutes: "/15"
    sensor:
      # The entity id stays sessy_api_strategy_estimated_energy_surplus (the Utilities card and
      # the automations point at it); only the friendly name follows the wider content, because
      # the state is still the surplus while the attributes now carry the whole daily energy
      # budget (2026-09-14).
      - name: "Sessy energy surplus"
        unique_id: sessy_api_strategy_estimated_energy_surplus
        state_class: measurement
        unit_of_measurement: "pu"
        # availability: >
        #   {% set current = states('sensor.electricity_buying_price') | float("unknown") %}
        #   {{ current|is_number }}
        # Time left for the day #}
        # set seconds_left   = ((now().replace(hour=0,minute=0,second=0,microsecond=0) + timedelta(days=1)) - now()).total_seconds() #}
        # set pu_day_left    = max(seconds_left/86400, 0.05) #}  
        # set daily_energy_remain_wh = 11000  * pu_day_left #}
        variables:
          soc:            "{{ states('sensor.sessy_battery_state_of_charge') | float(50) }}"
          batt_cap_wh:    "{{ states('input_number.sessy_auto_api_strategy_battery_capacity_wh') | float(15000) }}"
          batt_free_wh:   "{{ max(((100 - soc) / 100) * batt_cap_wh * 0.9 , 1) }}" # clip to 1 min. to prevent div 
          batt_remain_wh: "{{ (soc / 100) * batt_cap_wh * 0.9 }}"
          solar_remain_east: "{{ states('sensor.energy_production_today_remaining_east') | float(0) }}"
          solar_remain_west: "{{ states('sensor.energy_production_today_remaining_west') | float(0) }}"
          solar_remain_wh:   "{{ (solar_remain_west + solar_remain_east)*1000 }}"
          daily_use:  "{{ states('sensor.average_daily_energy_used_in_home')  | float(0) }}"
          # Fall back to the default 25% when the helper is unknown, so a startup-order
          # problem cannot silently drop the night reserve to zero. The helper has no
          # dashboard card on purpose: the value is a house constant that stays at 25%.
          night_pct:  "{{ states('input_number.night_energy_in_percent_of_daily_used_in_home') | float(25) }}"
          todays_use: "{{ states('sensor.today_s_energy_used_in_home') | float(0) }}"

          # The reserve is the daily use plus the night part (night_pu * daily_use), minus what the
          # house already used today, and never drops below that night part. At night_pu = 0.25 the
          # reserve runs from 125% of the daily use after midnight down to 25% at the end of the
          # day, so the battery is filled ahead of the evening. Clipped to at least 1 Wh.
          night_pu: "{{ min(max(night_pct / 100 ,0),1) }}"
          daily_energy_remain_wh: "{{ max( (daily_use*(1+night_pu) - todays_use)*1000 , night_pu * daily_use * 1000 , 1) }}"
          # Signed since 2026-09-14: positive means the pack is ahead of the reserve for the rest
          # of today plus tonight, negative means it is behind. The auto strategy no longer uses
          # this value (it gates on the Wh volumes below); the clamp at 0 was what hid how far
          # behind the pack could be.
          charge_surplus: "{{ ((batt_remain_wh - daily_energy_remain_wh) / daily_energy_remain_wh) | round(2)}}"
          solar_surplus:  "{{ max( (solar_remain_wh - daily_energy_remain_wh) / batt_free_wh, 0) | round(2)}}"

          # The same information as volumes in Wh, so the strategy gates can reason about how
          # much energy is involved instead of only about ratios (2026-09-14):
          # - solar_to_pack_wh: PV that is still left for the battery after the house need
          # - buy_room_wh:      free capacity that the remaining PV will NOT fill; the only room
          #                     where a grid buy does not simply push free PV out
          # - soc_target:       the SoC that belongs to remain + buy_room (ceiling for a buy);
          #                     100% when the net price is negative, then the buy is pure profit
          # - sellable_wh:      the part of the pack above today/tonight's need (sellable)
          usable_wh: "{{ max(batt_cap_wh * 0.9, 1) }}"
          # The PV that is still to come before the next trade. After sunset (and in the stale
          # midnight window, when the "today remaining" sensors read 0 until their first update)
          # that is tomorrow's forecast, not today's empty remainder: PV that comes tomorrow fills
          # the pack just as well, so buying then would still push free PV out (audit 2026-09-14).
          pv_next_day_wh: "{{ states('input_number.sessy_pv_forecast_next_day_wh') | float(0) }}"
          pv_incoming_wh: "{{ solar_remain_wh if solar_remain_wh > 0 else pv_next_day_wh }}"
          # Forecast misses must not create phantom buy room, so the buy room uses an optimistic
          # PV estimate. The one measured sample (2026-09-14: 18.5 kWh forecast, 23.2 kWh real)
          # suggests ~1.2; the plain forecast still drives solar_surplus and the sensor state.
          pv_bias: "{{ states('input_number.sessy_api_strategy_pv_forecast_bias') | float(1.2) }}"
          solar_to_pack_wh: "{{ max(pv_incoming_wh * pv_bias - daily_energy_remain_wh, 0) }}"
          buy_room_wh: "{{ max(batt_free_wh - min(solar_to_pack_wh, batt_free_wh), 0) }}"
          sellable_wh: "{{ max(batt_remain_wh - daily_energy_remain_wh, 0) }}"
          buy_price_now: "{{ states('sensor.electricity_buying_price') | float(1) }}"
          forced_buy_price: "{{ states('input_number.sessy_auto_api_strategy_min_forced_buy_price') | float(-0.001) }}"
          soc_target: "{{ 100 if buy_price_now <= forced_buy_price else min(100 * (daily_energy_remain_wh + buy_room_wh) / usable_wh, 100) }}"
        state: >-
          {{ max(charge_surplus, solar_surplus) | round(2) }}
        attributes:
          charge_surplus: >-
            {{ charge_surplus }}
          solar_surplus: >-
            {{ solar_surplus }}
          remain_wh: >-
            {{ daily_energy_remain_wh | round(0) }}
          solar_remain_wh: >-
            {{ solar_remain_wh | round(0) }}
          batt_remain_wh: >-
            {{ batt_remain_wh | round(0) }}
          batt_free_wh: >-
            {{ batt_free_wh | round(0) }}
          usable_wh: >-
            {{ usable_wh | round(0) }}
          solar_to_pack_wh: >-
            {{ solar_to_pack_wh | round(0) }}
          pv_incoming_wh: >-
            {{ pv_incoming_wh | round(0) }}
          pv_bias: >-
            {{ pv_bias }}
          buy_room_wh: >-
            {{ buy_room_wh | round(0) }}
          sellable_wh: >-
            {{ sellable_wh | round(0) }}
          soc_target: >-
            {{ soc_target | round(1) }}
              

input_select:
  sessy_api_strategy:
    name: "Sessy API Strategy"
    icon: mdi:battery-cog
    options:
      - "Manual"
      - "Zero on Meter"
      - "Zero on Meter Support"
      - "Zero on Meter Charge"
      - "Proportional Discharge"
      - "Proportional Charge"

input_number:
  # FOR AUTO API STRATEGY 
  sessy_auto_api_strategy_buy_pct: # e-price percent to start proportional charging (solar / buying)
    name: "Sessy API buy threshold (Price %)"
    min: 0
    max: 50
    step: 1
    # initial: 25
    mode: box
    unit_of_measurement: "%"
  sessy_auto_api_strategy_sell_pct: # e-price percent to start proportional discharging (selling)
    name: "Sessy API sell threshold (Price %)"
    min: 50
    max: 100
    step: 1
    # initial: 75
    mode: box
    unit_of_measurement: "%"
  sessy_auto_api_strategy_min_spread: # price spread in EURO to start proportional trading, active buying
    name: "Sessy API minimum price spread"
    min: 0
    max: 100  # Redicilous large value
    step: 0.005
    # initial: 0.22
    mode: box
    unit_of_measurement: "€"
  sessy_auto_api_strategy_min_forced_buy_price:
    # Net buying-price threshold for forced charging. Must stay negative: buy only when the
    # price is actually negative, not merely low.
    name: "Sessy API minimum forced buy price"
    min: -100 # Redicilous large value
    max: -0.001
    step: 0.001
    # initial: -0.15
    mode: box
    unit_of_measurement: "€"
  sessy_auto_api_strategy_battery_capacity_wh: # Installed capacity of the battery in Wh, used to calculate remaining capacity for proportional trading
    name: "Sessy API usable Capacity"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    initial: 15000
    mode: box
    unit_of_measurement: "Wh"
  # Both surplus margins are volume thresholds for the auto strategy since 2026-09-14: they are
  # a fraction of the remaining need (daily_energy_remain_wh) and decide at what point a buy
  # room or a sellable surplus counts as clear.
  sessy_api_strategy_surplus_margin_charge:
    name: "Sessy API surplus margin charge"
    min: 0
    max: 10 
    step: 0.1
    # initial: 1
    mode: box
    unit_of_measurement: "pu"
  sessy_api_strategy_surplus_margin_discharge:
    name: "Sessy API surplus margin discharge"
    min: 0
    max: 10 
    step: 0.1
    # initial: 1
    mode: box
    unit_of_measurement: "pu"
  sessy_api_strategy_min_buy_room_wh:
    # Minimum free room that the remaining PV will not fill before the auto strategy may buy
    # from the grid. Below this the buy would only push free PV out.
    name: "Sessy API minimum buy room"
    min: 0
    max: 100000
    step: 100
    initial: 1000
    mode: box
    unit_of_measurement: "Wh"
  sessy_api_strategy_pv_forecast_bias:
    # Optimism factor on the PV forecast in the buy gate only, so that a forecast miss cannot
    # create phantom buy room (audit 2026-09-14: 18.5 kWh forecast against 23.2 kWh real).
    name: "Sessy API PV forecast bias"
    min: 1
    max: 2
    step: 0.05
    initial: 1.2
    mode: box
    unit_of_measurement: "pu"
  sessy_pv_forecast_next_day_wh:
    # Tomorrow's PV forecast, written by automation.sessy_pv_forecast_next_day. It is the fallback
    # for pv_incoming_wh once today's remaining forecast is 0 (after sunset and in the stale
    # window around midnight).
    name: "Sessy PV forecast next day"
    min: 0
    max: 1000000
    step: 100
    initial: 0
    mode: box
    unit_of_measurement: "Wh"
  sessy_api_strategy_min_sell_wh:
    # Minimum energy above the remaining need (the night reserve included) before the auto
    # strategy may sell; a sell can never eat into the reserve.
    name: "Sessy API minimum sellable energy"
    min: 0
    max: 100000
    step: 100
    initial: 500
    mode: box
    unit_of_measurement: "Wh"
  night_energy_in_percent_of_daily_used_in_home:
    name: "Night energy in percent of daily used in home"
    min: 0
    max: 100
    step: 1
    initial: 25 # fixed for my house, but can be adjusted for other houses with different night consumption
    mode: box
    unit_of_measurement: "%"
  ## Consider changing everything with max / min power to template number with template max / min based on input number! 
  # FOR API STRATEGY
  sessy_api_strategy_inverter_nominal_power:
    name: "Sessy API inverer nominal power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    initial: 1500 # 10% of nom_power for switching logic
    mode: box
    unit_of_measurement: "W"
  sessy_api_strategy_inverter_hysteresis_power:
    name: "Sessy API inverer hysteresis power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    initial: 250 # 10% of nom_power hysteresis in switching logic
    mode: box
    unit_of_measurement: "W"
  sessy_api_strategy_max_charge_power:
    name: "Sessy API max charge power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    mode: box
    # initial: 6000
    unit_of_measurement: "W"
  sessy_api_strategy_max_discharge_power:
    name: "Sessy API max discharge power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    # initial: 4500
    mode: box
    unit_of_measurement: "W"
  sessy_api_strategy_max_prop_charge_power:
    name: "Sessy API max proportional charge power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    # initial: 3000
    mode: box
    unit_of_measurement: "W"
  sessy_api_strategy_max_prop_discharge_power:
    name: "Sessy API max proportional discharge power"
    min: 0
    max: 1000000 # Redicilous large value
    step: 1
    # initial: 3000
    mode: box
    unit_of_measurement: "W"


automation:
# CONSIDER ADDING AN AUTOMATION WHICH SETS THE INPUT_NUMBERS DAILY AFTER MIDNIGHT BASED ON SOLAR SURPLUS
# AND CHEAPEST ENERGY HOURS
# TRY TO HAVE LESS THAN 4 CLEAR SETTINGS FOR THAT AUTOMATION
# BETTER 1 OR 2 THAT SET HOW AGRESSIVE IT SELS/BUYS ENERGY
#
# SPEAD SHOULD BE INPUT FOR MIDNIGHT AUTO
# 
  - id: sessy_automatic_api_strategy_auto
    alias: "Sessy automatic API Strategy auto"
    description: "Switches API strategy based on price, and remaining solar forecast"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.electricity_buying_price
      - platform: time_pattern # catch for static prices
        minutes: "/30"
    condition:
      # Only run if Sessy is in API mode and the strategy is not set to Manual
      - condition: template
        value_template: "{{ is_state('input_select.sessy_strategy','POWER_STRATEGY_API') }}"
      - condition: template
        value_template: "{{ is_state('switch.sessy_auto_api_strategy_enable','on') }}"
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.sessy_api_strategy
        data:
          option: >-
            {# Get price data #}
            {% set buying_price      = states('sensor.electricity_buying_price') | float(0) %}
            {% set price_pct         = states('sensor.current_percentage_of_electricity_price') | float(50) %}
            {% set price_spread      = states('sensor.difference_in_electricity_price_today') | float(0) %}
            {% set forced_buy_price  = states('input_number.sessy_auto_api_strategy_min_forced_buy_price') | float(-0.001) %}

            {# Price Settings #}
            {% set buy_pct    = states('input_number.sessy_auto_api_strategy_buy_pct') | float(0) %}
            {% set sell_pct   = states('input_number.sessy_auto_api_strategy_sell_pct') | float(100) %}
            {% set min_price_spread = states('input_number.sessy_auto_api_strategy_min_spread') | float(1) %}

            {# Surplus data as volumes in Wh, from the surplus sensor's attributes. The volume
               decides, not a ratio: buying is only useful for the free room that the remaining
               PV will not fill, and selling only for the part of the pack above the reserve for
               the rest of today plus tonight (2026-09-14). #}
            {% set remain_wh   = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','remain_wh') | float(0) %}
            {% set buy_room_wh = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','buy_room_wh') | float(0) %}
            {% set sellable_wh = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','sellable_wh') | float(0) %}
            {% set soc_target  = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','soc_target') | float(100) %}

            {# Battery data #}
            {% set soc = states('sensor.sessy_battery_state_of_charge') | float(0) %}

            {# Settings #}
            {% set surplus_margin_charge    = states('input_number.sessy_api_strategy_surplus_margin_charge') | float(0) %}
            {% set surplus_margin_discharge = states('input_number.sessy_api_strategy_surplus_margin_discharge') | float(0) %}
            {% set min_buy_room_wh          = states('input_number.sessy_api_strategy_min_buy_room_wh') | float(500) %}
            {% set min_sell_wh              = states('input_number.sessy_api_strategy_min_sell_wh') | float(500) %}

            {# Gates #}
            {% set forced_buy = buying_price <= forced_buy_price %}  {# negative net price: always worth it #}
            {% set can_buy    = (buy_room_wh >= min_buy_room_wh) and (soc < soc_target - 1) %}
            {% set can_sell   = sellable_wh >= min_sell_wh %}
            {% set buy_big    = buy_room_wh >= surplus_margin_charge * remain_wh %}
            {% set sell_big   = sellable_wh >= surplus_margin_discharge * remain_wh %}

            {# 2. Decision Logic #}
            {% if price_spread >= min_price_spread %}    {# Spread sufficient (e.g. >25ct) -> Execute proportional trading (sell surplus only) #}

              {% if price_pct > sell_pct %}  {# Price is high: sell what we do not need tonight #}
                {% if can_sell %}
                  Proportional Discharge
                {% else %}
                  Zero on Meter
                {% endif %}
              
              {% elif price_pct < buy_pct %}
                {% if forced_buy or can_buy %}
                  Proportional Charge
                {% else %}
                  Zero on Meter
                {% endif %}
              
              {% else %}
                Zero on Meter
              {% endif %}
              
            {% else %} {# Spread is too narrow (e.g. <25ct) -> buying makes no sense #}

              {% if price_pct > sell_pct %}  {# Price is high: only sell a clear surplus #}
                {% if sell_big %}
                  Proportional Discharge
                {% elif can_sell %}
                  Zero on Meter Support
                {% else %}
                  Zero on Meter
                {% endif %}
              
              {% elif price_pct < buy_pct %}  {# Price is low: no discharging, and buy only across a clear gap #}
                {% if forced_buy %}
                  Proportional Charge
                {% elif can_buy and buy_big %}
                  Proportional Charge
                {% elif can_buy %}
                  Zero on Meter Charge
                {% else %}
                  Zero on Meter
                {% endif %}
              
              {% else %}
                Zero on Meter
              {% endif %}

            {% endif %}


  - id: sessy_api_strategy_auto
    alias: "Sessy API Strategy auto"
    description: "Calculates applicable API setpoints and applies them when Sessy is set to POWER_STRATEGY_API"
    mode: restart
    trigger:
      - platform: state
        entity_id: sensor.p1_meter_3c39e72e6af0_active_power
    condition:
      - condition: template
        value_template: "{{ not is_state('input_select.sessy_api_strategy','Manual') }}"
      - condition: template
        value_template: "{{ is_state('input_select.sessy_strategy','POWER_STRATEGY_API') }}"
    action:
      - action: number.set_value
        target:
          entity_id: number.sessy_api_strategy_zom_state
        data:
          value: >-
            {# 1. Get relevant input data  #}
            {% set strategy     = states('input_select.sessy_api_strategy') %}
            {% set p1_power     = states('sensor.p1_meter_3c39e72e6af0_active_power') | float(0) %}
            {% set zom_state    = states('number.sessy_api_strategy_zom_state') | float(0) %}
            {% set soc          = states('sensor.sessy_battery_state_of_charge') | float(0) %}
            {# 2. Get relevant settings #}
            {% set max_charge_power    = states('input_number.sessy_api_strategy_max_charge_power') | float(0) %}
            {% set max_discharge_power = states('input_number.sessy_api_strategy_max_discharge_power') | float(0) %}
            {% set max_prop_charge_power = states('input_number.sessy_api_strategy_max_prop_charge_power') | float(0) %}
            {% set max_prop_discharge_power = states('input_number.sessy_api_strategy_max_prop_discharge_power') | float(0) %}
            {# Charge ceiling and discharge floor from the same reserve model as the auto strategy:
               the SoC that belongs to the rest of today plus tonight (2026-09-14). #}
            {% set soc_target = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','soc_target') | float(100) %}
            {% set remain_wh  = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','remain_wh') | float(0) %}
            {% set usable_wh  = state_attr('sensor.sessy_api_strategy_estimated_energy_surplus','usable_wh') | float(0) %}
            {% set soc_floor  = 0 if usable_wh <= 0 else 100 * remain_wh / usable_wh %}
            
            {# 3. Zero on Meter (ZOM) algorithm #}
            {% set zom_gain      = 0.5 %}
            {% set zom           = min(max(zom_state + (zom_gain*p1_power), -max_charge_power), max_discharge_power) %}
            {% set zom_discharge = max(zom, 0) %}
            {% set zom_charge    = min(zom, 0) %}
            
            {# 4. Strategy selection and calculation #}
            {% if strategy == 'Zero on Meter' %}
                {{ zom | int }} 

            {% elif strategy == 'Zero on Meter Support' %}
              {{ zom_discharge | int }} {# no charging for high energy prices #}

            {% elif strategy == 'Zero on Meter Charge' %}
              {{ zom_charge | int }} {# no discharging for low energy prices #}

            {% elif strategy == 'Proportional Charge' %}
            {# Buys energy or absorbs PV: never charges above soc_target, the level that is useful
               today (the remaining need plus the room the remaining PV cannot fill). Above that
               only free PV is worth taking. #}
              {% set prop_gain = max(0.0, (soc_target - soc) / 100.0) %}
              {% set prop_power = -1 * (prop_gain * max_prop_charge_power) %}              
              {# Selects the highest charging request (most negative value) #}

              {{ min(prop_power, zom_charge) | int }}
              
            {% elif strategy == 'Proportional Discharge' %}
            {# Sells energy or supports the house: never discharges below soc_floor, the SoC that
               still covers the rest of today plus tonight, so a sell cannot eat into the reserve. #}
              {% if soc <= soc_floor %}
                {{ max(zom_discharge, 0) | int }} {# only cover the house, no export #}
              {% else %}
                {% set prop_gain = soc / 100.0 %}
                {% set prop_power = prop_gain * max_prop_discharge_power %}
                {# Selects the highest discharging request (highest positive value) #}
                {{ max(prop_power, zom_discharge) | int }}
              {% endif %}
              
            {% else %}
              {{ 0 | int }}
            {% endif %}


  # Keeps tomorrow's PV forecast in a helper. After sunset (and around midnight, when the
  # "today remaining" sensors still read 0) that value is the PV that is actually still to come,
  # so the buy gate can see that free PV will fill the pack anyway (audit 2026-09-14).
  - id: sessy_pv_forecast_next_day
    alias: "Sessy PV forecast next day"
    description: "Stores tomorrow's PV forecast for the buy gate after sunset"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - sensor.energy_production_tomorrow_east
          - sensor.energy_production_tomorrow_west
        not_to:
          - unknown
          - unavailable
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.sessy_pv_forecast_next_day_wh
        data:
          value: >-
            {{ (states('sensor.energy_production_tomorrow_east') | float(0)
                + states('sensor.energy_production_tomorrow_west') | float(0)) * 1000 }}
