# HeatMeister room boosters. The automations temporarily raise the fan speeds during a
# compressor startup, keep a minimum speed while cooling, and restore the previous speeds.
input_boolean:
  heatmeisters_cool_active:
    name: "HeatMeister cooling active"
  heatmeisters_startup_boost_active:
    name: "HeatMeister startup boost active"

input_datetime:
  heatmeisters_startup_boost_until:
    name: "HeatMeister startup boost until"
    has_date: true
    has_time: true

input_number:
  heatmeisters_master_fan_state:
    name: "HeatMeister master bedroom fan state"
    initial: 0
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  heatmeisters_chris_fan_state:
    name: "HeatMeister Chris fan state"
    initial: 0
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  heatmeisters_julia_fan_state:
    name: "HeatMeister Julia fan state"
    initial: 0
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  heatmeisters_computer_fan_state:
    name: "HeatMeister computer room fan state"
    initial: 0
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  heatmeisters_start_up_fan_speed:
    name: "HeatMeister start-up fan speed"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
  heatmeisters_cooling_fan_speed:
    name: "HeatMeister cooling fan speed"
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

automation:
  # Boost the fans for 15 minutes after a normal compressor startup, unless cooling or DHW is
  # active. Save the user's speeds first so the boost can be undone afterwards.
  - id: heatmeisters_on_at_startup_auto
    alias: "HeatMeisters on at startup auto"
    description: "Raises the fan speeds for 15 minutes after compressor startup"
    mode: single
    max_exceeded: silent
    triggers:
      # Compressor running comes from the Hz register (5 s) instead of the 30 s discrete state
      - trigger: numeric_state
        entity_id: sensor.therma_v_compressor_hz
        above: 1
      - trigger: state
        entity_id: binary_sensor.therma_v_defrost_state
        from: "on"
        to: "off" # Catch a missed compressor restart after defrost.
    conditions:
      - condition: state
        entity_id: switch.therma_v_heating_cooling_on_off
        state: "on" # Do not touch the boosters while the heat pump is off.
      - condition: state
        entity_id: binary_sensor.therma_v_defrost_state
        state: "off"
      - condition: state
        entity_id: binary_sensor.therma_v_dhw_heating_state
        state: "off"
      - condition: template
        value_template: "{{ states('climate.therma_v_heating_cooling') not in ['cool', 'unknown', 'unavailable'] }}"
      - condition: state
        entity_id: input_boolean.heatmeisters_cool_active
        state: "off"
      - condition: state
        entity_id: input_boolean.heatmeisters_startup_boost_active
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_master_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_master_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_master_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_chris_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_chris_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_chris_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_julia_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_julia_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_julia_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_computer_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_computer_room_fan_speed')
               | float(states('input_number.heatmeisters_computer_fan_state') | float(0)) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.heatmeisters_startup_boost_until
        data:
          timestamp: "{{ (now().timestamp() + 15 * 60) | int }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heatmeisters_startup_boost_active
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_master_bedroom_fan_speed
                below: input_number.heatmeisters_start_up_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_master_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_start_up_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_chris_bedroom_fan_speed
                below: input_number.heatmeisters_start_up_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_chris_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_start_up_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_julia_bedroom_fan_speed
                below: input_number.heatmeisters_start_up_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_julia_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_start_up_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_computer_room_fan_speed
                below: input_number.heatmeisters_start_up_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_computer_room_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_start_up_fan_speed') }}"
  # Finish the boost from the persisted latch instead of an in-flight delay. A restart ends the
  # boost early and restores the saved user speeds; failed writes stay latched for a later retry.
  # The same automation reconciles cooling entry and a heat-pump shutdown.
  - id: heatmeisters_finish_startup_boost_auto
    alias: "HeatMeisters finish startup boost auto"
    description: "Restores user fan speeds after the startup boost"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: time_pattern
        minutes: "/1"
        id: heartbeat
      - trigger: state
        entity_id: switch.therma_v_heating_cooling_on_off
        to: "off"
        id: heat_pump_off
      - trigger: state
        entity_id: climate.therma_v_heating_cooling
        to: "cool"
        id: cooling_start
    conditions:
      - condition: state
        entity_id: input_boolean.heatmeisters_startup_boost_active
        state: "on"
      - or:
          - condition: trigger
            id: ha_start
          - condition: trigger
            id: heat_pump_off
          - condition: trigger
            id: cooling_start
          - condition: template
            value_template: >-
              {% set deadline = state_attr('input_datetime.heatmeisters_startup_boost_until',
                                           'timestamp') %}
              {{ deadline is none or now().timestamp() >= deadline }}
    actions:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_master_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_master_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_chris_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_chris_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_julia_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_julia_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_computer_room_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_computer_fan_state') }}"
      - delay:
          seconds: 2
      - if:
          - condition: template
            value_template: >-
              {{ (states('number.heatbooster_master_bedroom_fan_speed') | float(-1)
                  - states('input_number.heatmeisters_master_fan_state') | float(0)) | abs < 0.5
                 and (states('number.heatbooster_chris_bedroom_fan_speed') | float(-1)
                      - states('input_number.heatmeisters_chris_fan_state') | float(0)) | abs < 0.5
                 and (states('number.heatbooster_julia_bedroom_fan_speed') | float(-1)
                      - states('input_number.heatmeisters_julia_fan_state') | float(0)) | abs < 0.5
                 and (states('number.heatbooster_computer_room_fan_speed') | float(-1)
                      - states('input_number.heatmeisters_computer_fan_state') | float(0)) | abs < 0.5 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heatmeisters_startup_boost_active

  # Enter the cooling regime once and save the user speeds. A startup boost must finish first so
  # its temporary speeds are never captured as user values.
  - id: heatmeisters_on_when_cooling_auto
    alias: "HeatMeisters on when cooling auto"
    description: "Keeps the fan speeds at the cooling minimum while cooling"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.therma_v_compressor_hz
        above: 1
      - trigger: state
        entity_id: binary_sensor.therma_v_defrost_state
        from: "on"
        to: "off" # Catch missed compressor restart
      - trigger: state
        entity_id: climate.therma_v_heating_cooling
        to: "cool"
      - trigger: state
        entity_id: input_boolean.heatmeisters_startup_boost_active
        to: "off"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: switch.therma_v_heating_cooling_on_off
        state: "on" # Do not touch the boosters while the heat pump is off.
      - condition: state
        entity_id: binary_sensor.therma_v_defrost_state
        state: "off"
      - condition: state
        entity_id: binary_sensor.therma_v_dhw_heating_state
        state: "off"
      - condition: template
        value_template: "{{ is_state('climate.therma_v_heating_cooling', 'cool') }}"
      - condition: state
        entity_id: input_boolean.heatmeisters_cool_active
        state: "off"
      - condition: state
        entity_id: input_boolean.heatmeisters_startup_boost_active
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_master_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_master_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_master_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_chris_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_chris_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_chris_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_julia_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_julia_bedroom_fan_speed')
               | float(states('input_number.heatmeisters_julia_fan_state') | float(0)) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.heatmeisters_computer_fan_state
        data:
          value: >-
            {{ states('number.heatbooster_computer_room_fan_speed')
               | float(states('input_number.heatmeisters_computer_fan_state') | float(0)) }}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heatmeisters_cool_active
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_master_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_master_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_chris_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_chris_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_julia_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_julia_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_computer_room_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_computer_room_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"

  # Reassert the cooling minimum independently from the initial save. This is the restart and
  # device-recovery path used while heatmeisters_cool_active is already on.
  - id: heatmeisters_reconcile_cooling_auto
    alias: "HeatMeisters reconcile cooling auto"
    description: "Reasserts the cooling minimum after restart or device recovery"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: switch.therma_v_heating_cooling_on_off
        state: "on"
      - condition: state
        entity_id: binary_sensor.therma_v_defrost_state
        state: "off"
      - condition: state
        entity_id: binary_sensor.therma_v_dhw_heating_state
        state: "off"
      - condition: state
        entity_id: climate.therma_v_heating_cooling
        state: "cool"
      - condition: state
        entity_id: input_boolean.heatmeisters_cool_active
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_master_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_master_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_chris_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_chris_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_julia_bedroom_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_julia_bedroom_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"
      - choose:
          - conditions:
              - condition: numeric_state
                entity_id: number.heatbooster_computer_room_fan_speed
                below: input_number.heatmeisters_cooling_fan_speed
            sequence:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: number.heatbooster_computer_room_fan_speed
                data:
                  value: "{{ states('input_number.heatmeisters_cooling_fan_speed') }}"

  # Restore the user's fan speeds once cooling stops. The heartbeat cleans up a stale cooling
  # state after a missed transition or a Home Assistant restart.
  - id: heatmeisters_off_when_cooling_stops_auto
    alias: "HeatMeisters off when cooling stops auto"
    description: "Restores the fan speeds when cooling stops"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.therma_v_compressor_hz
        below: 1
      - trigger: state
        entity_id: climate.therma_v_heating_cooling
        from: "cool"
        id: trig_cool_off
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.heatmeisters_cool_active
        state: "on"
      - or:
          - condition: trigger
            id: trig_cool_off
          - condition: template
            value_template: "{{ states('climate.therma_v_heating_cooling') not in ['cool', 'unknown', 'unavailable'] }}"
    actions:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_master_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_master_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_chris_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_chris_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_julia_bedroom_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_julia_fan_state') }}"
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.heatbooster_computer_room_fan_speed
        data:
          value: "{{ states('input_number.heatmeisters_computer_fan_state') }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heatmeisters_cool_active
