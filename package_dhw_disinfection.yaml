# DHW disinfection planning for the Therma V. Each automation works on its own memory and
# detects both planned and unplanned high-temperature cycles.
input_datetime:
  dhw_last_disinfection:
    name: "DHW last disinfection"
    has_date: true
    has_time: true
  dhw_next_disinfection:
    name: "DHW next disinfection"
    has_date: true
    has_time: true
  dhw_disinfection_window_start:
    name: "DHW disinfection window start"
    has_date: false
    has_time: true
    initial: "00:05" # Initial value only; change it with a service or dashboard tile.
  dhw_disinfection_window_end:
    name: "DHW disinfection window end"
    has_date: false
    has_time: true
    initial: "12:00" # Initial value only; change it with a service or dashboard tile.

input_number:
  dhw_max_days_between_disinfections:
    name: "DHW max days between disinfections"
    initial: 12 # Initial value only; change it with a service or dashboard tile.
    min: 5
    max: 28
    step: 1
    mode: slider
  dhw_min_days_between_disinfections:
    name: "DHW min days between disinfections"
    initial: 5 # Initial value only; change it with a service or dashboard tile.
    min: 5
    max: 14
    step: 1
    mode: slider
  dhw_setpoint_state:
    # Stored DHW target to restore after a disinfection cycle. Match the climate limits so an
    # accidental value can never produce an invalid target.
    name: "DHW setpoint state"
    initial: 50
    min: 40
    max: 70
    step: 1
    mode: slider
    unit_of_measurement: "°C"

input_select:
  dhw_disinfection_day:
    name: "DHW disinfection day"
    options:
      - Mon
      - Tue
      - Wed
      - Thu
      - Fri
      - Sat
      - Sun
    initial: Sun # Initial value only; change it with a service or dashboard tile.

automation:
  # Store when the DHW tank has been hot long enough to count as a disinfection, whether that
  # happened through the plan or through an unplanned high-temperature/negative-price cycle.
  # Thresholds from the heat pump legionella guidance:
  # 55 °C for 6 h, 60 °C for 30 min or 65 °C for 2 min.
  - id: dhw_disinfection_detection_auto
    alias: "DHW disinfection detection auto"
    description: "Stores when the DHW tank has completed a disinfection cycle"
    mode: parallel
    triggers:
      - trigger: numeric_state
        entity_id: climate.therma_v_dhw
        attribute: current_temperature
        above: 55
        for:
          hours: 6
      - trigger: numeric_state
        entity_id: climate.therma_v_dhw
        attribute: current_temperature
        above: 60
        for:
          minutes: 30
      - trigger: numeric_state
        entity_id: climate.therma_v_dhw
        attribute: current_temperature
        above: 65
        for:
          minutes: 2
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dhw_last_disinfection
        data:
          timestamp: "{{ now().timestamp() }}"

  # Plan the cheapest three hours in the configured window on the selected weekday, or force a
  # cycle once the maximum number of days has passed. look_ahead prevents a past start time when
  # the cheapest block begins before this automation runs at 00:15.
  - id: dhw_disinfection_planning_auto
    alias: "DHW disinfection planning auto"
    description: "Plans disinfection at the cheapest hours on the disinfection day"
    mode: single
    triggers:
      - trigger: time
        at: "00:15" # Late enough for the new day-ahead prices to be available.
    variables:
      days_passed_since: >-
        {% set last = state_attr('input_datetime.dhw_last_disinfection', 'timestamp') %}
        {{ ((now().timestamp() - last) / 86400) | round(0)
           if last is not none
           else states('input_number.dhw_max_days_between_disinfections') | int }}
      cheapest_hours_start: >-
        {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
        {{ cheapest_energy_hours(
             sensor='sensor.electricity_buying_price',
             attr_all='prices',
             time_key='time',
             value_key='price',
             hours=3,
             look_ahead=true,
             include_today=true,
             include_tomorrow=false,
             start=states('input_datetime.dhw_disinfection_window_start'),
             end=states('input_datetime.dhw_disinfection_window_end')) }}
    conditions:
      # Do not write an invalid datetime when the price data or macro result is unusable.
      - condition: template
        value_template: "{{ cheapest_hours_start | as_datetime is not none }}"
      - or:
          - and:
              - condition: template
                value_template: >-
                  {{ now().weekday() == state_attr('input_select.dhw_disinfection_day', 'options').index(states('input_select.dhw_disinfection_day')) }}
              - condition: template
                value_template: >-
                  {{ days_passed_since | float(0) >= states('input_number.dhw_min_days_between_disinfections') | int }}
          - condition: template
            value_template: >-
              {{ days_passed_since | float(0) >= states('input_number.dhw_max_days_between_disinfections') | int }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dhw_next_disinfection
        data:
          datetime: "{{ cheapest_hours_start }}"

  # Preheat the tank, then trigger the heat pump's own disinfection cycle.
  - id: dhw_disinfection_run_auto
    alias: "DHW disinfection run auto"
    description: "Runs disinfection at the planned moment"
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.dhw_next_disinfection
    variables:
      disinfection_temperature: 60
      preheat_minutes: 15
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.dhw_setpoint_state
        data:
          value: "{{ state_attr('climate.therma_v_dhw', 'temperature') | float(50) }}"
      - action: climate.set_temperature
        target:
          entity_id: climate.therma_v_dhw
        data:
          temperature: "{{ disinfection_temperature }}"
      - delay:
          minutes: "{{ preheat_minutes }}"
      - action: switch.turn_on
        target:
          entity_id: switch.therma_v_trigger_dhw_disinfection_cycle

  # Restore the stored setpoint after the heat pump reports that the cycle has finished.
  - id: dhw_disinfection_restore_setpoint_auto
    alias: "DHW disinfection restore setpoint auto"
    description: "Restores the DHW setpoint after disinfection"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.therma_v_dhw_disinfection_cycle_state
        from: "on"
        to: "off"
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('climate.therma_v_dhw')
             and states('input_number.dhw_setpoint_state') | is_number }}
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.therma_v_dhw
        data:
          temperature: "{{ states('input_number.dhw_setpoint_state') }}"
