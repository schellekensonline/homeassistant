# EMHASS package: hypothetical DHW, heating and cooling dry-runs.
# Each preview activates exactly one thermal flow, bypasses the live control gates and never
# publishes or saves a plan. The compact result is fired as an event so the three dashboard
# sensors survive a restart and can render the latest requested preview.
rest_command:
  emhass_dry_run_naive_mpc_optim:
    url: "http://localhost:5000/api/v1/dry-run/naive-mpc-optim"
    method: POST
    timeout: 150
    content_type: "application/json"
    payload: >-
      {%- set body = emhass_payload | default({'error': 'emhass_payload was not passed by the caller'}) -%}
      {{ body if body is string else body | to_json }}

template:
  - trigger:
      - trigger: event
        event_type: emhass_preview_completed
        event_data:
          mode: dhw
    sensor:
      - name: "EMHASS DHW preview"
        unique_id: emhass_dhw_preview
        state: "{{ trigger.event.data.status | default('unknown') }}"
        attributes:
          mode: "{{ trigger.event.data.mode | default('dhw') }}"
          completed_at: "{{ trigger.event.data.completed_at | default(none) }}"
          duration_s: "{{ trigger.event.data.duration_s | default(0) }}"
          planned_electricity_kwh: "{{ trigger.event.data.planned_electricity_kwh | default(0) }}"
          planned_heat_demand_kwh: "{{ trigger.event.data.planned_heat_demand_kwh | default(0) }}"
          hp_electricity_kwh: "{{ trigger.event.data.hp_electricity_kwh | default(0) }}"
          booster_electricity_kwh: "{{ trigger.event.data.booster_electricity_kwh | default(0) }}"
          nonzero_quarters: "{{ trigger.event.data.nonzero_quarters | default(0) }}"
          temperature_start_c: "{{ trigger.event.data.temperature_start_c | default(none) }}"
          temperature_end_c: "{{ trigger.event.data.temperature_end_c | default(none) }}"
          temperature_min_c: "{{ trigger.event.data.temperature_min_c | default(none) }}"
          temperature_max_c: "{{ trigger.event.data.temperature_max_c | default(none) }}"
          temperature_target_c: "{{ trigger.event.data.temperature_target_c | default(none) }}"
          solver_status: "{{ trigger.event.data.solver_status | default('unknown') }}"
          error_message: "{{ trigger.event.data.error_message | default(none) }}"
          plan: "{{ trigger.event.data.plan | default([]) }}"

  - trigger:
      - trigger: event
        event_type: emhass_preview_completed
        event_data:
          mode: heat
    sensor:
      - name: "EMHASS heat preview"
        unique_id: emhass_heat_preview
        state: "{{ trigger.event.data.status | default('unknown') }}"
        attributes:
          mode: "{{ trigger.event.data.mode | default('heat') }}"
          completed_at: "{{ trigger.event.data.completed_at | default(none) }}"
          duration_s: "{{ trigger.event.data.duration_s | default(0) }}"
          planned_electricity_kwh: "{{ trigger.event.data.planned_electricity_kwh | default(0) }}"
          planned_heat_demand_kwh: "{{ trigger.event.data.planned_heat_demand_kwh | default(0) }}"
          hp_electricity_kwh: "{{ trigger.event.data.hp_electricity_kwh | default(0) }}"
          booster_electricity_kwh: "{{ trigger.event.data.booster_electricity_kwh | default(0) }}"
          nonzero_quarters: "{{ trigger.event.data.nonzero_quarters | default(0) }}"
          temperature_start_c: "{{ trigger.event.data.temperature_start_c | default(none) }}"
          temperature_end_c: "{{ trigger.event.data.temperature_end_c | default(none) }}"
          temperature_min_c: "{{ trigger.event.data.temperature_min_c | default(none) }}"
          temperature_max_c: "{{ trigger.event.data.temperature_max_c | default(none) }}"
          temperature_target_c: "{{ trigger.event.data.temperature_target_c | default(none) }}"
          solver_status: "{{ trigger.event.data.solver_status | default('unknown') }}"
          error_message: "{{ trigger.event.data.error_message | default(none) }}"
          plan: "{{ trigger.event.data.plan | default([]) }}"

  - trigger:
      - trigger: event
        event_type: emhass_preview_completed
        event_data:
          mode: cool
    sensor:
      - name: "EMHASS cool preview"
        unique_id: emhass_cool_preview
        state: "{{ trigger.event.data.status | default('unknown') }}"
        attributes:
          mode: "{{ trigger.event.data.mode | default('cool') }}"
          completed_at: "{{ trigger.event.data.completed_at | default(none) }}"
          duration_s: "{{ trigger.event.data.duration_s | default(0) }}"
          planned_electricity_kwh: "{{ trigger.event.data.planned_electricity_kwh | default(0) }}"
          planned_heat_demand_kwh: "{{ trigger.event.data.planned_heat_demand_kwh | default(0) }}"
          hp_electricity_kwh: "{{ trigger.event.data.hp_electricity_kwh | default(0) }}"
          booster_electricity_kwh: "{{ trigger.event.data.booster_electricity_kwh | default(0) }}"
          nonzero_quarters: "{{ trigger.event.data.nonzero_quarters | default(0) }}"
          temperature_start_c: "{{ trigger.event.data.temperature_start_c | default(none) }}"
          temperature_end_c: "{{ trigger.event.data.temperature_end_c | default(none) }}"
          temperature_min_c: "{{ trigger.event.data.temperature_min_c | default(none) }}"
          temperature_max_c: "{{ trigger.event.data.temperature_max_c | default(none) }}"
          temperature_target_c: "{{ trigger.event.data.temperature_target_c | default(none) }}"
          solver_status: "{{ trigger.event.data.solver_status | default('unknown') }}"
          error_message: "{{ trigger.event.data.error_message | default(none) }}"
          plan: "{{ trigger.event.data.plan | default([]) }}"

  - trigger:
      - trigger: event
        event_type: emhass_heat_simulation_completed
    sensor:
      - name: "EMHASS heat simulation"
        unique_id: emhass_heat_simulation
        state: "{{ trigger.event.data.status | default('unknown') }}"
        attributes:
          completed_at: "{{ trigger.event.data.completed_at | default(none) }}"
          price_source: "{{ trigger.event.data.price_source | default('') }}"
          buy_prices: "{{ trigger.event.data.buy_prices | default([]) }}"
          heat_prices: "{{ trigger.event.data.heat_prices | default([]) }}"
          points: "{{ trigger.event.data.points | default([]) }}"

script:
  emhass_preview_plan:
    alias: "Run an EMHASS plan preview"
    description: >-
      Build and dry-run one hypothetical thermal flow. This never publishes a plan or changes
      the live heat-pump strategy.
    mode: single
    fields:
      mode:
        name: "Thermal flow"
        description: "Exactly one of DHW, space heating or space cooling."
        default: "dhw"
        selector:
          select:
            options: ["dhw", "heat", "cool"]
      block_outdoor_temperature:
        name: "Block outdoor temperature (heat/cool)"
        description: "Repeat one outdoor temperature per local two-hour block."
        default: true
        selector:
          boolean:
    sequence:
      - variables:
          preview_mode: >-
            {{ mode | default('dhw', true)
               if mode | default('dhw', true) in ['dhw', 'heat', 'cool'] else 'dhw' }}
      - action: script.emhass_build_payload
        data:
          plan: dayahead
          thermal: true
          preview_mode: "{{ preview_mode }}"
          dry_run: true
          block_outdoor_temperature: "{{ block_outdoor_temperature | default(true) }}"
        response_variable: preview_payload
      - action: rest_command.emhass_dry_run_naive_mpc_optim
        data:
          emhass_payload: "{{ preview_payload.body }}"
        response_variable: preview_response
        continue_on_error: true
      - variables:
          preview_http_status: "{{ preview_response.status | default(0) | int(0) }}"
          preview_raw_content: "{{ preview_response.content | default({}) }}"
      - variables:
          preview_body: >-
            {% set raw = preview_raw_content %}
            {{ raw if raw is mapping else raw | from_json }}
      - variables:
          preview_ok: >-
            {{ preview_http_status in [200, 201]
               and preview_body.status | default('') == 'ok'
               and not (preview_body.infeasible | default(false) | bool) }}
          preview_result: >-
            {% set plan = preview_body.plan | default([]) %}
            {% set heater = 0 if preview_mode == 'dhw' else 1 %}
            {% set payload_raw = preview_payload.body | default({}) %}
            {% set payload_body = payload_raw if payload_raw is mapping
                                  else payload_raw | from_json %}
            {% set outdoor_plan = payload_body.outdoor_temperature_forecast | default([]) %}
            {% set space_source = payload_body.heat_topology.sources[1] | default({}) %}
            {% set acc = namespace(items=[], hp_kwh=0.0, booster_kwh=0.0,
                                 total_kwh=0.0, heat_demand_kwh=0.0, nonzero=0,
                                 temp_min=none, temp_max=none) %}
            {# Heat/cool preview uses the actuator profile: two-hour blocks, directional edges and
               a 15 min first-order filter with immediate OFF and the modelled source minimum. #}
            {% set min_power = space_source.min_power | float(550) %}
            {% set raw_points = namespace(list=[]) %}
            {% for entry in plan %}
              {% set hp_w = entry.P_deferrable1 | float(0) %}
              {% set point_dt = entry.timestamp | as_datetime | as_local %}
              {% set block_start = point_dt.replace(hour=(point_dt.hour // 2) * 2,
                                                    minute=0, second=0, microsecond=0).isoformat() %}
              {% set raw_points.list = raw_points.list + [{
                'block': block_start,
                'raw': hp_w
              }] %}
            {% endfor %}
            {% set groups = namespace(keys=[], values=[]) %}
            {% for point in raw_points.list %}
              {% if point.block not in groups.keys %}
                {% set groups.keys = groups.keys + [point.block] %}
                {% set groups.values = groups.values + [[]] %}
              {% endif %}
              {% set group_idx = groups.keys.index(point.block) %}
              {% set group_values = groups.values %}
              {% set groups.values =
                   group_values[:group_idx] + [group_values[group_idx] + [point]]
                   + group_values[group_idx + 1:] %}
            {% endfor %}
            {% set stats = namespace(sums=[], means=[]) %}
            {% for group_values in groups.values %}
              {% set total = namespace(value=0.0) %}
              {% for point in group_values %}
                {% set total.value = total.value + point.raw %}
              {% endfor %}
              {% set stats.sums = stats.sums + [total.value] %}
              {% set stats.means = stats.means + [total.value / (group_values | length)] %}
            {% endfor %}
            {% set edge_groups = namespace(values=[]) %}
            {% for group_values in groups.values %}
              {% set mean = stats.means[loop.index0] %}
              {% set total = stats.sums[loop.index0] %}
              {% if total <= 0 %}
                {% set corrected = [0.0] * (group_values | length) %}
              {% elif mean >= min_power %}
                {% set corrected = [mean] * (group_values | length) %}
              {% else %}
                {% set prev_mean = stats.means[loop.index0 - 1]
                                   if loop.index0 > 0 else none %}
                {% set next_mean = stats.means[loop.index0 + 1]
                                   if loop.index0 + 1 < (stats.means | length) else none %}
                {% set prev_active = prev_mean is not none and prev_mean >= min_power %}
                {% set next_active = next_mean is not none and next_mean >= min_power %}
                {% if next_active and (not prev_active or next_mean >= prev_mean) %}
                  {% set base_power = next_mean %}
                  {% set align_right = true %}
                {% elif prev_active %}
                  {% set base_power = prev_mean %}
                  {% set align_right = false %}
                {% elif next_active %}
                  {% set base_power = next_mean %}
                  {% set align_right = true %}
                {% else %}
                  {% set base_power = min_power %}
                  {% set align_right = false %}
                {% endif %}
                {% set active_quarters =
                     [1, (total / base_power) | round(0, 'ceil') | int] | max %}
                {% set active_quarters = [active_quarters, group_values | length] | min %}
                {% if align_right %}
                  {% set corrected =
                       [0.0] * ((group_values | length) - active_quarters)
                       + [base_power] * active_quarters %}
                {% else %}
                  {% set corrected =
                       [base_power] * active_quarters
                       + [0.0] * ((group_values | length) - active_quarters) %}
                {% endif %}
              {% endif %}
              {% set edge_groups.values = edge_groups.values + [corrected] %}
            {% endfor %}
            {% set processed_pe = namespace(values=[]) %}
            {% set filtered = namespace(value=0.0) %}
            {% for group_values in groups.values %}
              {% set group_idx = loop.index0 %}
              {% for point in group_values %}
                {% set point_idx = loop.index0 %}
                {% set target = edge_groups.values[group_idx][point_idx] %}
                {% if target <= 0 %}
                  {% set filtered.value = 0.0 %}
                {% else %}
                  {% set filtered.value =
                       [min_power, filtered.value
                        + 0.6321205588 * (target - filtered.value)] | max %}
                {% endif %}
                {% set processed_pe.values = processed_pe.values + [filtered.value] %}
              {% endfor %}
            {% endfor %}
            {% for entry in plan %}
              {% set current_idx = loop.index0 %}
              {% set hp_w = (entry.P_deferrable0 if preview_mode == 'dhw'
                             else entry.P_deferrable1) | float(0) %}
              {% set booster_w = entry.P_deferrable2 | float(0) if preview_mode == 'dhw' else 0 %}
              {% set total_w = hp_w + booster_w %}
              {% set temperature = entry['predicted_temp_heater' ~ heater] | float(0) %}
              {% set target = entry['target_temp_heater' ~ heater] | default(none) %}
              {% set heat_demand_kwh = entry['heating_demand_heater' ~ heater] | float(0) %}
              {% set t_out = outdoor_plan[current_idx] | default(
                              states('sensor.therma_v_outside_temperature_filtered')) | float(0) %}
              {% if preview_mode == 'cool' %}
                {% set t_supply = space_source.supply_temperature | default(16) | float %}
                {% set eta_carnot = space_source.carnot_efficiency | default(0.45) | float %}
                {% set temperature_lift = t_out - t_supply %}
              {% else %}
                {% set heating_curve = space_source.heating_curve | default({}) %}
                {% set t_supply = min(max(
                     (heating_curve.offset | default(28.88) | float)
                     - (heating_curve.slope | default(0.444) | float) * t_out,
                     heating_curve.min_supply | default(25) | float),
                     heating_curve.max_supply | default(42) | float) %}
                {% set eta_carnot = space_source.carnot_efficiency | default(0.26) | float %}
                {% set temperature_lift = t_supply - t_out %}
              {% endif %}
              {% set cop = (eta_carnot * (t_supply + 273.15) / temperature_lift)
                            if temperature_lift > 0
                            else 1.0 %}
              {% set cop = min(max(cop, 1.0), 8.0) %}
              {% set q_raw_w = hp_w * cop %}
              {% if preview_mode in ['heat', 'cool'] %}
                {% set processed_pe_w = processed_pe.values[current_idx] | float(0) %}
              {% else %}
                {% set processed_pe_w = 0.0 %}
              {% endif %}
              {% set q_effective_w = processed_pe_w * cop %}
              {% if processed_pe_w > 0 and preview_mode in ['heat', 'cool'] %}
                {% set return_band_min = (states('input_number.therma_v_min_water_temperature_heat')
                                          if preview_mode == 'heat'
                                          else states('input_number.therma_v_min_water_temperature_cool')) | float %}
                {% set return_band_max = (states('input_number.therma_v_max_water_temperature_heat')
                                          if preview_mode == 'heat'
                                          else states('input_number.therma_v_max_water_temperature_cool')) | float %}
                {% set return_unclamped =
                     temperature + ((q_effective_w / 1000 + 0.949) / 0.657)
                     if preview_mode == 'heat'
                     else temperature - ((q_effective_w / 1000 + 0.949) / 0.657) %}
                {% set return_target = min(max(return_unclamped, return_band_min), return_band_max) %}
              {% else %}
                {% set return_target = none %}
              {% endif %}
              {% set acc.hp_kwh = acc.hp_kwh + hp_w * 0.25 / 1000 %}
              {% set acc.booster_kwh = acc.booster_kwh + booster_w * 0.25 / 1000 %}
              {% set acc.total_kwh = acc.total_kwh + total_w * 0.25 / 1000 %}
              {% set acc.heat_demand_kwh = acc.heat_demand_kwh + heat_demand_kwh %}
              {% set acc.nonzero = acc.nonzero + (1 if total_w > 0 else 0) %}
              {% set acc.temp_min = temperature if acc.temp_min is none
                                     or temperature < acc.temp_min else acc.temp_min %}
              {% set acc.temp_max = temperature if acc.temp_max is none
                                     or temperature > acc.temp_max else acc.temp_max %}
              {# Arrays keep the full horizon below the recorder's 16 KiB attribute limit. #}
              {% set acc.items = acc.items + [[
                entry.timestamp, total_w | round(0), hp_w | round(0), booster_w | round(0),
                temperature, target, (heat_demand_kwh * 4000) | round(0),
                processed_pe_w | round(1), cop | round(2), q_raw_w | round(0),
                q_effective_w | round(0),
                (return_target | round(1)) if return_target is not none else none
              ]] %}
            {% endfor %}
            {{ {
              'mode': preview_mode,
              'status': 'ok' if preview_ok else 'failed',
              'completed_at': preview_body.timestamp | default(now().isoformat()),
              'duration_s': preview_body.duration_total_seconds | default(0) | round(1),
              'planned_electricity_kwh': acc.total_kwh | round(3),
              'planned_heat_demand_kwh': acc.heat_demand_kwh | round(3),
              'hp_electricity_kwh': acc.hp_kwh | round(3),
              'booster_electricity_kwh': acc.booster_kwh | round(3),
              'nonzero_quarters': acc.nonzero,
              'temperature_start_c': acc.items[0][4] if acc.items else none,
              'temperature_end_c': acc.items[-1][4] if acc.items else none,
              'temperature_min_c': acc.temp_min,
              'temperature_max_c': acc.temp_max,
              'temperature_target_c': acc.items[0][5] if acc.items else none,
              'solver_status': (preview_body.plan[0].optim_status if preview_body.plan else none)
                               | default('unknown'),
              'error_message': preview_body.error_message | default(none),
              'plan': acc.items
            } }}
      - event: emhass_preview_completed
        event_data:
          mode: "{{ preview_result.mode }}"
          status: "{{ preview_result.status }}"
          completed_at: "{{ preview_result.completed_at }}"
          duration_s: "{{ preview_result.duration_s }}"
          planned_electricity_kwh: "{{ preview_result.planned_electricity_kwh }}"
          planned_heat_demand_kwh: "{{ preview_result.planned_heat_demand_kwh }}"
          hp_electricity_kwh: "{{ preview_result.hp_electricity_kwh }}"
          booster_electricity_kwh: "{{ preview_result.booster_electricity_kwh }}"
          nonzero_quarters: "{{ preview_result.nonzero_quarters }}"
          temperature_start_c: "{{ preview_result.temperature_start_c }}"
          temperature_end_c: "{{ preview_result.temperature_end_c }}"
          temperature_min_c: "{{ preview_result.temperature_min_c }}"
          temperature_max_c: "{{ preview_result.temperature_max_c }}"
          temperature_target_c: "{{ preview_result.temperature_target_c }}"
          solver_status: "{{ preview_result.solver_status }}"
          error_message: "{{ preview_result.error_message }}"
          plan: "{{ preview_result.plan }}"
      - if:
          - condition: template
            value_template: "{{ not preview_ok }}"
        then:
          - action: persistent_notification.create
            data:
              title: "EMHASS {{ preview_mode }} preview failed"
              notification_id: "emhass_preview_{{ preview_mode }}"
              message: >-
                The dry-run failed with HTTP {{ preview_http_status }}.
                {{ preview_body.error_message | default('No error message from EMHASS.') }}
                The live plan and heat-pump strategy were not changed.
      - stop: "EMHASS preview complete"
        response_variable: preview_result

  emhass_preview_dhw:
    alias: "Preview the EMHASS DHW plan"
    description: "Run a DHW-only dry-run and update the DHW preview chart."
    mode: single
    sequence:
      - action: script.emhass_preview_plan
        data:
          mode: dhw

  emhass_preview_heat:
    alias: "Preview the EMHASS heat plan"
    description: "Run a space-heating-only dry-run and update the heat preview chart."
    mode: single
    sequence:
      - action: script.emhass_preview_plan
        data:
          mode: heat

  emhass_preview_cool:
    alias: "Preview the EMHASS cool plan"
    description: "Run a space-cooling-only dry-run and update the cool preview chart."
    mode: single
    sequence:
      - action: script.emhass_preview_plan
        data:
          mode: cool
