            {% if stopping %}
            disinfection stop
            {% elif disinfection_override %}
            disinfection
            {% elif strategy != 'EMHASS' %}
            off
            {% elif not gate %}
            disabled
            {% elif not fresh %}
            fallback
            {% elif prepare and hp > threshold %}
            {{ 'prepare' if dhw_started else ('prepare start' if start_useful else 'plan satisfied') }}
            {% elif hp > threshold %}
            {{ 'force' if dhw_started else ('force start' if start_useful else 'plan satisfied') }}
            {% elif temp <= safety_floor %}
            safety force
            {% elif recovery %}
