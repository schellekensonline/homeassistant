               and now().timestamp() < next_ts + hold_minutes * 60 }}
          next_disinfection: "{{ states('input_datetime.dhw_next_disinfection') }}"

  # Proposed heat actuator profile: 2 h energy-preserving blocks, directional edge correction,
  # bridge an isolated single-quarter OFF between active neighbours, then a 15 min first-order
  # filter with immediate OFF and the physical 550 W minimum.
  # This sensor is computed even while the heat gate is off, but does not write any actuator.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.p_deferrable1
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_space_heat_enabled
          - input_boolean.therma_v_supervisor_cooling_enabled
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    variables:
      heat_profile: >-
        {% set schedule = state_attr('sensor.p_deferrable1', 'deferrables_schedule') or [] %}
        {% set threshold = states('input_number.therma_v_supervisor_power_threshold') | float(100) %}
        {% set min_power = 550.0 %}
        {% set previous_power =
             states('input_number.therma_v_heat_plan_previous_power') | float(0) %}
        {% set seeded_iir = states('input_number.therma_v_heat_plan_iir_power') | float(0) %}
        {% set quarter = as_timestamp(now().replace(minute=(now().minute // 15) * 15,
                                                    second=0, microsecond=0)) %}
        {% set points = namespace(list=[]) %}
        {% for entry in schedule %}
          {% set ts = as_timestamp(entry.date) %}
          {% if ts >= quarter %}
            {% set point_dt = entry.date | as_datetime %}
            {% set block_start = point_dt.replace(hour=(point_dt.hour // 2) * 2,
                                                  minute=0, second=0, microsecond=0).isoformat() %}
            {% set points.list = points.list + [{
              'timestamp': entry.date,
              'ts': ts,
              'block': block_start,
              'raw': entry.p_deferrable1 | float(0)
            }] %}
          {% endif %}
        {% endfor %}
        {% set groups = namespace(keys=[], values=[]) %}
        {% for point in points.list %}
          {% if point.block not in groups.keys %}
            {% set groups.keys = groups.keys + [point.block] %}
            {% set groups.values = groups.values + [[]] %}
          {% endif %}
          {% set group_idx = groups.keys.index(point.block) %}
          {% set group_values = groups.values %}
          {% set groups.values =
               group_values[:group_idx] + [group_values[group_idx] + [point]]
               + group_values[group_idx + 1:] %}
        {% endfor %}
        {% set stats = namespace(sums=[], means=[]) %}
        {% for group_values in groups.values %}
          {% set total = namespace(value=0.0) %}
          {% for point in group_values %}{% set total.value = total.value + point.raw %}{% endfor %}
          {% set stats.sums = stats.sums + [total.value] %}
          {% set stats.means = stats.means + [total.value / (group_values | length)] %}
        {% endfor %}
        {% set blocked_groups = namespace(values=[]) %}
        {% set edge_groups = namespace(values=[]) %}
        {% for group_values in groups.values %}
          {% set mean = stats.means[loop.index0] %}
          {% set total = stats.sums[loop.index0] %}
          {% set blocked_groups.values = blocked_groups.values + [[mean] * (group_values | length)] %}
          {% if total <= 0 %}
            {% set corrected = [0.0] * (group_values | length) %}
          {% elif mean >= min_power %}
            {% set corrected = [mean] * (group_values | length) %}
          {% else %}
            {% set prev_mean = stats.means[loop.index0 - 1]
                               if loop.index0 > 0
                               else (previous_power if previous_power > 0 else none) %}
            {% set next_mean = stats.means[loop.index0 + 1]
                               if loop.index0 + 1 < (stats.means | length) else none %}
            {% set prev_active = prev_mean is not none and prev_mean >= min_power %}
            {% set next_active = next_mean is not none and next_mean >= min_power %}
            {% if next_active and (not prev_active or next_mean >= prev_mean) %}
              {% set base_power = next_mean %}
              {% set align_right = true %}
            {% elif prev_active %}
              {% set base_power = prev_mean %}
              {% set align_right = false %}
            {% elif next_active %}
              {% set base_power = next_mean %}
              {% set align_right = true %}
            {% else %}
              {% set base_power = min_power %}
              {% set align_right = false %}
            {% endif %}
            {% set active_quarters =
                 [1, (total / base_power) | round(0, 'ceil') | int] | max %}
            {% set active_quarters = [active_quarters, group_values | length] | min %}
            {% if align_right %}
              {% set corrected =
                   [0.0] * ((group_values | length) - active_quarters)
                   + [base_power] * active_quarters %}
            {% else %}
              {% set corrected =
                   [base_power] * active_quarters
                   + [0.0] * ((group_values | length) - active_quarters) %}
            {% endif %}
          {% endif %}
          {% set edge_groups.values = edge_groups.values + [corrected] %}
        {% endfor %}
        {% set raw_edges = namespace(values=[]) %}
        {% for group_values in edge_groups.values %}
          {% for value in group_values %}
            {% set raw_edges.values = raw_edges.values + [value] %}
          {% endfor %}
        {% endfor %}
        {% set bridged_edges = namespace(values=raw_edges.values, count=0) %}
        {% for value in raw_edges.values %}
          {% set idx = loop.index0 %}
          {% if value <= 0 and idx > 0 and idx + 1 < (raw_edges.values | length)
                and raw_edges.values[idx - 1] > 0 and raw_edges.values[idx + 1] > 0 %}
            {% set bridge_power =
                 [min_power, [raw_edges.values[idx - 1], raw_edges.values[idx + 1]] | min] | max %}
            {% set values = bridged_edges.values %}
            {% set bridged_edges.values =
                 values[:idx] + [bridge_power] + values[idx + 1:] %}
            {% set bridged_edges.count = bridged_edges.count + 1 %}
          {% endif %}
        {% endfor %}
        {% set profile_points = namespace(list=[]) %}
        {% set filtered = namespace(value=seeded_iir) %}
        {% set point_number = namespace(value=0) %}
        {% for group_values in groups.values %}
          {% set group_idx = loop.index0 %}
          {% for point in group_values %}
            {% set point_idx = loop.index0 %}
            {% set target = bridged_edges.values[point_number.value] %}
            {% if target <= 0 %}
              {% set filtered.value = 0.0 %}
            {% else %}
              {% set filtered.value =
                   [min_power, filtered.value + 0.6321205588 * (target - filtered.value)] | max %}
            {% endif %}
            {% set profile_points.list = profile_points.list + [{
              'timestamp': point.timestamp,
              'ts': point.ts,
              'raw': point.raw | round(0),
              'blocked': blocked_groups.values[group_idx][point_idx] | round(1),
              'edge': target | round(1),
              'edge_unbridged': raw_edges.values[point_number.value] | float(0) | round(1),
              'iir': filtered.value | round(1)
            }] %}
            {% set point_number.value = point_number.value + 1 %}
          {% endfor %}
        {% endfor %}
        {% set current = namespace(found=false, value=0.0, raw=0.0, edge=0.0, iir=0.0) %}
        {% for point in profile_points.list %}
          {% if point.ts == quarter %}
            {% set current.found = true %}
            {% set current.value = point.iir %}
            {% set current.raw = point.raw %}
            {% set current.edge = point.edge %}
            {% set current.iir = point.iir %}
          {% endif %}
        {% endfor %}
        {% set control_enabled = is_state('binary_sensor.therma_v_heat_plan_ready', 'on') %}
        {% set control_power = states('input_number.therma_v_heat_plan_iir_power') | float(0) %}
        {% set plan_state =
             'hold' if not control_enabled or not current.found
             else ('off' if current.raw <= threshold
                             and current.edge <= threshold
                             and control_power <= threshold
                   else 'active') %}
        {% set space_mode_num = states('sensor.therma_v_operation_mode') | int(-1) %}
        {% set heat_mode = space_mode_num == 4 %}
        {% set outside = states('sensor.therma_v_outside_temperature_filtered') | float(10) %}
        {% set curve_slope = states('input_number.therma_v_heating_curve_slope') | float(0.444) %}
        {% set curve_offset = states('input_number.therma_v_heating_curve_offset') | float(0) %}
        {% set room_setpoint = states('input_number.room_setpoint_heating') | float(20) %}
        {% set supply = (min(max(
             room_setpoint * (1 + curve_slope) + curve_offset - curve_slope * outside,
             states('input_number.therma_v_min_water_temperature_heat') | float(20)),
             states('input_number.therma_v_max_water_temperature_heat') | float(42))
             if heat_mode else
             state_attr('sensor.building_parameters', 'cooling_supply_temperature') | float(16)) %}
        {% set lift = (supply - outside) if heat_mode else (outside - supply) %}
        {% set carnot_efficiency = (
             state_attr('sensor.building_parameters', 'carnot_efficiency_heating') | float(0.26)
             if heat_mode else
             state_attr('sensor.building_parameters', 'carnot_efficiency_cooling') | float(0.45)) %}
        {% set space_cop = (
             carnot_efficiency * (supply + 273.15) / lift) if lift > 0 else 1.0 %}
        {% set space_cop = min(max(space_cop, 1.0), 8.0) %}
        {% set room_now = states('sensor.therma_v_room_temperature_effective') | float(room_setpoint) %}
        {% set q_thermal = control_power * space_cop %}
        {% set return_offset = (q_thermal / 1000 + 0.949) / 0.657 %}
        {% set tinlet_unclamped =
             room_now + return_offset if heat_mode else room_now - return_offset %}
        {% set return_band_min = (
             states('input_number.therma_v_min_water_temperature_heat') | float(25)
             if heat_mode else
             states('input_number.therma_v_min_water_temperature_cool') | float(12)) %}
        {% set return_band_max = (
             states('input_number.therma_v_max_water_temperature_heat') | float(42)
             if heat_mode else
             states('input_number.therma_v_max_water_temperature_cool') | float(22)) %}
        {% set tinlet_target =
             min(max(tinlet_unclamped, return_band_min), return_band_max) | round(1)
             if plan_state == 'active' and control_power > threshold else none %}
        {{ {
          'current': control_power,
          'current_raw': current.raw,
          'current_edge': current.edge,
          'current_iir': control_power,
          'current_found': current.found,
          'plan_state': plan_state,
          'space_mode': ('heat' if heat_mode else ('cool' if space_mode_num == 0 else 'idle')),
          'points': profile_points.list,
          'control_enabled': control_enabled,
          'tinlet_target': tinlet_target,
          'model_cop': space_cop,
          'thermal_power': q_thermal,
          'quarter': quarter | int,
          'alpha': 0.6321205588,
          'min_power': min_power,
          'single_quarter_bridges': bridged_edges.count
        } }}
    sensor:
      - name: "Therma V heat plan processed power"
        unique_id: therma_v_heat_plan_processed_power
        icon: mdi:chart-stepline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ has_value('sensor.p_deferrable1')
             and state_attr('sensor.p_deferrable1', 'deferrables_schedule') is not none
             and has_value('input_number.therma_v_heat_plan_iir_power')
             and has_value('input_number.therma_v_heat_plan_previous_power') }}
        state: "{{ heat_profile.current | float(0) | round(0) }}"
        attributes:
          current_raw: "{{ heat_profile.current_raw }}"
          current_edge: "{{ heat_profile.current_edge }}"
          current_iir: "{{ heat_profile.current_iir }}"
          current_found: "{{ heat_profile.current_found }}"
          plan_state: "{{ heat_profile.plan_state }}"
          space_mode: "{{ heat_profile.space_mode }}"
          control_enabled: "{{ heat_profile.control_enabled }}"
          tinlet_target: "{{ heat_profile.tinlet_target }}"
          model_cop: "{{ heat_profile.model_cop }}"
          thermal_power: "{{ heat_profile.thermal_power }}"
          quarter: "{{ heat_profile.quarter }}"
          filter_alpha: "{{ heat_profile.alpha }}"
          min_power: "{{ heat_profile.min_power }}"
          single_quarter_bridges: "{{ heat_profile.single_quarter_bridges }}"
          points: "{{ heat_profile.points }}"

automation:
  # Advance the in-flight house-heat buffer once per completed optimization step. A gap longer
  # than one quarter adds zeros for the missing steps; a counter reset contributes zero.
  - id: therma_v_house_prior_heat_update
    alias: "Therma V house prior heat update"
    description: "Records quarter-hour delivered space heat for the rolling EMHASS topology"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/15"
        seconds: 2
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          counter: "{{ states('sensor.therma_v_space_heating_delivered_heat') }}"
          previous: "{{ states('input_number.therma_v_house_prior_heat_previous_counter') }}"
          last_step: "{{ state_attr('input_datetime.therma_v_house_prior_heat_step_at', 'timestamp') }}"
          raw_buffer: "{{ states('input_text.therma_v_house_prior_heat_json') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ counter | is_number }}"
              - condition: template
                value_template: >-
                  {{ last_step | is_number
                     and now().timestamp() - (last_step | float(0)) >= 750
                     or not (last_step | is_number) }}
            sequence:
              - variables:
                  delta: >-
                    {{ (max((counter | float(0)) - (previous | float(0)), 0) | round(4))
                       if previous | is_number else 0 }}
              - variables:
                  elapsed_steps: >-
                    {{ max(1, min(8, ((now().timestamp() - (last_step | float(now().timestamp()))) / 900)
                       | round(0, 'ceil') | int)) if last_step | is_number else 1 }}
              - variables:
                  updated: >-
                    {% set existing = raw_buffer
                                       if raw_buffer is iterable and raw_buffer is not string
                                       else (raw_buffer | from_json) %}
                    {{ (existing + ([0.0] * ((elapsed_steps | int) - 1))
                        + [delta | float(0)])[-8:] }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.therma_v_house_prior_heat_json
                data:
                  value: "{{ updated | to_json }}"
              - action: input_number.set_value
                target:
                  entity_id: input_number.therma_v_house_prior_heat_previous_counter
                data:
                  value: "{{ counter | float(0) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.therma_v_house_prior_heat_step_at
                data:
                  timestamp: "{{ now().timestamp() }}"

  # Advance the persisted 15 min heat-plan IIR exactly once per quarter. The plan may change every
  # quarter, but the filter state and previous edge must survive MPC updates and HA restarts.
  - id: therma_v_heat_plan_iir_update
    alias: "Therma V heat plan IIR update"
    description: "Advances the persistent heat-plan IIR once per quarter"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.p_deferrable1
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_space_heat_enabled
          - input_boolean.therma_v_supervisor_cooling_enabled
      - trigger: state
        entity_id: sensor.therma_v_heat_plan_processed_power
        attribute: quarter
        # Let the template recompute for the new quarter before its edge is consumed. Firing at the
        # exact boundary can otherwise advance the IIR from the previous quarter's edge.
        for: "00:00:05"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
        seconds: 5
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('sensor.therma_v_heat_plan_processed_power')
             and state_attr('sensor.therma_v_heat_plan_processed_power', 'current_edge') | is_number
             and state_attr('sensor.therma_v_heat_plan_processed_power', 'quarter') | is_number
             and has_value('input_number.therma_v_heat_plan_iir_power')
             and has_value('input_number.therma_v_heat_plan_previous_power') }}
    actions:
      - variables:
          quarter: >-
            {{ as_timestamp(now().replace(minute=(now().minute // 15) * 15,
                                          second=0, microsecond=0)) | int }}
          processed_quarter: >-
            {{ state_attr('sensor.therma_v_heat_plan_processed_power', 'quarter') | int(0) }}
          last_quarter: >-
            {{ state_attr('input_datetime.therma_v_heat_plan_iir_step_at', 'timestamp')
               | int(0) }}
          target: >-
            {{ state_attr('sensor.therma_v_heat_plan_processed_power', 'current_edge')
               | float(0) }}
      - if:
          - condition: template
            value_template: >-
              {{ processed_quarter == quarter and quarter > last_quarter }}
        then:
          - variables:
              previous: "{{ states('input_number.therma_v_heat_plan_iir_power') | float(0) }}"
              next_power: >-
                {{ 0.0 if target <= 0 else
                   max(550.0, previous | float(0)
                       + 0.6321205588 * ((target | float(0)) - (previous | float(0)))) }}
          - action: input_number.set_value
            target:
              entity_id: input_number.therma_v_heat_plan_iir_power
            data:
              value: "{{ next_power | round(1) }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.therma_v_heat_plan_previous_power
            data:
              value: "{{ target | round(1) }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.therma_v_heat_plan_iir_step_at
            data:
              timestamp: "{{ quarter }}"

  # The only writer of DHW target register 8. The climate entity writes the request helper, the
  # effective sensor applies the plan/chase logic, and this automation performs the Modbus write.
  - id: therma_v_apply_dhw_setpoint_auto
    alias: "Therma V apply DHW setpoint auto"
    description: "Writes the effective DHW setpoint to Modbus register 8"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.therma_v_dhw_setpoint_effective
      - trigger: state
        entity_id: sensor.therma_v_dhw_target_temperature
      - trigger: state
        entity_id: input_select.therma_v_control_strategy
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('sensor.therma_v_dhw_setpoint_effective')
             and has_value('sensor.therma_v_dhw_target_temperature') }}
    actions:
      - if:
          - condition: template
            value_template: >-
              {{ (states('sensor.therma_v_dhw_setpoint_effective') | float(0)
                  - states('sensor.therma_v_dhw_target_temperature') | float(0)) | abs >= 0.5 }}
        then:
          - action: modbus.write_register
            data:
              address: 8
              slave: 1
              hub: modbus_gateway_therma_v
              value: >-
                {{ (states('sensor.therma_v_dhw_setpoint_effective') | float(50) * 10) | round(0) | int }}

  # Apply the DHW/booster plan. The HP follows the effective setpoint offset; the external booster
  # remains a quarter-hour on/off threshold.
  - id: therma_v_supervisor_dhw_apply
    alias: "Therma V supervisor DHW apply"
    description: "Runs the DHW heat-pump flow and external booster from a fresh EMHASS plan"
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_dhw_enabled
          - binary_sensor.emhass_forecast_fresh
          - input_datetime.emhass_last_mpc
          - input_datetime.therma_v_supervisor_mode_since
          - sensor.p_deferrable0
          - sensor.p_deferrable2
          - sensor.therma_v_dhw_temperature
          - sensor.therma_v_dhw_setpoint_effective
          - sensor.therma_v_dhw_planned_run_start
          - input_number.therma_v_supervisor_dhw_defer_offset
          - input_number.therma_v_supervisor_dhw_start_margin
          - input_number.therma_v_supervisor_dhw_run_target
          - input_boolean.therma_v_supervisor_dhw_recovery
          - binary_sensor.therma_v_dhw_run_active
          - input_boolean.dhw_disinfection_due
          - input_boolean.dhw_disinfection_active
          - input_boolean.dhw_disinfection_complete
          - input_boolean.dhw_disinfection_stopping
          - input_boolean.dhw_disinfection_stop_failed
          - input_datetime.dhw_next_disinfection
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "EMHASS"
      - condition: state
        entity_id: input_boolean.therma_v_supervisor_dhw_enabled
        state: "on"
      - condition: template
        value_template: >-
          {{ has_value('switch.therma_v_dhw_on_off')
             and has_value('switch.dhw_booster_2_switch')
             and has_value('input_number.therma_v_supervisor_booster_max_temperature')
             and has_value('sensor.therma_v_dhw_temperature')
             and has_value('sensor.therma_v_dhw_setpoint_effective')
             and has_value('sensor.therma_v_dhw_planned_run_start')
             and has_value('input_number.therma_v_supervisor_dhw_start_margin')
             and has_value('input_number.therma_v_supervisor_dhw_run_target')
             and has_value('sensor.p_deferrable0')
             and has_value('sensor.p_deferrable2')
             and has_value('input_datetime.therma_v_supervisor_mode_since') }}
    actions:
      - variables:
          last_mpc: "{{ state_attr('input_datetime.emhass_last_mpc', 'timestamp') }}"
          mode_since: "{{ state_attr('input_datetime.therma_v_supervisor_mode_since', 'timestamp') }}"
          fresh: >-
            {{ is_state('binary_sensor.emhass_forecast_fresh', 'on')
               and last_mpc is not none
               and mode_since is not none
               and (last_mpc | float(0)) >= (mode_since | float(0)) }}
          active: "{{ is_state('input_boolean.dhw_disinfection_active', 'on') }}"
          stopping: "{{ is_state('input_boolean.dhw_disinfection_stopping', 'on') }}"
          stop_failed: "{{ is_state('input_boolean.dhw_disinfection_stop_failed', 'on') }}"
          negative_price: "{{ states('sensor.electricity_buying_price') | float(0) < 0 }}"
          threshold: "{{ states('input_number.therma_v_supervisor_power_threshold') | float(100) }}"
          hp_power: "{{ states('sensor.p_deferrable0') | float(0) }}"
          temp: "{{ states('sensor.therma_v_dhw_temperature') | float(0) }}"
          normal_target: "{{ states('input_number.therma_v_dhw_target_request') | float(50) }}"
          plan_start: >-
            {{ states('sensor.therma_v_dhw_planned_run_start')
               | float(state_attr('sensor.therma_v_dhw_planned_run_start', 'target_temperature')
                       | float(normal_target)) }}
          plan_start_at: >-
            {{ state_attr('sensor.therma_v_dhw_planned_run_start', 'start_at') }}
          plan_target: >-
            {{ state_attr('sensor.therma_v_dhw_planned_run_start', 'target_temperature')
               | float(normal_target) }}
          start_margin: "{{ states('input_number.therma_v_supervisor_dhw_start_margin') | float(0.5) }}"
          dhw_started: >-
            {{ is_state('binary_sensor.therma_v_dhw_heating_state', 'on')
               and is_state('binary_sensor.therma_v_compressor_state', 'on') }}
          start_useful: >-
            {{ plan_start_at not in [none, '']
               and temp <= (plan_start | float(0)) + (start_margin | float(0))
               and temp <= (plan_target | float(0)) - (start_margin | float(0)) }}
          booster_power: "{{ states('sensor.p_deferrable2') | float(0) }}"
          booster_max: "{{ states('input_number.therma_v_supervisor_booster_max_temperature') | float(0) }}"
          next_ts: "{{ state_attr('input_datetime.dhw_next_disinfection', 'timestamp') }}"
          lead_hours: "{{ states('input_number.dhw_disinfection_min_lead_hours') | float(5) }}"
          hold_minutes: "{{ states('input_number.dhw_disinfection_hold_minutes') | float(45) }}"
          prepare: >-
            {{ is_state('input_boolean.dhw_disinfection_due', 'on')
               and next_ts is not none
               and now().timestamp() >= (next_ts | float(0)) - (lead_hours | float(5)) * 3600
               and now().timestamp() < (next_ts | float(0)) + (hold_minutes | float(45)) * 60 }}
          hold: >-
            {{ is_state('input_boolean.dhw_disinfection_due', 'on')
               and next_ts is not none
               and now().timestamp() >= (next_ts | float(0))
               and now().timestamp() < (next_ts | float(0)) + (hold_minutes | float(45)) * 60 }}
          disinfection: "{{ (active | bool) or (hold | bool) }}"
          # During disinfection the HP may start its own booster. The Shelly is only the independent
          # negative-price path and must stay out of both the heat phase and the stop settling phase.
          booster_permitted: >-
            {{ (negative_price | bool)
               and not (active | bool)
               and not (stopping | bool)
               and not (stop_failed | bool) }}
          booster_limit: "{{ booster_max if (booster_permitted | bool) else 55 }}"
          booster_wanted: >-
            {{ (fresh | bool)
               and (booster_power | float(0)) > (threshold | float(100))
               and (booster_permitted | bool)
               and (temp | float(0)) < (booster_limit | float(55)) }}
      # Keep the DHW function enabled while the supervisor owns a live EMHASS run. The setpoint
      # offset determines whether heat is requested; the coil is only permission to operate DHW.
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ not (stop_failed | bool)
                     and is_state('switch.therma_v_dhw_on_off', 'off') }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.therma_v_dhw_on_off
      # Capture the plan's run target before the start kick. The recovery latch then keeps this
      # value even after the current plan block disappears.
      - if:
          - condition: template
            value_template: >-
              {{ (fresh | bool)
                 and (hp_power | float(0)) > (threshold | float(100))
                 and not (dhw_started | bool)
                 and (start_useful | bool) }}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.therma_v_supervisor_dhw_run_target
            data:
              value: "{{ plan_target }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ (booster_wanted | bool)
                     and is_state('switch.dhw_booster_2_switch', 'off') }}
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.dhw_booster_2_switch
          - conditions:
              - condition: template
                value_template: >-
                  {{ (not (booster_wanted | bool))
                     and is_state('switch.dhw_booster_2_switch', 'on') }}
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.dhw_booster_2_switch
  # Start the existing disinfection FSM in EMHASS mode at the same timestamp the planner uses.
  # The 45-minute topology hold consists of this 15-minute local preheat plus the following 30
  # minutes at 60 C, which is exactly the detection threshold.
  - id: therma_v_supervisor_capture_normal_setpoint
    alias: "Therma V supervisor initialize DHW control"
    description: "Initializes the EMHASS DHW owner without changing the user request"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_dhw_enabled
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "EMHASS"
      - condition: state
        entity_id: input_boolean.therma_v_supervisor_dhw_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.dhw_disinfection_active
        state: "off"
      - condition: state
        entity_id: input_boolean.dhw_disinfection_due
        state: "off"
      - condition: template
        value_template: "{{ has_value('climate.therma_v_dhw') }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.therma_v_supervisor_mode_since
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.therma_v_supervisor_dhw_recovery
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.therma_v_supervisor_hvac_recovery
      - action: input_number.set_value
        target:
          entity_id: input_number.therma_v_supervisor_dhw_run_target
        data:
          value: "{{ states('input_number.therma_v_dhw_target_request') | float(50) }}"
      - action: logbook.log
        data:
          name: DHW supervisor
          message: >-
            DHW control initialized; normal request
            {{ states('input_number.therma_v_dhw_target_request') | float(50) }} C

  # Finish-latch: whenever a real DHW run starts (HP, internal booster or Shelly booster), hold the
  # captured run target until the tank has recovered. The same latch uses the dynamic safety floor,
  # so a run cannot be cut short one tenth above it by the tank-following setpoint.
  - id: therma_v_supervisor_dhw_recovery
    alias: "Therma V supervisor DHW recovery"
    description: "Finishes an active DHW run and latches the low-tank bypass to the normal target"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.therma_v_dhw_temperature
          - input_number.therma_v_dhw_target_request
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_dhw_enabled
          - binary_sensor.therma_v_dhw_run_active
          - sensor.therma_v_dhw_safety_floor
          - sensor.therma_v_dhw_planned_run_start
          - input_number.therma_v_supervisor_dhw_start_margin
          - input_number.therma_v_supervisor_dhw_run_target
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "EMHASS"
      - condition: state
        entity_id: input_boolean.therma_v_supervisor_dhw_enabled
        state: "on"
      - condition: template
        value_template: >-
          {{ has_value('sensor.therma_v_dhw_temperature')
             and has_value('sensor.therma_v_dhw_safety_floor') }}
    actions:
      - variables:
          temp: "{{ states('sensor.therma_v_dhw_temperature') | float(0) }}"
          safety_floor: "{{ states('sensor.therma_v_dhw_safety_floor') | float(42) }}"
          normal: "{{ states('input_number.therma_v_dhw_target_request') | float(50) }}"
          plan_target: >-
            {{ state_attr('sensor.therma_v_dhw_planned_run_start', 'target_temperature')
               | float(normal) }}
          start_margin: "{{ states('input_number.therma_v_supervisor_dhw_start_margin') | float(0.5) }}"
          hp_power: "{{ states('sensor.p_deferrable0') | float(0) }}"
          threshold: "{{ states('input_number.therma_v_supervisor_power_threshold') | float(100) }}"
          run_active: "{{ is_state('binary_sensor.therma_v_dhw_run_active', 'on') }}"
          recovery_active: "{{ is_state('input_boolean.therma_v_supervisor_dhw_recovery', 'on') }}"
          run_target: "{{ states('input_number.therma_v_supervisor_dhw_run_target') | float(normal) }}"
      - if:
          - condition: template
            value_template: >-
              {{ (temp | float(0)) <= (safety_floor | float(42))
                 or (run_active | bool) }}
        then:
          - if:
              - condition: template
                value_template: >-
                  {{ (run_active | bool) and not (recovery_active | bool) }}
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.therma_v_supervisor_dhw_run_target
                data:
                  value: >-
                    {{ plan_target
                       if (hp_power | float(0)) > (threshold | float(100))
                          and (temp | float(0)) < (plan_target | float(0)) - (start_margin | float(0))
                       else normal }}
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.therma_v_supervisor_dhw_recovery
      - if:
          - condition: template
            value_template: >-
              {{ not (run_active | bool)
                 and (temp | float(0)) >= (run_target | float(50)) - 0.5 }}
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.therma_v_supervisor_dhw_recovery
          - action: input_number.set_value
            target:
              entity_id: input_number.therma_v_supervisor_dhw_run_target
            data:
              value: "{{ normal }}"

  # Mark the instant at which an HVAC mode enters EMHASS ownership. The first usable heat target
  # requires an MPC completed after this stamp, so a gate change cannot consume the parked plan.
  - id: therma_v_supervisor_hvac_handover
    alias: "Therma V supervisor HVAC handover"
    description: "Arms EMHASS HVAC ownership and waits for the next completed MPC"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_space_heat_enabled
          - input_boolean.therma_v_supervisor_cooling_enabled
          - sensor.therma_v_operation_mode
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {% set op = states('sensor.therma_v_operation_mode') | int(-1) %}
          {{ op in [0, 4]
             and is_state('input_select.therma_v_control_strategy', 'EMHASS')
             and ((op == 4 and is_state('input_boolean.therma_v_supervisor_space_heat_enabled', 'on'))
                  or (op == 0 and is_state('input_boolean.therma_v_supervisor_cooling_enabled', 'on'))) }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.therma_v_supervisor_hvac_since
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: logbook.log
        data:
          name: HVAC supervisor
          message: >-
            EMHASS HVAC handover armed for mode
            {{ states('sensor.therma_v_operation_mode') }}; waiting for the next MPC

  # EMHASS acquisition keeps the current water target until a post-handover MPC exists, even if the
  # compressor is idle, so P/curve cannot write during the bridge. On ownership loss, an active
  # cycle keeps that same target until it ends; the normal controller then owns the next request.
  - id: therma_v_supervisor_hvac_recovery
    alias: "Therma V supervisor HVAC recovery"
    description: "Holds the current water target through an HVAC ownership handover"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.therma_v_hvac_run_active
          - sensor.therma_v_operation_mode
          - sensor.therma_v_room_temperature_effective
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_space_heat_enabled
          - input_boolean.therma_v_supervisor_cooling_enabled
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions: []
    actions:
      - variables:
          op: "{{ states('sensor.therma_v_operation_mode') | int(-1) }}"
          run_active: "{{ is_state('binary_sensor.therma_v_hvac_run_active', 'on') }}"
          heat_gate: "{{ is_state('input_boolean.therma_v_supervisor_space_heat_enabled', 'on') }}"
          cool_gate: "{{ is_state('input_boolean.therma_v_supervisor_cooling_enabled', 'on') }}"
          # op is register 0: 0=cool, 3=auto, 4=heat.
          engaged: >-
            {{ is_state('input_select.therma_v_control_strategy', 'EMHASS')
               and ((op | int(-1) == 4 and (heat_gate | bool))
                    or (op | int(-1) == 0 and (cool_gate | bool))) }}
      - if:
          - condition: template
            value_template: "{{ (engaged | bool) and (run_active | bool) }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.therma_v_supervisor_hvac_recovery
      - if:
          - condition: template
            value_template: "{{ not (run_active | bool) }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.therma_v_supervisor_hvac_recovery

  - id: therma_v_supervisor_disinfection_start
    alias: "Therma V supervisor disinfection start"
    description: "Starts the shared DHW disinfection FSM for a planned EMHASS hold"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time
        at: input_datetime.dhw_next_disinfection
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_datetime.emhass_last_mpc
          - input_datetime.therma_v_supervisor_mode_since
    conditions:
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "EMHASS"
      - condition: state
        entity_id: input_boolean.therma_v_supervisor_dhw_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.dhw_disinfection_due
        state: "on"
      - condition: state
        entity_id: input_boolean.dhw_disinfection_active
        state: "off"
      - condition: template
        value_template: >-
          {% set last_mpc = state_attr('input_datetime.emhass_last_mpc', 'timestamp') %}
          {% set mode_since = state_attr('input_datetime.therma_v_supervisor_mode_since', 'timestamp') %}
          {{ is_state('binary_sensor.emhass_forecast_fresh', 'on')
             and last_mpc is not none and mode_since is not none
             and last_mpc >= mode_since }}
      - condition: template
        value_template: >-
          {% set next_ts = state_attr('input_datetime.dhw_next_disinfection', 'timestamp') %}
          {% set hold = states('input_number.dhw_disinfection_hold_minutes') | float(45) %}
          {{ next_ts is not none
             and now().timestamp() >= next_ts
             and now().timestamp() < next_ts + hold * 60 }}
      - condition: template
        value_template: "{{ has_value('climate.therma_v_dhw') }}"
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dhw_disinfection_started
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dhw_disinfection_cycle_requested_at
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dhw_disinfection_active
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.dhw_disinfection_complete
            - input_boolean.dhw_disinfection_stopping
            - input_boolean.dhw_disinfection_stop_failed
            - input_boolean.dhw_disinfection_cycle_requested
      - action: switch.turn_on
        target:
          entity_id: switch.therma_v_dhw_on_off
      - action: switch.turn_off
        target:
          entity_id: switch.dhw_booster_2_switch
      - action: switch.turn_off
        target:
          entity_id: switch.therma_v_trigger_dhw_disinfection_cycle
      - action: logbook.log
        data:
          name: DHW disinfection
          message: >-
            EMHASS scheduled HA disinfection started; normal request
            {{ states('input_number.therma_v_dhw_target_request') | float(50) }} C

  # Hand the physical DHW/booster layer back safely when leaving EMHASS or disabling the DHW gate.
  - id: therma_v_supervisor_handover
    alias: "Therma V supervisor handover"
    description: "Restores normal DHW control outside the EMHASS DHW supervisor"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - input_select.therma_v_control_strategy
          - input_boolean.therma_v_supervisor_dhw_enabled
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ not is_state('input_select.therma_v_control_strategy', 'EMHASS')
             or not is_state('input_boolean.therma_v_supervisor_dhw_enabled', 'on') }}
      - condition: template
        value_template: >-
          {{ has_value('switch.therma_v_dhw_on_off')
             and has_value('switch.dhw_booster_2_switch') }}
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.therma_v_dhw_on_off
      - action: switch.turn_off
        target:
          entity_id: switch.dhw_booster_2_switch
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.therma_v_supervisor_dhw_recovery
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.therma_v_supervisor_hvac_recovery
      - action: input_number.set_value
        target:
          entity_id: input_number.therma_v_supervisor_dhw_run_target
        data:
          value: "{{ states('input_number.therma_v_dhw_target_request') | float(50) }}"
