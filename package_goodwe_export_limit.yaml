input_select:
  # Input select to switch between export regimes
  # 0 - Manual control of grid export limit
  # 1 - Maximum export, but no export with net negative prices
  # 2 - No export with net negative prices
  #     With gross negative prices the export limiter is scaled down linearly
  #     But if power usage is higher zero on meter wins
  # 3 - Net metering when gross prices become negative
  # 4 - No export only zero on meter
  goodwe_export_strategy_select:
    name: "GoodWe grid export strategy"
    options:
      - "0 - Manual"
      - "1 - Maximum (zero export with net negative prices)"
      - "2 - Balanced (ratio-based export with gross negative prices)"
      - "3 - Minimum (zero on meter with gross negative prices)"
      - "4 - No (zero on meter)"
    icon: mdi:sun-compass

input_number:
  goodwe_grid_export_limit:
    name: "GoodWe grid export limit"
    initial: 100
    min: 0
    max: 100
    step: 0.1 # 0.1 resolution gives better integration accuracy.
    mode: slider
    unit_of_measurement: "%"
  # Not on the UI: threshold for the export strategies. The always-active rule compares it
  # with the buying price; strategies 1-3 compare it with the selling price.
  goodwe_grid_export_gross_negative:
    name: "GoodWe grid export gross negative"
    initial: -0.01 # Slightly conservative.
    unit_of_measurement: "€"
    min: -1
    max: 1
    step: 0.001

sensor:
  # Filtered power sensor, this filter acts as anti-aliasing filter for the 
  # zero on meter algorithm
  - platform: filter
    name: "P1 meter active power filtered"
    unique_id: p1_meter_active_power_filtered
    entity_id: sensor.p1_meter_3c39e72e6af0_active_power
    filters:
      - filter: lowpass
        time_constant: 3

automation:
  # Export-limit controller: zero on a negative net price, then apply the selected strategy.
  - id: goodwe_e_price_negative_auto
    alias: "GoodWe e-price negative auto"
    description: "Controls the GoodWe export limit from the current prices and P1 power"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/50" # Slower than the Sessy loop: the inverter needs time to follow changes.
    conditions:
      - condition: state  # 'day' condition: from sunrise until sunset
        entity_id: sun.sun
        state: "above_horizon"
      - condition: template
        value_template: "{{ has_value('sensor.goodwe_export_power_limit') }}"
      - condition: template
        value_template: "{{ not is_state('input_select.goodwe_export_strategy_select', state_attr('input_select.goodwe_export_strategy_select', 'options')[ 0 ] ) }}"
    actions:
      - variables:
          rated_power: 8000 # Inverter rated power.
          update_ratio: 0.8 # Convergence speed, 0 < ratio < 1.
          threshold_power: 100 # Leave this much import headroom so the battery ZoM stays in control.

          zero_on_meter: >-
            {% set current_limit = states('input_number.goodwe_grid_export_limit') | float(0) %}
            {% set p1_power      = states('sensor.p1_meter_active_power_filtered') | float(0) %}
            {% set ctrl_power    = p1_power + threshold_power %} {# Positive P1 means import. #}

            {# Adjust the export limit from the P1 surplus/shortfall #}
            {% set adjustment    = (update_ratio * 100 / rated_power) * ctrl_power %}
            {% set new_limit     = current_limit + adjustment %}
            
            {# Clamp the result strictly between 0% and 100% #}
            {{ max(min(new_limit, 100), 0) }}
            
          balanced_max: >-
            {% set base_price   = states('sensor.nord_pool_nl_current_price') | float(0) | abs %}
            {% set buying_price = states('sensor.electricity_buying_price') | float(0) | abs %}
            
            {# Avoid a division by zero when both prices are exactly 0 #}
            {% set total_price  = buying_price + base_price %}
            
            {% if total_price > 0 %}
              {# Work out the base price's share of the total price #}
              {% set price_ratio   = (base_price / total_price) * 100.0 %}
              {% set balanced_calc = 100.0 - price_ratio %}
              {{ max(min(balanced_calc, 100), 0) }}
            {% else %}
              100
            {% endif %}
      - choose:
          - conditions: # ZERO EXPORT for inc. negative prices (always active)
              - condition: numeric_state
                entity_id: sensor.electricity_buying_price
                below: input_number.goodwe_grid_export_gross_negative
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.goodwe_grid_export_limit
                data:
                  value: 0.0
          - conditions: # MAXIMUM EXPORT (set strategy)
              - condition: template
                value_template: "{{ is_state('input_select.goodwe_export_strategy_select', state_attr('input_select.goodwe_export_strategy_select', 'options')[ 1 ] ) }}"
              - condition: numeric_state
                entity_id: sensor.electricity_selling_price
                below: input_number.goodwe_grid_export_gross_negative
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.goodwe_grid_export_limit
                data:
                  value: 100
          - conditions: # BALANCED EXPORT grid export is scaled down linearly with negative price
              - condition: template
                value_template: "{{ is_state('input_select.goodwe_export_strategy_select', state_attr('input_select.goodwe_export_strategy_select', 'options')[ 2 ] ) }}"
              - condition: numeric_state
                entity_id: sensor.electricity_selling_price
                below: input_number.goodwe_grid_export_gross_negative
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.goodwe_grid_export_limit
                data:
                  value: "{{ max(balanced_max,zero_on_meter) | round(1) }}"
          - conditions: # MINIMUM EXPORT OR NO EXPORT (net metering strategies)
              - or:
                  - and:
                      # MINIMUM EXPORT (net metering below the price threshold)
                      - condition: template
                        value_template: "{{ is_state('input_select.goodwe_export_strategy_select', state_attr('input_select.goodwe_export_strategy_select', 'options')[ 3 ] ) }}"
                      - condition: numeric_state
                        entity_id: sensor.electricity_selling_price
                        below: input_number.goodwe_grid_export_gross_negative
                  - condition: template # NO EXPORT (net metering)
                    value_template: "{{ is_state('input_select.goodwe_export_strategy_select', state_attr('input_select.goodwe_export_strategy_select', 'options')[ 4 ] ) }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.goodwe_grid_export_limit
                data:
                  value: "{{ zero_on_meter | round(1) }}"
        default:
          - action: input_number.set_value
            target:
              entity_id: input_number.goodwe_grid_export_limit
            data:
              value: 100

  # Update function for grid export limit. Sets input number based on Goodwe state and vice verse
  - id: goodwe_update_grid_export_limit_auto
    alias: "GoodWe update grid export limit auto"
    description: "Synchronizes the GoodWe grid export limit input number and Modbus state"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - input_number.goodwe_grid_export_limit
        id: grid_export_limit_number_trig
      - trigger: template
        value_template: >-
          {% set modbus_limit = states('sensor.goodwe_export_power_limit') | float('unknown') %}
          {% set requested    = states('input_number.goodwe_grid_export_limit') | float('unknown') %}
          {{ modbus_limit | is_number and requested | is_number
             and (modbus_limit - requested) | abs > 1 }}
        for: "00:15:00"
        id: grid_export_limit_catch_trig
      - trigger: time_pattern
        minutes: "/15"
        id: grid_export_limit_heartbeat_trig
    conditions:
      - condition: state  # 'day' condition: from sunrise until sunset
        entity_id: sun.sun
        state: "above_horizon"
      - condition: template
        value_template: "{{ has_value('sensor.goodwe_export_power_limit') }}"
    actions:
      - variables:
          input_value: "{{ states('input_number.goodwe_grid_export_limit') | round(0) }}"
      - action: modbus.write_register
        data:
          address: 292
          slave: 1
          hub: modbus_gateway_goodwe
          # Should be written using [array] mode, i.e. 0x10, iso (single data) mode, i.e. 0x06
          # Even for int16 and uint16, which is in violation with the modbus spec.
          # The GoodWe manual explains this correctly though: all writes use function code 0x10.
          # The number is rounded and clipped to 0..100.
          value: "{{ [min(max(input_value | round(0), 0), 100)] }}"
