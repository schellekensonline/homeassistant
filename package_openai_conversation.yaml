# ─── HOME ASSISTANT PACKAGE: SEARXNG INTERNET TOOL FOR THE LLM ───────

# 1. Activeer Python scripts
python_script:

# 2. The API connection to your SearXNG Docker container
rest_command:
  searxng_search_api:
    url: "http://{{ host }}/search?q={{ query }}&format=json"
    method: GET
    headers:
      accept: "application/json"

# 3. The script the LLM recognises as a "Tool" and can execute
script:
  searxng_search:
    alias: "Internet Zoekopdracht (SearXNG)"
    description: "Use this function to look up current information, weather or news on the internet."
    fields:
      query:
        name: "Zoekopdracht"
        description: "The specific search term to look up on the internet."
        required: true
        selector:
          text:
            multiline: false  

    sequence:
      # Step 1: perform the API call to SearXNG
      - action: rest_command.searxng_search_api
        data:
          host: !secret searxng_url  # Jouw werkende host-variabele
          query: "{{ query }}"
        response_variable: raw_search_result

      # Step 2: process the response straight away and wrap it in a dictionary
      - variables:
          output_data:
            results: >
              {% if raw_search_result is defined and raw_search_result.content is defined %}
                {% set data = raw_search_result.content %}
                {% if data.results is defined and data.results | length > 0 %}
                  {% set ns = namespace(items=[]) %}
                  {% for item in data.results[:3] %}
                    {% set ns.items = ns.items + [ item.title ~ " -> " ~ item.content ] %}
                  {% endfor %}
                  {{ ns.items }}
                {% else %}
                  "Geen internetresultaten gevonden voor deze zoekopdracht."
                {% endif %}
              {% else %}
                "Fout bij het verbinden met de zoekmachine."
              {% endif %}

      # Step 3: return the dictionary to the OpenAI integration
      - stop: "Zoekopdracht voltooid"
        response_variable: output_data
  
