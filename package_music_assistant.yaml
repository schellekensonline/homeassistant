input_select:
  # Input select to switch between heatpump power saving regimes
  music_assistant_radio_select:
    name: "Music Assistant Radio selector"
    options:
      - "Geen favorieten gevonden"   # text should match with ESPhome text_sensor
  music_assistant_album_select:
    name: "Music Assistant Album selector"
    options:
      - "Geen favorieten gevonden"   # text should match with ESPhome text_sensor

template:
  - sensor:
      - name: "Music Assistant Active Album Art"
        unique_id: music_assistant_active_album_art
        state: >
          {% set player = 'media_player.' ~ 'esp32_s3_box_player' %}
          {% if state_attr(player, 'entity_picture') %}
            {{ state_attr(player, 'entity_picture') }}
          {% else %}
            none
          {% endif %}


automation:
  - id: music_assistant_get_radiostations_auto
    alias: "Music Assistant get Radiostations auto"
    description: "Haalt radiozenders op en zet ze in een input_select"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time
        at: "04:00:00"  # Dagelijkse synchronisatie
      - platform: event
        event_type: call_service
        event_data:
          domain: input_select
          service: reload
      - platform: event
        event_type: call_service
        event_data:
          domain: homeassistant
          service: reload_all
    action:
    # 1. Haal de live bibliotheek op van Music Assistant
    - action: music_assistant.get_library
      data:
        media_type: radio
        favorite: true
        config_entry_id: 01KRK5PNB04Z9WV4PESRKCGJ9X
      response_variable: mass_radio
      # 2. Vul de Home Assistant input_select helper met de zenders
    - action: input_select.set_options
      target:
        entity_id: input_select.music_assistant_radio_select
      data:
        options: >
          {% if mass_radio is defined and 'items' in mass_radio %}
            {{ mass_radio['items'] | map(attribute='name') | list }}
          {% else %}
            {{ ['Geen favorieten gevonden'] | list }}
          {% endif %}
    mode: restart

  - id: music_assistant_play_selected_station_auto
    alias: "Music Assistant Play Selected Station auto"
    description: "Start direct de zender zodra de input_select helper wijzigt"
    trigger:
      - platform: state
        entity_id: input_select.music_assistant_radio_select
    condition:
      # Voorkom dat hij probeert af te spelen als de lijst leeg is of laadt
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['Laden...', 'Geen favorieten gevonden', 'Geen zenders gevonden', 'unknown', 'unavailable'] }}"
    action:
      - action: music_assistant.play_media
        target:
          entity_id: media_player.esp32_s3_box_player  # <--- Vervang dit door de media_player van je S3 Box (of je andere speaker)
        data:
          media_id: "{{ trigger.to_state.state }}"
          media_type: radio
    mode: restart

  - id: music_assistant_get_albums_auto
    alias: "Music Assistant get Albums auto"
    description: "Haalt Albums op en zet ze in een input_select"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time
        at: "04:00:00"  # Dagelijkse synchronisatie
      - platform: event
        event_type: call_service
        event_data:
          domain: input_select
          service: reload
      - platform: event
        event_type: call_service
        event_data:
          domain: homeassistant
          service: reload_all
    action:
    # 1. Haal de live bibliotheek op van Music Assistant
    - action: music_assistant.get_library
      data:
        media_type: album
        favorite: true
        config_entry_id: 01KRK5PNB04Z9WV4PESRKCGJ9X
      response_variable: mass_album
      # 2. Vul de Home Assistant input_select helper met de zenders
    - action: input_select.set_options
      target:
        entity_id: input_select.music_assistant_album_select
      data:
        options: >
          {% if mass_album is defined and 'items' in mass_album %}
            {{ mass_album['items'] | map(attribute='name') | list }}
          {% else %}
            {{ ['Geen favorieten gevonden'] | list }}
          {% endif %}
    mode: restart

  - id: music_assistant_play_selected_album_auto
    alias: "Music Assistant Play Selected Album auto"
    description: "Start direct de zender zodra de input_select helper wijzigt"
    trigger:
      - platform: state
        entity_id: input_select.music_assistant_album_select
    condition:
      # Voorkom dat hij probeert af te spelen als de lijst leeg is of laadt
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['Laden...', 'Geen favorieten gevonden', 'Geen albums gevonden', 'unknown', 'unavailable'] }}"
    action:
      - action: music_assistant.play_media
        target:
          entity_id: media_player.esp32_s3_box_player  # <--- Vervang dit door de media_player van je S3 Box (of je andere speaker)
        data:
          media_id: "{{ trigger.to_state.state }}"
          media_type: album
    mode: restart

  - id: listen_radio_harmony_auto
    alias: "Listen to radio started from harmony hub auto"
    triggers:
      - trigger: state
        entity_id: remote.living_room
    conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.current_activity == "Listen to Radio" }}'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.esp32_s3_box_player_backlight
      - action: music_assistant.play_media
        target:
          entity_id: media_player.esp32_s3_box_player  # <--- Vervang dit door de media_player van je S3 Box (of je andere speaker)
        data:
          media_id: "{{ states('input_select.music_assistant_radio_select') }}"
          media_type: radio

  - id: listen_albums_harmony_auto
    alias: "Listen to albums started from harmony hub auto"
    triggers:
      - trigger: state
        entity_id: remote.living_room
    conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.current_activity == "Listen to Albums" }}'
    actions:
      - action: light.turn_on
        target:
          entity_id: light.esp32_s3_box_player_backlight
      - action: music_assistant.play_media
        target:
          entity_id: media_player.esp32_s3_box_player  # <--- Vervang dit door de media_player van je S3 Box (of je andere speaker)
        data:
          media_id: "{{ states('input_select.music_assistant_album_select') }}"
          media_type: album

  - id: standby_player_from_harmony_auto
    alias: "Standby player from harmony hub auto"
    triggers:
      - trigger: state
        entity_id: remote.living_room
    conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.current_activity == "PowerOff" }}'
    actions:
      - action: light.turn_off
        target:
          entity_id: light.esp32_s3_box_player_backlight
      - action: media_player.media_pause
        target:
          entity_id: media_player.esp32_s3_box_player

  - id: music_assistant_execute_ir_command_auto
    alias: "Music Assistant execute IR command auto"
    description: "Stuurt media-opdrachten ontvangen door de ir receiver naar player"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_play
        from: "off"
        to: "on"
        id: play
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_pause
        from: "off"
        to: "on"
        id: pause
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_stop
        from: "off"
        to: "on"
        id: stop
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_rewind
        from: "off"
        to: "on"
        id: rewind
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_fast_forward
        from: "off"
        to: "on"
        id: fast_forward
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_previous
        from: "off"
        to: "on"
        id: previous
      - platform: state
        entity_id: binary_sensor.livingroom_rf_ir_remote_media_player_next
        from: "off"
        to: "on"
        id: next
    conditions:
      - or:
        - condition: state
          entity_id: remote.living_room
          attribute: current_activity
          state: "Listen to Radio"
        - condition: state
          entity_id: remote.living_room
          attribute: current_activity
          state: "Listen to Albums"
    actions:
      - choose:
          # === PLAY ===
          - conditions:
              - condition: trigger
                id: play
            sequence:
              - action: media_player.media_play
                target:
                  entity_id: media_player.esp32_s3_box_player

          # === PAUSE ===
          - conditions:
              - condition: trigger
                id: pause
            sequence:
              - action: media_player.media_pause
                target:
                  entity_id: media_player.esp32_s3_box_player

          # === STOP ===
          - conditions:
              - condition: trigger
                id: stop
            sequence:
              - action: media_player.media_stop
                target:
                  entity_id: media_player.esp32_s3_box_player

          # === REWIND ===
          - conditions:
              - condition: trigger
                id: rewind
            sequence:
              - action: media_player.media_previous_track
                target:
                  entity_id: media_player.esp32_s3_box_player

          # === FAST FORWARD ===
          - conditions:
              - condition: trigger
                id: fast_forward
            sequence:
              - action: media_player.media_next_track
                target:
                  entity_id: media_player.esp32_s3_box_player

          # === PREVIOUS ===
          - conditions:
              - condition: trigger
                id: previous
            sequence:
              - choose:
                  # Als de activiteit 'Listen to Radio' is -> Radio input_select eentje omlaag
                  - conditions:
                      - condition: state
                        entity_id: remote.living_room
                        attribute: current_activity
                        state: "Listen to Radio"
                    sequence:
                      - action: input_select.select_previous
                        data:
                          cycle: true
                        target:
                          entity_id: input_select.music_assistant_radio_select
                  # Als de activiteit 'Listen to Albums' is -> Album input_select eentje omlaag
                  - conditions:
                      - condition: state
                        entity_id: remote.living_room
                        attribute: current_activity
                        state: "Listen to Albums"
                    sequence:
                      - action: input_select.select_previous
                        data:
                          cycle: true
                        target:
                          entity_id: input_select.music_assistant_album_select
                # Standaard actie als er GEEN radio of album activiteit actief is
                default:
                  - action: media_player.media_previous_track
                    target:
                      entity_id: media_player.esp32_s3_box_player

          # === NEXT ===
          - conditions:
              - condition: trigger
                id: next
            sequence:
              - choose:
                  # Als de activiteit 'Listen to Radio' is -> Radio input_select eentje omhoog
                  - conditions:
                      - condition: state
                        entity_id: remote.living_room
                        attribute: current_activity
                        state: "Listen to Radio"
                    sequence:
                      - action: input_select.select_next
                        data:
                          cycle: true
                        target:
                          entity_id: input_select.music_assistant_radio_select 
                  # Als de activiteit 'Listen to Albums' is -> Album input_select eentje omhoog
                  - conditions:
                      - condition: state
                        entity_id: remote.living_room
                        attribute: current_activity
                        state: "Listen to Albums"
                    sequence:
                      - action: input_select.select_next
                        data:
                          cycle: true
                        target:
                          entity_id: input_select.music_assistant_album_select 
                # Standaard actie als er GEEN radio of album activiteit actief is
                default:
                  - action: media_player.media_next_track
                    target:
                      entity_id: media_player.esp32_s3_box_player