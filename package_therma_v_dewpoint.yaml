template:
  # Dewpoint for the living room (Shelly Plus HT1), outside (OpenWeatherMap) and the bathroom
  # (eWeLink SNZB-02P). Plain template sensors: they follow the temperature *and* the humidity,
  # where the earlier trigger-based version only recalculated when the temperature changed (so
  # a humidity-only change left a stale dewpoint). Simple approximation, good enough above
  # ~50% RH: Td = T - (100 - RH) / 5. Kept inline in the package on purpose: a template sensor
  # cannot call a script, and custom_templates/ belongs to HACS and Home Assistant itself.
  - sensor:
      - name: "Shelly Plus HT1 dewpoint"
        unique_id: shelly_plus_ht1_dewpoint
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >
          {{ states('sensor.shelly_plus_ht1_temperature') | is_number
             and states('sensor.shelly_plus_ht1_humidity') | is_number }}
        state: >
          {% set t  = states('sensor.shelly_plus_ht1_temperature') | float(0) %}
          {% set rh = states('sensor.shelly_plus_ht1_humidity') | float(0) %}
          {{ (t - ((100.0 - rh) / 5.0)) | round(1) }}

      - name: "OpenWeatherMap dewpoint"
        unique_id: openweathermap_dewpoint
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >
          {{ states('sensor.openweathermap_temperature') | is_number
             and states('sensor.openweathermap_humidity') | is_number }}
        state: >
          {% set t  = states('sensor.openweathermap_temperature') | float(0) %}
          {% set rh = states('sensor.openweathermap_humidity') | float(0) %}
          {{ (t - ((100.0 - rh) / 5.0)) | round(1) }}

      - name: "eWeLink SNZB-02P dewpoint"
        unique_id: ewelink_snzb_02p_dewpoint
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >
          {{ states('sensor.ewelink_snzb_02p_temperature') | is_number
             and states('sensor.ewelink_snzb_02p_humidity') | is_number }}
        state: >
          {% set t  = states('sensor.ewelink_snzb_02p_temperature') | float(0) %}
          {% set rh = states('sensor.ewelink_snzb_02p_humidity') | float(0) %}
          {{ (t - ((100.0 - rh) / 5.0)) | round(1) }}

automation:
  # Stop cooling when the living room dewpoint is above the return temperatures: water colder
  # than the dewpoint condenses in the floor circuit. Silent mode goes off with it.
  - id: cooling_off_based_on_dewpoint_auto
    alias: "Cooling off based on dewpoint auto"
    description: "Switches cooling and silent mode off when the living room dewpoint is above both return temperatures"
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.shelly_plus_ht1_dewpoint
      # Also when cooling starts, in case the dewpoint is already too high.
      - trigger: state
        entity_id: climate.therma_v_heating_cooling
    conditions:
      - condition: state
        entity_id: climate.therma_v_heating_cooling
        state: "cool"
      - condition: template
        # One comparison against the highest of the two return temperatures.
        value_template: >-
          {{ states('sensor.shelly_plus_ht1_dewpoint') | is_number
             and (states('sensor.shelly_plus_ht1_dewpoint') | float(0))
                 > max(states('sensor.therma_v_buffer_temperatures_return_from_heating_t3') | float(0),
                       states('sensor.therma_v_buffer_temperatures_return_to_heatpump_t4') | float(0)) }}
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.silent_mode_state
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.therma_v_heating_cooling
        data:
          hvac_mode: "off"
