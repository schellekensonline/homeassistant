input_boolean:
  no_birds_on_lawn_mode:
    name: "No birds on the lawn mode"

template:
 - binary_sensor:
      # is a zone active?
    - name: "B Hyve zone active"
      unique_id: b_hyve_zone_active_sensor
      state: >
        {% set flower_box_wall = is_state('valve.smart_indoor_timer_bloembak_muur_zone','open') %}
        {% set border_back     = is_state('valve.smart_indoor_timer_border_achter_zone','open') %}
        {% set lawn_left_right = is_state('valve.smart_indoor_timer_gazon_links_rechts_zone','open') %}
        {% set lawn_center     = is_state('valve.smart_indoor_timer_gazon_midden_zone','open') %}
        {% set front_garden    = is_state('valve.smart_indoor_timer_voor_zijtuin_zone','open') %}

        {{ flower_box_wall or border_back or lawn_left_right or lawn_center or front_garden }}
      icon: >
        {% if is_state('binary_sensor.b_hyve_zone_active','on') %} 
          {{'mdi:sprinkler'}} 
        {% else %} 
          {{'mdi:water-off-outline' }}
        {% endif %}     
        
automation:
  - id: b_hyve_no_birds_on_lawn_auto
    alias: "B Hyve no birds on lawn auto"
    description: enables pop up sprinklers when bird is detected on the lawn
    mode: single
    max_exceeded: silent 
    triggers:
      - trigger: state
        entity_id: binary_sensor.lawn_zone_bird_occupancy
        to: "on"
        for: "00:00:05"
    conditions: 
      - condition: state
        entity_id: binary_sensor.b_hyve_zone_active
        state: "off"
      - condition: state
        entity_id: input_boolean.no_birds_on_lawn_mode
        state: "on"
    actions:
      - action: valve.open_valve
        target:
          entity_id: valve.smart_indoor_timer_gazon_links_rechts_zone
      - delay: "00:00:15"
      - action: valve.close_valve
        target:
          entity_id: valve.smart_indoor_timer_gazon_links_rechts_zone
