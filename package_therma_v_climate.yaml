# LG Therma V climate entities on Home Assistant's own template climate platform (core, new in HA
# 2026.10). Converted on 2026-10-08 from the HACS climate_template integration
# (jcwillox/hass-template-climate v1.4.1) - that one still loaded on 2026.10, but it merges core's
# old voluptuous template schema into its own PLATFORM_SCHEMA and core moved those schemas to
# probatio, so a future HACS/core change could have taken the entities down at any moment. See
# notes_dockers_hass.md, "Template climate: HACS -> core"; the previous version of this file is in
# git history. The entity ids did not change: the two old registry entries were removed and these
# two took their ids, so the packages, the EMHASS payload, the disinfection automations and the
# dashboard needed no changes.
#
# What it is: it wraps the heat pump's Modbus registers into a regular climate entity. Non-auto
# modes write the target water temperature (address 2, degrees x 10); auto mode writes a delta
# (address 4, signed 16-bit, hence the +65536 for negative values).
#
# Mapping from the HACS keys, checked against the 2026.10 sources:
#   * the `_template` suffix is gone: availability, current_temperature, target_temperature,
#     hvac_mode;
#   * `modes` -> `hvac_modes`, a template that renders a *list*; `temp_step` ->
#     `target_temperature_step`; `min_temp`/`max_temp` -> `min_temperature`/`max_temperature`;
#   * min_temperature/max_temperature cannot be templates here (plain floats, and min_temp/max_temp
#     are in the blocked-attribute list of the `attributes` option). They are static below, wide
#     enough for both regimes, and the mode-dependent limits the HACS version had live on as a
#     clamp inside `set_temperature` - so the Modbus registers still never see a delta outside
#     -5..5 or a water temperature outside 10..40;
#   * the script variables are the same as before: `set_temperature` gets temperature,
#     target_temp_high, target_temp_low and hvac_mode, `set_hvac_mode` gets hvac_mode.

template:
  - climate:
      - name: "Therma V heating/cooling"
        unique_id: therma_v_heating_cooling
        target_temperature_step: 1
        # Static range: it has to fit the auto-mode delta (-5..5) and the water temperatures
        # (10..40). The platform clamps the *rendered* target into this range and rejects a service
        # call outside it, so it may not be narrower than either regime.
        min_temperature: -5
        max_temperature: 40
        availability: >-
          {{ has_value('switch.therma_v_heating_cooling_on_off')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_room_temperature')
             and has_value('sensor.therma_v_target_temperature_circuit_1') }}
        # Room temperature is deliberate: the climate card should show the value the room control
        # loop works with. The water inlet/outlet variants are not used here.
        current_temperature: "{{ states('sensor.therma_v_room_temperature') }}"
        # What the card shows, per regime (step 3b, 2026-10-11):
        #   * temperature control on (input_select.therma_v_temperature_control) - the slider is the
        #     *room* setpoint, because that is the knob the curve and the room term are driven by.
        #     That is 'Room control (P)' in heat and auto, and 'Heating-curve' in heat (auto keeps the
        #     pump's own curve, so there the delta request stays the slider);
        #   * otherwise the *request*, never the moving effective value: since 2026-10-10 the start-up
        #     layer (package_therma_v_startup_control.yaml) is the only writer of registers 2 and 4.
        #     Auto shows the delta request, the other modes the water request.
        # The registers themselves stay readable through sensor.therma_v_target_temperature_circuit_1,
        # sensor.therma_v_auto_mode_target_temperature_delta_circuit_1,
        # sensor.therma_v_water_setpoint_effective and sensor.therma_v_auto_delta_effective.
        target_temperature: >-
          {% set tc = states('input_select.therma_v_temperature_control') %}
          {# Register 0: 0=cool, 3=auto, 4=heat. #}
          {% set mode = states('sensor.therma_v_operation_mode') | int(-1) %}
          {% if tc == 'Room control (P)' or (tc == 'Heating-curve' and mode == 4) %}
          {{ states('input_number.room_setpoint_heating') }}
          {% elif mode == 3 %}
          {{ states('input_number.therma_v_auto_delta_request') }}
          {% else %}
          {{ states('input_number.therma_v_water_target_request') }}
          {% endif %}
        hvac_modes: "{{ ['off', 'cool', 'heat', 'auto'] }}"
        hvac_mode: >-
          {% if is_state('switch.therma_v_heating_cooling_on_off', 'off') %}
          off
          {% elif is_state('sensor.therma_v_operation_mode', '0') %}
          cool
          {% elif is_state('sensor.therma_v_operation_mode', '4') %}
          heat
          {% elif is_state('sensor.therma_v_operation_mode', '3') %}
          auto
          {% endif %}
        set_temperature:
          # The HACS entity had these as min_temp_template / max_temp_template; here they are a
          # clamp on the value that goes to the Modbus register. `temperature` is the requested
          # value from the service call.
          - variables:
              # A script `variables:` value is normalised to its native type: `{{ states(...) }}`
              # arrives as the *number* 4, not the string "4" (measured 2026-10-10; even `| string`
              # in the definition is normalised back). Every `mode == '4'` therefore compared a
              # number with a string and was false, which swapped the heat and cool bands from the
              # core migration on 2026-10-08 until this fix. All mode comparisons below are numeric
              # (`mode | int(-1)`), which is immune to that normalisation. It only became visible
              # when the cool band was narrowed to 10..20 and a heat request of 25 came back as 20.
              mode: "{{ states('sensor.therma_v_operation_mode') }}"
              # Register 1: 0=outlet, 1=inlet, 2=room; values below 2 use water control.
              water_control: "{{ states('sensor.therma_v_control_mode') | int(-1) < 2 }}"
              # Who the slider belongs to. True while the temperature control select drives this
              # regime, so the service call sets the *room* setpoint instead of a water/delta value
              # (step 3b, 2026-10-11). The band comes from the helper itself, so the clamp cannot
              # drift from it. `mode` is already defined above - variables render in order.
              room_control: >-
                {% set tc = states('input_select.therma_v_temperature_control') %}
                {{ tc == 'Room control (P)' or (tc == 'Heating-curve' and mode | int(-1) == 4) }}
              # The water band now comes from the four min/max helpers (the same source the
              # start-up layer uses); auto keeps the -5..5 delta and room control the 15..25 band.
              temp_lo: >-
                {% if room_control %}{{ state_attr('input_number.room_setpoint_heating','min') | float(15) }}
                {% elif mode | int(-1) == 3 %}-5
                {% elif water_control %}{{ states('input_number.therma_v_min_water_temperature_heat') if mode | int(-1) == 4 else states('input_number.therma_v_min_water_temperature_cool') }}
                {% else %}15{% endif %}
              temp_hi: >-
                {% if room_control %}{{ state_attr('input_number.room_setpoint_heating','max') | float(24) }}
                {% elif mode | int(-1) == 3 %}5
                {% elif water_control %}{{ states('input_number.therma_v_max_water_temperature_heat') if mode | int(-1) == 4 else states('input_number.therma_v_max_water_temperature_cool') }}
                {% else %}25{% endif %}
              target: "{{ min(max(temperature | float(0), temp_lo | float(0)), temp_hi | float(40)) }}"
          - choose:
              # Temperature control owns the setpoint: write the room setpoint. First, so the auto
              # branch below cannot swallow the auto + room case. Same `temperature is number` guard
              # as the default branch: a range-style call without `temperature` must not write.
              - conditions:
                  - "{{ room_control }}"
                  - "{{ temperature is number }}"
                sequence:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.room_setpoint_heating
                    data:
                      value: "{{ target }}"
              - conditions:
                  - "{{ mode | int(-1) == 3 }}"  # auto mode: the delta request helper
                  - "{{ temperature is number }}"
                sequence:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.therma_v_auto_delta_request
                    data:
                      value: "{{ target | int }}"
            default:  # not auto mode: the request helper, the start-up layer writes register 2
              # A range-style call (target_temp_low/high without `temperature`, which a dashboard
              # card can send) must not write anything: `temperature` is then not a number and the
              # clamp above would turn it into the season minimum. Measured 2026-10-10: such a call
              # wrote 20 in heat and 10 in cool while the real request was 26.
              - if:
                  - condition: template
                    value_template: "{{ temperature is number }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.therma_v_water_target_request
                    data:
                      value: "{{ target }}"
        set_hvac_mode:
          - choose:
              - conditions:
                  - "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: switch.turn_off  # turn the unit off
                    target:
                      entity_id: switch.therma_v_heating_cooling_on_off
              - conditions:
                  - "{{ hvac_mode == 'cool' }}"
                sequence:
                  - action: switch.turn_on  # turn the unit on
                    target:
                      entity_id: switch.therma_v_heating_cooling_on_off
                  - action: modbus.write_register
                    data:
                      address: 0
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: 0
              - conditions:
                  - "{{ hvac_mode == 'heat' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.therma_v_heating_cooling_on_off
                  - action: modbus.write_register
                    data:
                      address: 0
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: 4
              - conditions:
                  - "{{ hvac_mode == 'auto' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.therma_v_heating_cooling_on_off
                  - action: modbus.write_register
                    data:
                      address: 0
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: 3
            default:
              - action: switch.turn_on
                target:
                  entity_id: switch.therma_v_heating_cooling_on_off

      - name: "Therma V DHW"
        unique_id: therma_v_dhw
        min_temperature: 40
        max_temperature: 70
        target_temperature_step: 1
        availability: >-
          {{ has_value('switch.therma_v_dhw_on_off')
             and has_value('sensor.therma_v_dhw_temperature')
             and has_value('sensor.therma_v_dhw_target_temperature') }}
        current_temperature: "{{ states('sensor.therma_v_dhw_temperature') }}"
        target_temperature: "{{ states('sensor.therma_v_dhw_target_temperature') }}"
        hvac_modes: "{{ ['off', 'auto'] }}"
        hvac_mode: "{{ 'off' if is_state('switch.therma_v_dhw_on_off', 'off') else 'auto' }}"
        set_temperature:
          - if:
              - condition: template
                value_template: "{{ temperature is number }}"
            then:
              - action: input_number.set_value
                target:
                  entity_id: input_number.therma_v_dhw_target_request
                data:
                  value: "{{ temperature | float(50) }}"
        set_hvac_mode:
          - choose:
              - conditions:
                  - "{{ hvac_mode == 'off' }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.therma_v_dhw_on_off
              - conditions:
                  - "{{ hvac_mode == 'auto' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: switch.therma_v_dhw_on_off
            default:
              - action: switch.turn_on
                target:
                  entity_id: switch.therma_v_dhw_on_off
