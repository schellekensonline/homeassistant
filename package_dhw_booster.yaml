template:
  # Real state of the Shelly Plug S1 that provides a parallel electrical switching path to the
  # single 1.5 kW DHW booster element. It can also be switched by hand; the heat pump's own relay
  # is an alternative path to the same heater.
  - binary_sensor:
      - name: "Therma V DHW booster 2 state (S1)"
        unique_id: therma_v_dhw_booster_2_state
        availability: "{{ has_value('switch.shelly_plug_s1') }}"
        state: "{{ is_state('switch.shelly_plug_s1', 'on') }}"

  # Switch for the automations to remember their requested state, separate from the relay.
  # Optimistic on purpose: the relay can also be switched by hand.
  - switch:
      - name: DHW Booster 2 Switch
        unique_id: dhw_booster_2_switch
        availability: "{{ has_value('switch.shelly_plug_s1') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.shelly_plug_s1
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.shelly_plug_s1


automation:
  # The two price automations own the booster only in Heuristic, mirroring the heat pump and
  # battery strategy selects. Manual leaves the relay alone; EMHASS will hand it to the HP
  # supervisor so a cheap-price rule cannot fight the plan. The heartbeat makes the Heuristic
  # state robust across a Home Assistant restart.
  #
  # Switch the DHW booster on while the buying price is negative.
  - id: dhw_e_price_negative_auto
    alias: "DHW e-price negative auto"
    description: "Turns the DHW booster on when the buying price is negative"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.electricity_buying_price
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: template
        value_template: "{{ has_value('switch.shelly_plug_s1') }}"
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "Heuristic"
      - condition: template
        value_template: >-
          {{ states('sensor.electricity_buying_price') | is_number
             and states('sensor.electricity_buying_price') | float(0) < 0.0 }}
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.dhw_booster_2_switch

  # Switch the DHW booster off in Heuristic when the buying price is zero or positive. If the
  # price is unknown, float(0) deliberately takes the safe off path.
  - id: dhw_e_price_positive_auto
    alias: "DHW e-price positive auto"
    description: "Turns the DHW booster off when the buying price is not negative"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id: sensor.electricity_buying_price
    conditions:
      - condition: template
        value_template: "{{ has_value('switch.shelly_plug_s1') }}"
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "Heuristic"
      - condition: template
        value_template: "{{ states('sensor.electricity_buying_price') | float(0) >= 0.0 }}"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.dhw_booster_2_switch
