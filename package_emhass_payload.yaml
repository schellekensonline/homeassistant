# EMHASS package: the shared optimisation body (split out of package_emhass.yaml on 2026-10-07).
# script.emhass_build_payload turns the live sensors, the prices and the heat topology into the
# JSON body for *both* optimisations, so the MPC (package_emhass_mpc.yaml) and the day-ahead
# (package_emhass_dayahead.yaml) always describe the same house;
# script.emhass_price_guard decides whether a run makes sense at all.
script:
  # Build the JSON body for the two EMHASS optimisations. One script for both, so the MPC (every
  # 15 minutes) and the day-ahead (once a day, when tomorrow's prices arrive) always describe the
  # same house: the same window from the current quarter hour, the same prices, the same night
  # reserve and the same heat topology. Until 2026-09-26 those thermal blocks lived only in the
  # MPC payload, so the day-ahead plan silently ignored the heat pump; until 2026-10-03 the
  # day-ahead sent only tomorrow's prices, which EMHASS mapped positionally from "now" and so
  # shifted by ~11 h.
  emhass_build_payload:
    alias: "EMHASS build optimisation payload"
    description: >-
      Returns { body: <json string> }. plan: 'mpc' and 'dayahead' both start at the current
      quarter hour; 'dayahead' only adds entity_save/publish_prefix so its plan lands on the
      sensor.dayahead_* entities. thermal: false drops the heat topology - the fallback both
      automations use when EMHASS rejects it.
    mode: parallel
    max: 4
    fields:
      plan:
        name: "Which plan"
        description: >-
          "'mpc' or 'dayahead' - both plan from the current quarter hour; 'dayahead' only adds
          entity_save/publish_prefix so its plan lands on the sensor.dayahead_* entities. EMHASS
          starts a day-ahead horizon at the run time, so it is a 24 h plan from ~13:00, not the
          calendar day tomorrow."
        default: "mpc"
        selector:
          select:
            options: ["mpc", "dayahead"]
      thermal:
        name: "Send the thermal batteries"
        description: "Off for the fallback run; the blocks are the usual reason EMHASS rejects a payload."
        default: true
        selector:
          boolean:
      preview_dhw:
        name: "Legacy DHW preview flag"
        description: >-
          Compatibility alias for preview_mode: dhw. Prefer preview_mode for new callers.
        default: false
        selector:
          boolean:
      preview_mode:
        name: "Preview one thermal flow"
        description: >-
          Activate exactly one thermal flow in a hypothetical dry-run, independent of the live
          strategy, season and supervisor gates. This only changes the generated payload; the
          caller must use the dry-run endpoint.
        default: "none"
        selector:
          select:
            options: ["none", "dhw", "heat", "cool"]
      dry_run:
        name: "Dry-run payload"
        description: >-
          Use the day-plan solver timeout without requesting saved or published entities. The
          caller must still use the dry-run endpoint.
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          # Both plans start at the current quarter hour. EMHASS's day-ahead horizon also starts
          # at run time and maps price lists positionally, so pass the available prices from now.
          # Round the prices and cap the horizon to the available quarters.
          #
          # The night reserve is the 22:00-07:00 house forecast times the margin plus a fixed
          # allowance. The house forecast excludes the heat pump. Until a complete night window
          # is available, use the flat night-share fallback; clamp the final SOC to 5-90%.
          #
          # Heat topology has three flows: HP -> DHW, HP -> shared house zone, and booster -> DHW.
          # The house zone switches direction from the heat-pump mode rather than keeping separate
          # heating and cooling stores. The two HP flows share one mutually exclusive actuator
          # group; the booster is independent. Disabled flows are parked without losses.
          #
          # A due disinfection forces the planned hold block to 60 C, while EMHASS may preheat
          # earlier. Readiness, not current relay state, keeps a flow enabled in the plan.
          # Convert the controller's heating curve to EMHASS's outdoor-temperature convention.
          # House thermal mass is explicit; losses combine envelope UA and ventilation.
          # The battery limits mirror the Sessy strategy helpers on every plan.
          # The MPC publish-data call needs the custom thermal IDs; the day-ahead publishes its
          # saved, prefixed entities and leaves them out.
          body: >-
            {% set day_ahead = plan | default('mpc', true) == 'dayahead' %}
            {% set send_thermal = thermal | default(true) | bool %}
            {% set preview_dhw = preview_dhw | default(false) | bool %}
            {% set dry_run = dry_run | default(false) | bool %}
            {% set requested_preview = preview_mode | default('none', true) %}
            {% set preview_mode = 'dhw' if preview_dhw
                 else (requested_preview if requested_preview in ['dhw', 'heat', 'cool'] else 'none') %}
            {% set previewing = preview_mode != 'none' %}
            {# Floor the run start so both plans use the same current-quarter price window. #}
            {% set minute = now().minute %}
            {% set quarter_start = now().replace(minute=(minute - (minute % 15)), second=0, microsecond=0).isoformat() %}
            {% set incl = state_attr('sensor.electricity_buying_price', 'prices') | selectattr('time', '>=', quarter_start) | map(attribute='price') | list %}
            {% set excl = state_attr('sensor.electricity_selling_price', 'prices') | selectattr('time', '>=', quarter_start) | map(attribute='price') | list %}
            {% set incl_rounded = incl | map('round', 4) | list %}
            {% set excl_rounded = excl | map('round', 4) | list %}
            {# Cap to the available price quarters; EMHASS rejects a horizon/length mismatch. #}
            {% set n = min(96, incl_rounded | length) %}
            {% set fc = state_attr('sensor.p_load_forecast', 'forecasts') or [] %}
            {% set acc = namespace(wh=0.0, n=0, started=False) %}
            {% for x in fc %}
              {% set hh = x.date[11:13] | int %}
              {% if hh >= 22 or hh < 7 %}
                {% set acc.started = True %}
                {% set acc.wh = acc.wh + (x.p_load_forecast | float(0)) * 0.25 %}
                {% set acc.n = acc.n + 1 %}
              {% elif acc.started %}
                {% break %}
              {% endif %}
            {% endfor %}
            {% set avg_wh = (states('input_number.night_energy_in_percent_of_daily_used_in_home') | float(25) / 100)
                            * (states('sensor.average_daily_energy_used_in_home') | float(0)) * 1000 %}
            {% set reserve_margin = states('input_number.emhass_reserve_margin') | float(1.15) %}
            {% set reserve_fixed_wh = states('input_number.emhass_reserve_fixed_wh') | float(2000) %}
            {# Fall back to flat night share without a full forecast; margin and fixed Wh cover heat-pump load. #}
            {% set reserve_wh = (acc.wh if acc.n >= 30 else avg_wh) * reserve_margin + reserve_fixed_wh %}
            {% set reserve_soc = min(max(reserve_wh / 15960, 0.05), 0.90) %}
            {% set ba = 'sensor.building_parameters' %}
            {% set room_now = states('sensor.therma_v_room_temperature') | float(20.5) %}
            {% set uval = state_attr(ba,'u_value') | float(0.55) %}
            {% set env = state_attr(ba,'envelope_area_m2') | float(380) %}
            {% set vent = state_attr(ba,'ventilation_rate') | float(0.5) %}
            {% set vol = state_attr(ba,'heated_volume_m3') | float(300) %}
            {% set warea = state_attr(ba,'window_area_m2') | float(32.7) %}
            {% set shgc = state_attr(ba,'shgc') | float(0.55) %}
            {% set igf = state_attr(ba,'internal_gains_factor') | float(0.6) %}
            {% set tau = state_attr(ba,'slab_inertia_time_constant_h') | float(2) %}
            {% set hp_nom = state_attr(ba,'heatpump_electric_max_w') | float(3000) %}
            {% set dhw_now = states('sensor.therma_v_dhw_temperature') | float(50) %}
            {% set dhw_target = state_attr('climate.therma_v_dhw','temperature')
                                | float(0) or states('sensor.therma_v_dhw_target_temperature') | float(50) %}
            {% set dhw_min = state_attr(ba,'dhw_min_temperature') | float(42) %}
            {% set dhw_max = state_attr(ba,'dhw_max_temperature') | float(68) %}
            {% set dhw_boost_max = min(dhw_max,
                                       states('input_number.therma_v_supervisor_booster_max_temperature') | float(dhw_max)) %}
            {% set disinfection_due = is_state('input_boolean.dhw_disinfection_due', 'on') %}
            {% set disinfection_start =
                 state_attr('input_datetime.dhw_next_disinfection', 'timestamp') %}
            {% set hold_minutes = states('input_number.dhw_disinfection_hold_minutes') | float(45) %}
            {% set hold_steps = max(2, (hold_minutes / 15) | round(0, 'ceil') | int) %}
            {% set pump_mode = states('climate.therma_v_heating_cooling') %}
            {# Auto remains unsupported by the supervisor until the delta path is implemented. #}
            {% set heat_season = pump_mode == 'heat' %}
            {% set cool_season = pump_mode == 'cool' %}
            {# Readiness, not relay state, keeps planned capacity available while control cycles. #}
            {% set hp_owned = is_state('input_select.therma_v_control_strategy', 'EMHASS') %}
            {% set master_on = is_state('switch.therma_v_heating_cooling_on_off', 'on') %}
            {% set heat_ready = is_state('input_boolean.therma_v_supervisor_space_heat_enabled', 'on') %}
            {% set cool_ready = is_state('input_boolean.therma_v_supervisor_cooling_enabled', 'on') %}
            {% set dhw_ready = is_state('input_boolean.therma_v_supervisor_dhw_enabled', 'on') %}
            {# Previews bypass ownership and supervisor gates so a parked flow can still be inspected. #}
            {% set hp_dhw = preview_mode == 'dhw' if previewing else (hp_owned and master_on and dhw_ready) %}
            {% set hp_heat = preview_mode == 'heat' if previewing
                 else (hp_owned and master_on and heat_ready and heat_season) %}
            {% set hp_cool = preview_mode == 'cool' if previewing
                 else (hp_owned and master_on and cool_ready and cool_season) %}
            {% set hp_space = hp_heat or hp_cool %}
            {% set sp_heat = states('input_number.room_setpoint_heating') | float(20) %}
            {% set sp_cool = states('input_number.room_setpoint_cooling') | float(24) %}
            {% set margin = state_attr(ba,'room_comfort_margin_c') | float(1) %}
            {% set comfort_penalty = states('input_number.emhass_thermal_comfort_penalty') | float(10) %}
            {% set heat_floor = min(sp_heat - margin, room_now) %}
            {% set heat_ceil = max(sp_heat + margin, room_now) %}
            {% set cool_floor = min(sp_cool - margin, room_now) %}
            {% set cool_ceil  = max(sp_cool + margin, room_now) %}
            {% set curve_slope = states('input_number.therma_v_heating_curve_slope') | float(0.444) %}
            {% set curve_actual_offset = states('input_number.therma_v_heating_curve_offset') | float(0) %}
            {# Convert controller curve to EMHASS's offset form and opposite slope sign. #}
            {% set curve_offset = sp_heat * (1 + curve_slope) + curve_actual_offset %}
            {% set curve_min_supply = states('input_number.therma_v_min_water_temperature_heat') | float(20) %}
            {% set curve_max_supply = states('input_number.therma_v_max_water_temperature_heat') | float(42) %}
            {% set house_mass = 18.0 %}
            {# Convert envelope plus ventilation loss to kW/K for the house model. #}
            {% set loss_coefficient = ((uval * env) + (vent * vol * 0.33)) / 1000 %}
            {# Apply the learned weekday/weekend draw profile on the absolute local clock. #}
            {% set weekday_draw = state_attr('sensor.emhass_dhw_draw_profile', 'weekday') | default([]) %}
            {% set weekend_draw = state_attr('sensor.emhass_dhw_draw_profile', 'weekend') | default([]) %}
            {% set draw_ready = is_state('sensor.emhass_dhw_draw_profile', 'ready')
                                and weekday_draw | length == 96 and weekend_draw | length == 96 %}
            {% set draw_values = namespace(list=[]) %}
            {% if hp_dhw and draw_ready %}
              {% for i in range(n) %}
                {% set point = now() + timedelta(minutes=15 * i) %}
                {% set profile = weekend_draw if point.weekday() >= 5 else weekday_draw %}
                {% set slot = point.hour * 4 + (point.minute // 15) %}
                {% set draw_values.list = draw_values.list + [profile[slot] | float(0)] %}
              {% endfor %}
            {% else %}
              {% set draw_values.list = [0.0] * n %}
            {% endif %}
            {% set dhw_draw = draw_values.list %}
            {% set quarter_start_ts = as_timestamp(quarter_start) %}
            {% set mins = namespace(list=[]) %}
            {% set maxes = namespace(list=[]) %}
            {% set booster_costs = namespace(list=[]) %}
            {% for i in range(n) %}
              {% set step_ts = quarter_start_ts + i * 900 %}
              {# DHW planner owns the start time; force 60 C only across its hold steps. #}
              {% set in_disinfection_hold =
                   hp_dhw and disinfection_due and disinfection_start is not none
                   and step_ts >= disinfection_start
                   and step_ts < disinfection_start + hold_steps * 900 %}
              {% set mins.list = mins.list
                   + ([60.0] if in_disinfection_hold else [dhw_min if hp_dhw else dhw_now]) %}
              {# The booster only gets a normal tariff for negative prices or the hygiene hold. #}
              {% set booster_allowed = hp_dhw and (in_disinfection_hold or incl_rounded[i] < 0) %}
              {% set maxes.list = maxes.list
                   + ([dhw_boost_max if booster_allowed else 53.0] if hp_dhw else [dhw_now]) %}
              {% set booster_costs.list = booster_costs.list
                   + [incl_rounded[i] if booster_allowed else incl_rounded[i] + 10.0] %}
            {% endfor %}
            {% set dhw_minima = mins.list %}
            {% set dhw_maxima = maxes.list %}
            {% set heat_minima = ([heat_floor] if hp_heat else [room_now]) %}
            {% set heat_maxima = ([heat_ceil] * n) if hp_heat else ([room_now] * n) %}
            {% set cool_minima = ([cool_floor] * n) if hp_cool else ([room_now] * n) %}
            {% set cool_maxima = ([cool_ceil] * n) if hp_cool else ([room_now] * n) %}
            {# One physical room/slab state; only the active direction is imposed on this run. #}
            {% set space_minima = cool_minima if hp_cool else heat_minima %}
            {% set space_maxima = cool_maxima if hp_cool else heat_maxima %}
            {% set space_target = sp_cool if hp_cool else (sp_heat if hp_heat else room_now) %}
            {% set space_overshoot = cool_floor if hp_cool else heat_ceil %}

            {
              "load_cost_forecast": {{ incl_rounded | to_json }},
              "prod_price_forecast": {{ excl_rounded | to_json }},
              "prediction_horizon": {{ n }},
              {% if day_ahead or dry_run %}"lp_solver_timeout": 120,{% endif %}
              {# Match actuator limits so EMHASS cannot plan power the Sessy will clip. #}
              "battery_charge_power_max": {{ states('input_number.sessy_api_strategy_max_charge_power') | int(6000) }},
              "battery_discharge_power_max": {{ states('input_number.sessy_api_strategy_max_discharge_power') | int(3000) }},
              "soc_init": {{ (states('sensor.sessy_battery_state_of_charge') | float(60) / 100) | round(3) }},
              "soc_final": {{ reserve_soc | round(3) }}{% if not day_ahead and send_thermal %},
              {# Only the MPC publish path needs these explicit thermal sensor IDs. #}
              "custom_predicted_temperature_id": [
                {"entity_id": "sensor.temp_predicted0"},
                {"entity_id": "sensor.temp_predicted1"},
                {"entity_id": "sensor.temp_predicted2"}
              ],
              "custom_heating_demand_id": [
                {"entity_id": "sensor.heating_demand0"},
                {"entity_id": "sensor.heating_demand1"},
                {"entity_id": "sensor.heating_demand2"}
              ],
              "custom_deferrable_forecast_id": [
                {"entity_id": "sensor.p_deferrable0"},
                {"entity_id": "sensor.p_deferrable1"},
                {"entity_id": "sensor.p_deferrable2"}
              ]{% endif %}{% if day_ahead and not dry_run %},
              {# Save and publish day-ahead entities under a separate namespace from the MPC. #}
              "entity_save": true,
              "publish_prefix": "dayahead_"{% endif %}{% if send_thermal %},
              {# Three loads map sequentially to p_deferrable0 (DHW), p_deferrable1 (space) and
                 p_deferrable2 (booster); p_deferrable3 is retired. The HP flows share one
                 compressor. #}
              "heat_topology": {
                "sources": [
                  {"id": "hp_dhw", "type": "heatpump",
                   "nominal_power": {{ hp_nom }}, "min_power": 3100,
                   "treat_as_semi_cont": false,
                   "supply_temperature": {{ min(dhw_target, 53) }},
                   "carnot_efficiency": {{ state_attr(ba,'dhw_carnot_efficiency') | float(0.26) }},
                   "max_supply_temperature": 55, "max_thermal_power": 9000},
                  {"id": "hp_space", "type": "heatpump",
                   "nominal_power": {{ hp_nom }}, "min_power": 550,
                   "treat_as_semi_cont": false,
                   {% if hp_cool %}
                   "supply_temperature": {{ state_attr(ba,'cooling_supply_temperature') | float(16) }},
                   {% else %}
                   "heating_curve": {"slope": {{ curve_slope }}, "offset": {{ curve_offset }},
                                     "min_supply": {{ curve_min_supply }},
                                     "max_supply": {{ curve_max_supply }}},
                   {% endif %}
                   {% if hp_cool %}
                   "carnot_efficiency": {{ state_attr(ba,'carnot_efficiency_cooling') | float(0.45) }},
                   {% else %}
                   "carnot_efficiency": {{ state_attr(ba,'carnot_efficiency_heating') | float(0.26) }},
                   {% endif %}
                   "max_thermal_power": 9000},
                  {"id": "booster", "type": "electric", "efficiency": 1.0,
                   "nominal_power": 1500, "treat_as_semi_cont": true,
                   "cost_track": "booster_gate"}
                ],
                "storage": [
                  {"id": "dhw",
                   "volume": {{ state_attr(ba,'dhw_volume_m3') | float(0.3) }},
                   "density": 997, "heat_capacity": 4.184,
                   "thermal_loss": {{ state_attr(ba,'dhw_thermal_loss_kw') | float(0.10) if hp_dhw else 0.0 }},
                   "start_temperature": {{ dhw_now }},
                   "min_temperature": {{ dhw_minima | to_json }},
                   "max_temperature": {{ dhw_maxima | to_json }}},
                  {"id": "house", "thermal_mass": {{ house_mass }},
                   "loss_coefficient": {{ loss_coefficient if hp_space else 0.0 }},
                   "thermal_inertia": {{ tau if hp_space else 0.0 }},
                   "start_temperature": {{ room_now }},
                   "desired_temperature": {{ space_target }},
                   "overshoot_temperature": {{ space_overshoot }},
                   "penalty_factor": {{ comfort_penalty }},
                   "min_temperature": {{ space_minima | to_json }},
                   "max_temperature": {{ space_maxima | to_json }},
                   "window_area": {{ warea if hp_space else 0 }}, "shgc": {{ shgc }},
                   "comfort_sense": "{{ 'cool' if hp_cool else 'heat' }}"}
                ],
                "consumers": [
                  {"id": "dhw_draw", "type": "profile", "target": "dhw",
                   "profile": {{ dhw_draw | to_json }}}
                ],
                "cost_tracks": {
                  "booster_gate": {{ booster_costs.list | to_json }}
                },
                "flows": [
                  {"from": "hp_dhw", "to": "dhw"},
                  {"from": "hp_space", "to": "house"},
                  {"from": "booster", "to": "dhw"}
                ],
                "actuator_groups": [
                  {"flows": [["hp_dhw", "dhw"], ["hp_space", "house"]],
                   "mutual_exclusion": true, "max_combined_power": {{ hp_nom }}}
                ]
              }{% endif %}
            }
      # A script response has to be a dictionary; the caller reads .body from it.
      - variables:
          built:
            # Home Assistant's native template rendering hands this over as a real dict, not as
            # the JSON text that was written above. That is fine - the rest_command turns it back
            # into JSON before it goes on the wire - but it is why the payload templates in the
            # rest_commands (package_emhass_mpc.yaml / package_emhass_dayahead.yaml) test for a
            # string.
            body: "{{ body }}"
      - stop: "payload built"
        response_variable: built

  # Price-data guard, shared by the MPC and the day-ahead automation. Returns 'run' or 'skip'
  # so the caller can decide whether the optimisation makes sense; the caller keeps the
  # optimisation itself.
  emhass_price_guard:
    alias: "EMHASS price guard"
    description: >-
      Logs an error when there is no price data at all and a warning when the horizon is
      short. Returns 'skip' when the caller should not run EMHASS, otherwise 'run'.
    fields:
      label:
        name: "Label in the log line"
        description: "What is being guarded, e.g. MPC or Day-ahead."
        default: "EMHASS"
        selector:
          text:
      warn_below:
        name: "Warn below (quarters)"
        description: "Log a warning when fewer than this many quarters are known (see require_tomorrow)."
        default: 24
        selector:
          number:
            min: 0
            max: 192
      require_tomorrow:
        name: "Look at tomorrow instead of the horizon"
        description: "Measure tomorrow's quarters instead of the quarters from now; for the day-ahead run."
        default: false
        selector:
          boolean:
    sequence:
      - variables:
          require: "{{ require_tomorrow | default(false, true) | bool(false) }}"
      # The MPC needs the quarters from now on, the day-ahead needs the quarters of tomorrow.
      - variables:
          known: >-
            {% if require %}
              {{ state_attr('sensor.emhass_price_horizon', 'quarters_tomorrow') | int(0) }}
            {% else %}
              {{ states('sensor.emhass_price_horizon') | int(0) }}
            {% endif %}
          unit: "{{ 'quarters of tomorrow' if require else 'quarters' }}"
      # A field default is not always filled in by Home Assistant, so fall back here too.
      - variables:
          warn_at: "{{ warn_below | default(24, true) | int(0) }}"
      # No data at all: the restart case, right before the price sensor has fetched its first
      # day. A run with an empty price list is rejected by EMHASS (and falls back to the
      # missing csv), so not calling it is the honest answer.
      - if:
          - condition: template
            value_template: "{{ known < 1 }}"
        then:
          - action: system_log.write
            data:
              message: >-
                EMHASS: {{ label }} run skipped, no price data for it ({{ known }} {{ unit }},
                sensor.emhass_price_horizon is {{ states('sensor.emhass_price_horizon') }}).
                The published sensors keep their previous values.
              level: error
              logger: emhass.prices
        else:
          # Warn when the horizon gets so short that tomorrow's prices are missing. Normal is
          # ~44 quarters or more, so a warning means the Nord Pool data is incomplete.
          - if:
              - condition: template
                value_template: "{{ known < warn_at }}"
            then:
              - action: system_log.write
                data:
                  message: >-
                    EMHASS: {{ label }} price data is short, only {{ known }} {{ unit }}
                    (last price {{ state_attr('sensor.emhass_price_horizon', 'last_price_time') }},
                    tomorrow's prices {{ 'are in' if state_attr('sensor.emhass_price_horizon', 'covers_tomorrow') else 'are NOT in' }}).
                  level: warning
                  logger: emhass.prices
      # The response has to be a dictionary; the caller reads .decision from it.
      - variables:
          guard_response:
            decision: "{{ 'skip' if known < 1 else 'run' }}"
      - stop: ""
        response_variable: guard_response
