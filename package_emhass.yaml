  - id: emhass_execute_mpc_optimization_auto
    alias: "EMHASS execute MPC optimization auto"
    description: "Triggert EMHASS elke 15 minuten voor realtime bijsturing en haalt de planning op."
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
    condition: []
    action:
      - action: rest_command.emhass_naive_mpc_optim
        data: {}
      - delay:
          seconds: 5
      - action: rest_command.emhass_publish
        data: {}
  
  - id: emhass_execute_day_ahead_optimization_auto    
    alias: "EMHASS execute Day-Ahead optimization auto"
    description: "Berekent een keer per dag de grote planning voor de komende 24 uur op basis van de nieuwe marktprijzen."
    mode: single
    trigger:
      # Trigger 1: De prijzen voor morgen komen live binnen
      - platform: state
        entity_id: binary_sensor.uilities_nord_pool_nl_tomorrow_price_available
        to: "on"
        id: "prijzen_binnen"
      # Trigger 2: Failsafe (mocht de sensor door een storing overdag niet hebben gewerkt)
      - platform: time
        at: "00:10:00"
        id: "failsafe"
    condition:
      # Zorg dat de automatisering maximaal één keer per kalenderdag succesvol kan draaien
      - condition: template
        value_template: "{{ this.attributes.last_triggered is none or this.attributes.last_triggered.date() != now().date() }}"
    action:
      - action: rest_command.emhass_dayahead_optim
        data: {}
      - delay:
          seconds: 15
      - action: rest_command.emhass_publish
        data: {}

