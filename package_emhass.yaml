# Home Assistant package for EMHASS (energy optimisation in a separate container).
# Core/shared part: the template sensors EMHASS reads and publishes into, the helpers both plans
# use, the EMHASS-online sensor and the REST plumbing (publish, get-config, set-config). The
# workflows live beside it: package_emhass_payload.yaml (the shared request body),
# package_emhass_mpc.yaml (the quarter-hour plan), package_emhass_dayahead.yaml (the day plan)
# and package_emhass_ml.yaml (the load-model training). Split along those seams on 2026-10-07;
# see agent-files/notes_dockers_hass_emhass.md.

template:
  - sensor:
      # House consumption MINUS the steerable loads: this is the signal EMHASS expects
      # as its load input, so the heat pump is excluded here and modelled separately.
      - name: "EMHASS House Power No Def Loads"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set tot_p1  = states('sensor.p1_meter_3c39e72e6af0_active_power') | float("unknown") %}
          {% set tot_pv  = states('sensor.goodwe_total_pv_input_power') | float("unknown") %}
          {% set tot_bat = states('sensor.sessy_grid_total_power') | float("unknown") %}
          {% set tot_hp  = states('sensor.therma_v_electric_power') | float("unknown") %}
          {{ tot_p1|is_number and tot_pv|is_number and tot_bat|is_number and tot_hp|is_number }}
        state: >-
          {# All terms use "positive = delivering" so they add up to the house consumption #}
          {% set tot_p1   = states('sensor.p1_meter_3c39e72e6af0_active_power') | float(0) %}  {# positive = import from grid #}
          {% set tot_pv   = states('sensor.goodwe_total_pv_input_power') | float(0) %}         {# positive = PV production #}
          {% set tot_bat  = states('sensor.sessy_grid_total_power') | float(0) %}              {# positive = battery discharge #}
          {% set tot_hp   = states('sensor.therma_v_electric_power') | float(0) %}             {# positive = heatpump consumption #}

          {# P1 transients can briefly make the balance negative. #}
          {{ max(tot_p1 + tot_pv + tot_bat - tot_hp, 0) | round(2) }}

      # The day plan's value for the *current* quarter, so it can go on a history graph next to
      # the quarter-hour plan. The day-ahead mirror itself only changes when a new plan is
      # published, so its state would be a flat line all day; this one walks the horizon that
      # rides in its `battery_scheduled_power` attribute (2026-10-04).
      - name: "EMHASS day plan battery power now"
        unique_id: emhass_dayahead_p_batt_now
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # No plan in the attribute (restart, or the mirror not published yet) -> unknown, so the
        # history graph shows a gap instead of a fake 0 W.
        availability: >-
          {{ (state_attr('sensor.dayahead_p_batt_forecast','battery_scheduled_power') or [])
             | count > 0 }}
        state: >-
          {% set plan = state_attr('sensor.dayahead_p_batt_forecast','battery_scheduled_power') or [] %}
          {% set ns = namespace(value=none) %}
          {% for entry in plan %}
            {% if as_timestamp(entry.date) <= as_timestamp(now()) %}
              {% set ns.value = entry.dayahead_p_batt_forecast | float(0) %}
            {% endif %}
          {% endfor %}
          {{ ns.value if ns.value is not none else (plan[0].dayahead_p_batt_forecast | float(0) if plan else 0) }}

      # Planned electric power of the DHW/heating equipment: the sum of the three active topology
      # flows (0 = HP DHW, 1 = HP space heating or cooling, 2 = electric DHW booster). This is the
      # plan's *wish*, not a measurement. The full horizon rides in each p_deferrableN sensor's
      # `deferrables_schedule` attribute. EMHASS publishes topology flows sequentially; index 3 is
      # retired after the shift from four flows to three.
      # Zero while input_select.therma_v_control_strategy is Manual or Heuristic: then the payload
      # parks all three blocks (see emhass_build_payload), so the plan carries no heat pump at all.
      - name: "EMHASS HP plan power"
        unique_id: emhass_hp_plan_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {{ states('sensor.p_deferrable0') | is_number
             and states('sensor.p_deferrable1') | is_number
             and states('sensor.p_deferrable2') | is_number }}
        state: >-
          {{ (states('sensor.p_deferrable0') | float(0)
              + states('sensor.p_deferrable1') | float(0)
              + states('sensor.p_deferrable2') | float(0)) | round(0) }}
        attributes:
          dhw_power: "{{ states('sensor.p_deferrable0') | float(0) | round(0) }}"
          space_power: "{{ states('sensor.p_deferrable1') | float(0) | round(0) }}"
          space_mode: "{{ states('climate.therma_v_heating_cooling') }}"
          dhw_booster_power: "{{ states('sensor.p_deferrable2') | float(0) | round(0) }}"

      # Map the existing sensors onto the entity ids used in the EMHASS config.
      - name: "EMHASS PV Power"
        unit_of_measurement: "W"
        device_class: power
        state: "{{ states('sensor.goodwe_total_pv_input_power') | float(0) }}"

      - name: "EMHASS Battery Power"
        unit_of_measurement: "W"
        device_class: power
        state: "{{ states('sensor.sessy_grid_total_power') | float(0) }}"

      - name: "EMHASS Battery SoC"
        unit_of_measurement: "%"
        device_class: battery
        state: "{{ states('sensor.sessy_battery_state_of_charge') | int(0) }}"

      # Optional: PV forecast from Forecast.Solar, used instead of EMHASS's own pvlib model.
      - name: "EMHASS PV Forecast"
        unit_of_measurement: "W"
        device_class: power
        state: >-
          {% set tot_east_w = states('sensor.power_production_now_east') | float(0) %}
          {% set tot_west_w = states('sensor.power_production_now_west') | float(0) %}
          {% set tot_pv = tot_east_w + tot_west_w %}
          {# Cap at the GoodWe's output limit: the two arrays can forecast above what it delivers #}
          {% if tot_pv > 8800 %}
            8800
          {% else %}
            {{ tot_pv | round(0) }}
          {% endif %}

      # How much price data the MPC has to plan with: the number of quarter hours from the
      # current quarter until the last known price. The price list holds whole days (96
      # quarters each), so this is ~96 in the morning (only today is published) and 97-192
      # once Nord Pool has published tomorrow around 13:00. Below 24 quarters (6 hours)
      # something is wrong: tomorrow's prices are missing and the horizon keeps shrinking
      # towards midnight. The MPC automation warns on that and skips when there is nothing.
      - name: "EMHASS price horizon"
        unique_id: emhass_price_horizon
        unit_of_measurement: "quarters"
        state: >
          {% set prices = state_attr('sensor.electricity_buying_price', 'prices') | default([], true) %}
          {% set quarter = now().replace(minute=now().minute - (now().minute % 15), second=0, microsecond=0) %}
          {{ prices | selectattr('time', '>=', quarter.isoformat()) | list | length }}
        attributes:
          last_price_time: >
            {% set prices = state_attr('sensor.electricity_buying_price', 'prices') | default([], true) %}
            {{ prices[-1]['time'] if prices else none }}
          covers_tomorrow: >
            {% set prices = state_attr('sensor.electricity_buying_price', 'prices') | default([], true) %}
            {{ ((prices[-1]['time'] | as_datetime | as_local).date() > now().date()) if prices else false }}
          quarters_tomorrow: >
            {% set prices = state_attr('sensor.electricity_buying_price', 'prices') | default([], true) %}
            {{ prices | selectattr('time', '>=', (now().date() + timedelta(days=1)).isoformat()) | list | length }}

      # The building and thermal-battery parameters live in secrets.yaml (gitignored). They are
      # exposed here as attributes because a `!secret` tag cannot be embedded inside the rest
      # command payload: that payload is a Jinja template string, and tags only work on YAML
      # nodes. script.emhass_build_payload builds EMHASS's runtime `heat_topology` from these
      # attributes, for both the MPC and the day-ahead run.
      - name: "Building parameters"
        unique_id: building_parameters
        state: "ok"
        attributes:
          u_value: !secret building_u_value
          envelope_area_m2: !secret building_envelope_area_m2
          ventilation_rate: !secret building_ventilation_rate
          heated_volume_m3: !secret building_heated_volume_m3
          window_area_m2: !secret building_window_area_total_m2
          shgc: !secret building_glazing_shgc
          internal_gains_factor: !secret building_internal_gains_factor
          slab_volume_m3: !secret building_slab_volume_m3
          slab_inertia_time_constant_h: !secret building_slab_inertia_time_constant_h
          heatpump_electric_max_w: !secret building_heatpump_electric_max_w
          heating_supply_temperature: !secret building_supply_temperature_heating
          heating_target_temperature: !secret building_heating_target_temperature
          carnot_efficiency_heating: !secret building_carnot_efficiency_heating
          carnot_efficiency_cooling: !secret building_carnot_efficiency_cooling
          slab_heating_min_temperature: !secret building_slab_heating_min_temperature
          slab_heating_max_temperature: !secret building_slab_heating_max_temperature
          heating_curve_slope: !secret building_heating_curve_slope
          heating_curve_offset: !secret building_heating_curve_offset
          heating_curve_min_supply: !secret building_heating_curve_min_supply
          heating_curve_max_supply: !secret building_heating_curve_max_supply
          floor_return_drop_c: !secret building_floor_return_drop_c
          floor_min_temperature: !secret building_floor_min_temperature
          floor_max_temperature: !secret building_floor_max_temperature
          floor_curve_min_supply: !secret building_floor_curve_min_supply
          floor_curve_max_supply: !secret building_floor_curve_max_supply
          cooling_supply_temperature: !secret building_supply_temperature_cooling
          cooling_target_temperature: !secret building_cooling_target_temperature
          room_comfort_margin_c: !secret building_room_comfort_margin_c
          slab_cooling_min_temperature: !secret building_slab_cooling_min_temperature
          slab_cooling_max_temperature: !secret building_slab_cooling_max_temperature
          dhw_volume_m3: !secret building_dhw_volume_m3
          dhw_thermal_loss_kw: !secret building_dhw_thermal_loss_kw
          dhw_carnot_efficiency: !secret building_dhw_carnot_efficiency
          dhw_min_temperature: !secret building_dhw_min_temperature
          dhw_max_temperature: !secret building_dhw_max_temperature

  # Quarter-hour view of the three load schedules. Re-evaluating at every minute keeps the tile
  # aligned with the wall clock even when the summed power stays 0 W across consecutive plans.
  - trigger:
      - trigger: time_pattern
        minutes: "/1"
        seconds: 1
      - trigger: state
        entity_id:
          - sensor.p_deferrable0
          - sensor.p_deferrable1
          - sensor.p_deferrable2
      - trigger: homeassistant
        event: start
    sensor:
      - name: "EMHASS HP plan power now"
        unique_id: emhass_hp_plan_power_now
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                         second=0, microsecond=0) %}
          {% set found = namespace(value=false) %}
          {% for entity_id in ['sensor.p_deferrable0',
                               'sensor.p_deferrable1',
                               'sensor.p_deferrable2'] %}
            {% for entry in state_attr(entity_id, 'deferrables_schedule') or [] %}
              {% if entry.date is defined and as_datetime(entry.date) == quarter %}
                {% set found.value = true %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ found.value }}
        state: >-
          {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                         second=0, microsecond=0) %}
          {% set acc = namespace(found=false, dhw=0.0, space=0.0, booster=0.0) %}
          {% for item in [
               ('sensor.p_deferrable0', 'p_deferrable0', 'dhw'),
               ('sensor.p_deferrable1', 'p_deferrable1', 'space'),
               ('sensor.p_deferrable2', 'p_deferrable2', 'booster')] %}
            {% set schedule = state_attr(item[0], 'deferrables_schedule') or [] %}
            {% for entry in schedule %}
              {% if entry.date is defined and as_datetime(entry.date) == quarter %}
                {% set acc.found = true %}
                {% set value = entry[item[1]] | float(0) %}
                {% if item[2] == 'dhw' %}
                  {% set acc.dhw = acc.dhw + value %}
                {% elif item[2] == 'space' %}
                  {% set acc.space = acc.space + value %}
                {% else %}
                  {% set acc.booster = acc.booster + value %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ (acc.dhw + acc.space + acc.booster) | round(0) if acc.found else 'unknown' }}
        attributes:
          quarter: >-
            {{ now().replace(minute=(now().minute // 15) * 15,
                             second=0, microsecond=0).isoformat() }}
          schedule_found: >-
            {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                           second=0, microsecond=0) %}
            {% set found = namespace(value=false) %}
            {% for entity_id in ['sensor.p_deferrable0',
                                 'sensor.p_deferrable1',
                                 'sensor.p_deferrable2'] %}
              {% for entry in state_attr(entity_id, 'deferrables_schedule') or [] %}
                {% if entry.date is defined and as_datetime(entry.date) == quarter %}
                  {% set found.value = true %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ found.value }}
          dhw_power: >-
            {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                           second=0, microsecond=0) %}
            {% set values = (state_attr('sensor.p_deferrable0', 'deferrables_schedule') or [])
                            | selectattr('date', 'defined')
                            | selectattr('date', 'eq', quarter.isoformat()) | list %}
            {{ values[0].p_deferrable0 | float(0) | round(0) if values else 0 }}
          space_power: >-
            {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                           second=0, microsecond=0) %}
            {% set values = (state_attr('sensor.p_deferrable1', 'deferrables_schedule') or [])
                            | selectattr('date', 'defined')
                            | selectattr('date', 'eq', quarter.isoformat()) | list %}
            {{ values[0].p_deferrable1 | float(0) | round(0) if values else 0 }}
          booster_power: >-
            {% set quarter = now().replace(minute=(now().minute // 15) * 15,
                                           second=0, microsecond=0) %}
            {% set values = (state_attr('sensor.p_deferrable2', 'deferrables_schedule') or [])
                            | selectattr('date', 'defined')
                            | selectattr('date', 'eq', quarter.isoformat()) | list %}
            {{ values[0].p_deferrable2 | float(0) | round(0) if values else 0 }}

input_number:
  # Room temperature setpoints for the thermal house model. These are the comfort values the
  # model steers to; they are not the heat pump's water temperature (that is the actuator, and
  # it lives on climate.therma_v_heating_cooling). The payload clamps the target into the
  # model's band, so a value outside the band cannot make the optimisation infeasible.
  room_setpoint_heating:
    name: "Room setpoint heating"
    icon: mdi:home-thermometer
    min: 15
    max: 24
    step: 0.5
    initial: 20
    mode: box
    unit_of_measurement: "C"

  room_setpoint_cooling:
    name: "Room setpoint cooling"
    icon: mdi:snowflake-thermometer
    min: 20
    max: 30
    step: 0.5
    initial: 24
    mode: box
    unit_of_measurement: "C"

  # EMHASS soft-comfort weight for the heating/cooling room zones. A desired temperature alone is
  # not enough: the topology also needs an overshoot threshold before it prices comfort deviations
  # and suppresses the source beyond that threshold.
  emhass_thermal_comfort_penalty:
    name: "EMHASS thermal comfort penalty"
    icon: mdi:thermometer-alert
    min: 0
    max: 10
    step: 0.01
    initial: 0.05
    mode: box

  # Planner-only minimum space-heating/cooling run. This is deliberately separate from the
  # physical supervisor latch: the planner keeps its full minimum on the first attempt, while an
  # infeasible solve may reduce this value one quarter at a time without rewriting elapsed state.
  emhass_space_minimum_on_minutes:
    name: "EMHASS space minimum on-time"
    icon: mdi:timer-lock-outline
    min: 0
    max: 240
    step: 15
    initial: 60
    mode: box
    unit_of_measurement: "min"

  # Planner-only minimum DHW run. Keep this separate from the physical supervisor latch so a
  # forced planner run cannot exceed the tank ceiling.
  emhass_dhw_minimum_on_minutes:
    name: "EMHASS DHW minimum on-time"
    icon: mdi:water-boiler
    min: 0
    max: 120
    step: 15
    initial: 15
    mode: box
    unit_of_measurement: "min"

  # Integrating controller knob (2026-09-20): the offset of the heating curve is trimmed so
  # the room lands on input_number.room_setpoint_heating. This helper carries the correction; the
  # control loop that updates it from the room error still has to be built (nothing writes it yet).
  # Range +-10 K around building_heating_curve_offset.
  heating_curve_offset_correction:
    name: "Heating curve offset correction"
    icon: mdi:chart-bell-curve-cumulative
    min: -10
    max: 10
    step: 0.5
    initial: 0
    mode: box
    unit_of_measurement: "K"

input_datetime:
  # Date the day plan was last built, set by the scheduled 23:50 run (not by a restart rebuild).
  # The evening retries use it to stop after one run a day, and the 23:55 check reads it to see
  # whether the coming day has a plan at all.
  emhass_dayahead_plan_date:
    name: "EMHASS day plan built on"
    icon: mdi:calendar-check
    has_date: true
    has_time: false
    # Never planned: any real date is "older than yesterday", so a restart rebuilds at once.
    initial: "1970-01-01"

binary_sensor:
  # EMHASS runs as a separate container. This sensor lets an automation wait until
  # EMHASS actually answers, which matters after the whole stack is restarted.
  - platform: rest
    name: "EMHASS online"
    unique_id: emhass_online
    resource: "http://localhost:5000/healthz"
    value_template: "{{ value_json.status == 'ok' }}"
    scan_interval: 60
    # A solve blocks EMHASS's single web worker for several seconds. Ten seconds produced false
    # offline transitions during normal MPC runs; 30 covers the observed 7-10 s solve window.
    timeout: 30

rest_command:
  # Publish the latest optimisation results to Home Assistant sensors.
  emhass_publish:
    url: "http://localhost:5000/action/publish-data"
    method: POST
    content_type: "application/json"
    # The MPC publishes the live result onto the shared sensors. The day-ahead automation passes
    # `publish_prefix: "dayahead_"`, which makes EMHASS post the entity files that run saved
    # instead (data/entities/sensor.dayahead_*.json), so the two plans stop sharing entity ids.
    # Empty prefix = the old behaviour, so the MPC callers can keep sending `data: {}`.
    #
    # 2026-10-16: the marker blocks below are what make EMHASS publish the *thermal* sensors.
    # `publish-data` (command_line._publish_thermal_loads) only publishes
    # `sensor.temp_predicted{k}` and `sensor.heating_demand{k}` for the loads whose
    # `def_load_config` entry carries a `thermal_config` / `thermal_battery` /
    # `thermal_source` key, and this call sends no def_load_config of its own - which is why
    # the MPC published no temperatures up to now (the day-ahead did, from its saved
    # entities). Only the key is read, the values may be empty; one marker per load index
    # (0 HP DHW, 1 HP shared house zone, 2 electric DHW booster) so the series line up with the
    # three-flow topology: index 0 = DHW, 1 = shared house zone and 2 = booster.
    payload: >-
      {{ {"publish_prefix": publish_prefix | default(""),
          "def_load_config": [{"thermal_battery": {}}, {"thermal_battery": {}},
                              {"thermal_battery": {}}]} | to_json }}

  # Read and write EMHASS's own config from Home Assistant (2026-09-26). EMHASS's REST API is
  # bound to the host loopback, so the agent cannot reach it directly any more - HA can, and with
  # `return_response` these two act as the proxy for `GET /get-config` and `POST /set-config`.
  # Mind the rule in the notes: get the config, change it, post the *whole* JSON back, because
  # EMHASS loads params.pkl and not config.json.
  emhass_get_config:
    url: "http://localhost:5000/get-config"
    method: GET
    timeout: 60
    content_type: "application/json"
  emhass_set_config:
    url: "http://localhost:5000/set-config"
    method: POST
    timeout: 60
    content_type: "application/json"
    payload: "{{ config_json }}"

automation:
  # One-shot ownership handover shared by the heat pump and Sessy. The ESS mode is reset because
  # EMHASS assumes nominal heat-pump power; the HP is excluded from ZoM because its actual and
  # planned power are already represented by EMHASS.
  - id: therma_v_ess_normal_on_emhass_handover
    alias: "EMHASS handover: ESS normal and heat pump excluded from ZoM"
    description: "Initializes ESS and ZoM ownership when EMHASS takes control"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: input_select.therma_v_control_strategy
        to: "EMHASS"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_select.therma_v_control_strategy
        state: "EMHASS"
      # Do not keep rewriting either helper after the one-shot handover has completed.
      - condition: or
        conditions:
          - condition: template
            value_template: >-
              {% set options = state_attr('input_select.therma_v_ess_select', 'options')
                               | default([], true) %}
              {{ options | length > 2
                 and states('input_select.therma_v_ess_select') != options[2] }}
          - condition: state
            entity_id: input_boolean.sessy_zom_exclude_heat_pump
            state: "off"
    actions:
      - if:
          - condition: template
            value_template: >-
              {% set options = state_attr('input_select.therma_v_ess_select', 'options')
                               | default([], true) %}
              {{ options | length > 2
                 and states('input_select.therma_v_ess_select') != options[2] }}
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.therma_v_ess_select
            data:
              option: '{{ state_attr("input_select.therma_v_ess_select", "options")[2] }}'
      - if:
          - condition: state
            entity_id: input_boolean.sessy_zom_exclude_heat_pump
            state: "off"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.sessy_zom_exclude_heat_pump
