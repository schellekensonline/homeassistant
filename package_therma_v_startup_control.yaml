# Therma V start-up control: the pump's water-setpoint layer. Design 2026-10-10 as
# package_therma_v_control.yaml; renamed 2026-10-11, when the weather curve and the room control
# moved to package_therma_v_temperature_control.yaml. The split is clean now: that package decides
# *what* the setpoint should be, this one is the actuator side and owns Modbus registers 2 and 4.
#
# Why: the pump starts at maximum compressor power for a fixed ~15 minutes. If the controlled
# water temperature reaches setpoint + hysteresis inside that window, the pump does not modulate
# back and switches off. This layer writes a moving water setpoint that keeps the water inside the
# hysteresis band, so the start survives; the demand also stays close to the water, which keeps
# the pump's internal control out of overdrive (a soft start). The same clamp holds the pump on
# whenever it runs, not only during the first minutes, and the auto branch applies the same bracket
# to the delta on register 4.
#
# Where it sits: the climate template no longer writes Modbus register 2 itself. Its
# `set_temperature` stores the request in `input_number.therma_v_water_target_request`, and the
# writer automation here is the only writer of register 2. Auto mode (register 4, the delta on the
# pump's own heating curve) works the same way: the template records the request in
# `input_number.therma_v_auto_delta_request` and this automation writes the register.
#
# Control law (asymmetric, matching the two hysteresis values in the pump menu, 2026-10-10):
# the pump trips OFF when `water > target + hys_pos` (heat; mirrored in cool) and stops being
# satisfied at `water = target + hys_neg`, with hys_neg negative. Solving both for the target
# gives the same bracket in heat and cool:
#
#     effective = clamp(request, water - hys_pos, water - hys_neg)
#
# `request` is the temperature set on the climate entity: its `set_temperature` writes the water
# request helper in heat/cool and the delta request helper in auto, and the step-3 room control loop
# will feed those same helpers. `effective` is the number that goes to the pump - register 2 in
# heat/cool, the delta on register 4 in auto, where the realised curve (register 2 minus the delta
# the pump reports) turns the delta back into a water temperature.
#
# The lower bound keeps `water <= target + hys_pos`, so the off-trip cannot be met; the upper
# bound keeps the pump demanding and caps the demand at |hys_neg| above the water (the soft
# start). Set both helpers slightly inside the pump's own values to keep a margin.
#
# The season band from the four min/max helpers is the outer limit, so the band in use is
#
#     water_floor = max(band_min, water - hys_pos)
#     water_ceil  = min(band_max, water - hys_neg)
#
# and in every mode - heat, cool and auto - both ends of that band sit closer to the water
# temperature than the helper alone would put them. Auto is heating-only and therefore reads the
# heat pair (2026-10-11).
#
# Passthrough (effective = request) instead of the clamp when:
#   * the compressor is off - a saturated target sits exactly on the start threshold
#     (`target = water + hys_pos`) and the pump would not start (2026-10-10);
#   * the toggle is off, the pump is off, or the pump is in room control (control mode 2);
#   * request <= the active season's minimum - there the pump may go off on hysteresis, which is
#     exactly what that setting is for. In auto the same thing happens when the asked-for water is
#     at or below `water - hys_pos`, so the layer stops chasing the water downward.
#   * the room is above its effective target and has kept rising without normal heat demand for the
#     passive-gain hold time. This distinguishes real solar/other passive gain from a setpoint
#     reduction that is still letting the room coast down.
#   * the anti-trip layer has been the only thing holding the pump on for the maximum hold time.
#     This is the slow-rise backstop when the room trend never reaches the passive-gain threshold.
#   * the calibrated room force widens the anti-trip hold in proportion to the room error. At one
#     room hysteresis the band reaches one water hysteresis from the measured water and stays there.
#   * the band would have to hold the pump on more than
#     `input_number.therma_v_water_setpoint_release_gap` past
#     the request - in heat that is `desired - request`, in cool `request - desired`, i.e. the water
#     has run away from the request on the side where the pump switches off (too hot in heat, too
#     cold in cool). The request then goes back in and the pump trips off on its own hysteresis. This
#     hand-back is what *forces* the release; a clamp on the demand was tried and reverted on
#     2026-10-15 (see the helper's comment). The soft-start side - a demand held *back* from the
#     request - never bypasses, so a cold start with a high request keeps its soft start.

input_number:
  therma_v_startup_hysteresis_pos:
    name: "Therma V startup hysteresis pos"
    min: 1
    max: 4
    step: 0.1
    initial: 2.8
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:plus-minus-variant

  # Negative on purpose: it mirrors the pump's own negative hysteresis entry.
  therma_v_startup_hysteresis_neg:
    name: "Therma V startup hysteresis neg"
    min: -4
    max: -1
    step: 0.1
    initial: -2.8
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:plus-minus-variant

  # How far the layer may hold the pump on against the request. It only counts on the switch-off side:
  # in heat the demand lifted above the request (the water is too hot), in cool the demand pulled
  # below it (the water is too cold); the soft-start side never reaches it. Both the water sensor and
  # the auto delta sensor read this helper, so the two cannot drift apart (2026-10-11).
  #
  # It is a cliff, not a step (measured 2026-10-15): while the gap is at or below this value the layer
  # holds the demand at `water - hys_pos`; the moment it exceeds it the whole demand is handed back, so
  # register 2 jumps to the raw request and the pump trips off at once. With whole-degree writes you
  # therefore see the gap climb +1..+5 and then drop to 0, never +6 - that jump is the mechanism, not a
  # bug. Clamping the demand to `request + offset` was tried on 2026-10-15 and reverted the same
  # evening: it bounds the demand but never forces a release.
  # Jan raised it 6 -> 7 C the same evening, so the cliff sits 1 K higher (water gap `offset + hys_pos`
  # = 9.8 C above the request).
  # Remember: `initial` does not reach an entity that already exists - the live value has to be set
  # too (see the notes, "The season band was loaded the same evening").
  therma_v_water_setpoint_release_gap:
    name: "Therma V water setpoint release gap"
    min: 0
    max: 10
    step: 0.5
    initial: 8
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:power

  # Passive heat gain leaves the room warmer without a corresponding water demand. The stop needs a
  # sustained rise, not a single 0.1 C sensor step; the moving-average filtered room is differentiated
  # over 20 minutes and the active condition must persist for 40 minutes.
  therma_v_room_trend_threshold:
    name: "Therma V room trend stop threshold"
    min: 0.1
    max: 2
    step: 0.05
    initial: 0.4
    mode: box
    unit_of_measurement: "°C/h"
    icon: mdi:chart-line-variant

  # The request the layer steers to: the climate slider writes it (heat/cool/room), and it is the
  # starting point for the clamp. Range covers every mode (cool, room, heat). Step 0.5 since
  # 2026-10-11: the heating curve (package_therma_v_heating_curve.yaml) writes fractional requests
  # and the pump still only ever sees whole degrees, because the effective sensor below rounds.
  therma_v_water_target_request:
    name: "Therma V water target request"
    min: 10
    max: 45
    step: 0.5 # The pump holds whole degrees; the whole-degree rounding sits in the effective sensor
    # initial: 25 # Dashboard helper: restore the last request. Without a restored value the
    # effective sensor is unavailable and the writer cannot send an invented setpoint.
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer

  # Auto mode (the heating curve): the pump adds this delta to the curve and publishes the result
  # on register 2. The slider writes this helper, and the layer moves it within -5..+5 to keep the
  # water inside the hysteresis band. Whole degrees, because register 4 is 1 C per step.
  therma_v_auto_delta_request:
    name: "Therma V auto delta request"
    min: -5
    max: 5
    step: 1
    # initial: 0 # Dashboard helper: restore the last request rather than inventing a delta.
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:chart-bell-curve-cumulative

  # The four min/max helpers are also the climate template's mode-dependent write band, so there
  # is one source of truth (2026-10-10). The min is where the layer switches off (passthrough)
  # so the pump may go off on hysteresis. Auto (heating only) reads the heat pair the same way, so
  # the band hugs the water temperature in all three modes (2026-10-11).
  therma_v_min_water_temperature_heat:
    name: "Therma V min water temperature heat"
    min: 10
    max: 45
    step: 1
    initial: 20
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  therma_v_max_water_temperature_heat:
    name: "Therma V max water temperature heat"
    min: 10
    max: 45
    step: 1
    initial: 42
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

  therma_v_min_water_temperature_cool:
    name: "Therma V min water temperature cool"
    min: 5
    max: 25
    step: 1
    initial: 12
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  therma_v_max_water_temperature_cool:
    name: "Therma V max water temperature cool"
    min: 5
    max: 25
    step: 1
    initial: 22
    mode: box
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

input_boolean:
  therma_v_controlled_startup:
    name: "Therma V controlled start-up"
    icon: mdi:rocket-launch-outline
    initial: true
  therma_v_passive_gain_stop:
    name: "Therma V passive heat gain stop"
    icon: mdi:weather-sunny-alert
    initial: false
  therma_v_passive_cooling_stop:
    name: "Therma V passive cooling stop"
    icon: mdi:snowflake-alert
    initial: false
  therma_v_antitrip_timeout:
    name: "Therma V anti-trip maximum hold timeout"
    icon: mdi:timer-alert-outline
    initial: false

sensor:
  # The source is the already 20-minute filtered room value. A positive derivative here means the
  # room is gaining heat even while the raw water request says no more heat is wanted.
  - platform: derivative
    name: "Therma V room temperature trend"
    unique_id: therma_v_room_temperature_trend
    source: sensor.therma_v_room_temperature_filtered
    unit_time: h
    time_window: "00:20:00"
    round: 2

# sensor.therma_v_operation_mode uses holding-register-0 values 0=cool, 3=auto, 4=heat.
# Register address 4 is the auto-mode signed delta, not an operation-mode value.
template:
  - binary_sensor:
      # True only when normal heating or cooling demand is already below the pump's off threshold,
      # but the start-up layer is still holding the compressor on against it. This is the condition
      # that needs the maximum-hold timeout; when the compressor is off or the season limit already
      # releases it, there is nothing to time out.
      - name: "Therma V no-demand anti-trip hold"
        unique_id: therma_v_no_demand_antitrip_hold
        icon: mdi:heat-wave
        availability: >-
          {{ has_value('input_number.therma_v_water_target_request')
             and has_value('sensor.therma_v_controlled_water_temperature')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_compressor_hz')
             and has_value('sensor.therma_v_room_temperature_effective')
             and has_value('input_number.room_setpoint_heating')
             and has_value('input_number.room_setpoint_cooling')
             and has_value('input_number.therma_v_room_hysteresis_min')
             and has_value('input_number.therma_v_room_hysteresis_max')
             and has_value('input_number.therma_v_room_force_exponent')
             and has_value('input_number.therma_v_startup_hysteresis_pos')
             and has_value('input_number.therma_v_startup_hysteresis_neg')
             and has_value('input_number.therma_v_min_water_temperature_heat')
             and has_value('input_number.therma_v_max_water_temperature_heat')
             and has_value('input_number.therma_v_min_water_temperature_cool')
             and has_value('input_number.therma_v_max_water_temperature_cool')
             and has_value('input_number.therma_v_water_setpoint_release_gap') }}
        state: >-
          {% set req = states('input_number.therma_v_water_target_request') | float(0) %}
          {% set water = states('sensor.therma_v_controlled_water_temperature') | float(0) %}
          {# Register 0 mode: 0=cool, 3=auto, 4=heat; register 1 control: 0=outlet, 1=inlet, 2=room. #}
          {% set mode = states('sensor.therma_v_operation_mode') | int(-1) %}
          {% set cm = states('sensor.therma_v_control_mode') | int(-1) %}
          {% set hz = states('sensor.therma_v_compressor_hz') | float(0) %}
          {% set hys_pos = states('input_number.therma_v_startup_hysteresis_pos') | float(3) %}
          {% set hys_neg = states('input_number.therma_v_startup_hysteresis_neg') | float(-3) %}
          {% set release_gap = states('input_number.therma_v_water_setpoint_release_gap') | float(6) %}
          {% set room = states('sensor.therma_v_room_temperature_effective') | float(20) %}
          {% set strategy = states('input_select.therma_v_control_strategy') %}
          {% set heat_enabled = is_state('input_boolean.therma_v_supervisor_space_heat_enabled', 'on') %}
          {% set cooling_enabled = is_state('input_boolean.therma_v_supervisor_cooling_enabled', 'on') %}
          {% set plan_target = states('sensor.therma_v_room_setpoint_plan') %}
          {% set base_target = (states('input_number.room_setpoint_heating') | float(20) if mode == 4
                                else states('input_number.room_setpoint_cooling') | float(24)) %}
          {% set use_plan = strategy == 'EMHASS'
                            and ((mode == 4 and heat_enabled) or (mode == 0 and cooling_enabled))
                            and plan_target | is_number %}
          {% set target = plan_target | float(base_target) if use_plan else base_target %}
          {% set room_lower = states('input_number.therma_v_room_hysteresis_min') | float(19.5) %}
          {% set room_upper = states('input_number.therma_v_room_hysteresis_max') | float(21) %}
          {% set e = target - room %}
          {% set room_hyst = max((target - room_lower) if e >= 0 else (room_upper - target), 0.1) %}
          {% set water_hyst = max(hys_pos | abs, hys_neg | abs) %}
          {% set exponent = states('input_number.therma_v_room_force_exponent') | float(2) %}
          {% set force_allowance = water_hyst * min(((e | abs) / room_hyst) ** exponent, 1) %}
          {% set heat = mode == 4 %}
          {% set band_min = (states('input_number.therma_v_min_water_temperature_heat') | float(20)
                             if heat else states('input_number.therma_v_min_water_temperature_cool') | float(12)) %}
          {% set band_max = (states('input_number.therma_v_max_water_temperature_heat') | float(42)
                             if heat else states('input_number.therma_v_max_water_temperature_cool') | float(22)) %}
          {% set water_floor = max(band_min, water - max(hys_pos, force_allowance)) %}
          {% set water_ceil = min(band_max, water + max(-hys_neg, force_allowance)) %}
          {% set desired = min(max(req, water_floor), water_ceil) %}
          {% set no_demand = (req <= water - hys_pos) if heat else (req >= water - hys_neg) %}
          {% set room_beyond = (room > target) if heat else (room < target) %}
          {% set chase = desired - req if heat else req - desired %}
          {{ is_state('input_boolean.therma_v_controlled_startup', 'on')
             and is_state('switch.therma_v_heating_cooling_on_off', 'on')
             and mode in [0, 4]
             and cm in [0, 1]
             and hz > 1
             and req > band_min
             and no_demand
             and room_beyond
             and chase > 0
             and chase <= release_gap }}

      - name: "Therma V passive heat surplus"
        unique_id: therma_v_passive_heat_surplus
        icon: mdi:home-thermometer-alert
        availability: >-
          {{ has_value('binary_sensor.therma_v_no_demand_anti_trip_hold')
             and has_value('sensor.therma_v_room_temperature_trend')
             and has_value('input_number.therma_v_room_trend_threshold') }}
        state: >-
          {{ is_state('binary_sensor.therma_v_no_demand_anti_trip_hold', 'on')
             and states('sensor.therma_v_room_temperature_trend') | float(0)
                 >= states('input_number.therma_v_room_trend_threshold') | float(0.4) }}

      - name: "Therma V passive cooling"
        unique_id: therma_v_passive_cooling
        icon: mdi:snowflake-alert
        availability: >-
          {{ has_value('binary_sensor.therma_v_no_demand_anti_trip_hold')
             and has_value('sensor.therma_v_room_temperature_trend')
             and has_value('input_number.therma_v_room_trend_threshold') }}
        state: >-
          {{ is_state('binary_sensor.therma_v_no_demand_anti_trip_hold', 'on')
             and states('sensor.therma_v_operation_mode') | int(-1) == 0
             and states('sensor.therma_v_room_temperature_trend') | float(0)
                 <= -(states('input_number.therma_v_room_trend_threshold') | float(0.4)) }}

  - sensor:
      # The water temperature the pump actually controls: outlet in control mode 0, inlet in
      # control mode 1 (register 1). Room control (2) falls back to the outlet; the algorithm is
      # off there anyway.
      - name: "Therma V controlled water temperature"
        unique_id: therma_v_controlled_water_temperature
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('sensor.therma_v_inlet_temperature')
             and has_value('sensor.therma_v_outlet_temperature')
             and has_value('sensor.therma_v_control_mode') }}
        state: >-
          {% if is_state('sensor.therma_v_control_mode', '1') %}
          {{ states('sensor.therma_v_inlet_temperature') }}
          {% else %}
          {{ states('sensor.therma_v_outlet_temperature') }}
          {% endif %}

      # The value the writer automation puts in register 2 (heat/cool). See the header for the
      # control law. Rounded to a whole degree because the pump truncates register 2 (measured
      # 2026-10-10: writing 25,5 reads back 25, writing 25,8 reads back 25). The direction follows
      # the mode: **heat ceil, cool floor**, because the two modes trip on opposite sides of the
      # band. In heat the off-trip is `water > target + hys_pos`, so the target must not be rounded
      # *down*; in cool it is `water < target + hys_neg`, so it must not be rounded *up*. The sensor
      # therefore shows the value the pump will actually hold, which also makes the writer's
      # register guard an exact comparison.
      #
      # The anti-trip band normally holds the pump near the measured water temperature. If that
      # support would have to sit more than the configured release gap away from the raw request,
      # the raw request is handed back so the pump can switch off on its own hysteresis. The
      # calibrated room-force allowance widens the band progressively and is capped at full force.
      - name: "Therma V water setpoint effective"
        unique_id: therma_v_water_setpoint_effective
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('input_number.therma_v_water_target_request')
             and has_value('sensor.therma_v_controlled_water_temperature')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_compressor_hz')
             and has_value('sensor.therma_v_room_temperature_effective')
             and has_value('input_number.room_setpoint_heating')
             and has_value('input_number.therma_v_room_hysteresis_min')
             and has_value('input_number.therma_v_room_hysteresis_max')
             and has_value('input_number.therma_v_room_force_exponent')
             and states('input_number.therma_v_room_hysteresis_min') | is_number
             and states('input_number.therma_v_room_hysteresis_max') | is_number
             and states('input_number.therma_v_room_force_exponent') | is_number
             and 15 <= states('input_number.therma_v_room_hysteresis_min') | float(0)
                       < states('input_number.therma_v_room_hysteresis_max') | float(0) <= 30 }}
        state: >-
          {% set req = states('input_number.therma_v_water_target_request') | float(0) %}
          {% set water = states('sensor.therma_v_controlled_water_temperature') | float(0) %}
          {% set mode = states('sensor.therma_v_operation_mode') %}
          {% set cm = states('sensor.therma_v_control_mode') | int(-1) %}
          {% set hys_pos = states('input_number.therma_v_startup_hysteresis_pos') | float(3) %}
          {% set hys_neg = states('input_number.therma_v_startup_hysteresis_neg') | float(-3) %}
          {% set release_gap = states('input_number.therma_v_water_setpoint_release_gap') | float(6) %}
          {% set hz = states('sensor.therma_v_compressor_hz') | float(0) %}
          {% set room = states('sensor.therma_v_room_temperature_effective') | float(20) %}
          {% set target = states('input_number.room_setpoint_heating') | float(20) %}
          {% set room_lower = states('input_number.therma_v_room_hysteresis_min') | float(19.5) %}
          {% set room_upper = states('input_number.therma_v_room_hysteresis_max') | float(21) %}
          {% set e = target - room %}
          {% set room_hyst = max((target - room_lower) if e >= 0 else (room_upper - target), 0.1) %}
          {% set water_hyst = max(hys_pos | abs, hys_neg | abs) %}
          {% set exponent = states('input_number.therma_v_room_force_exponent') | float(2) %}
          {% set force_blend = min(((e | abs) / room_hyst) ** exponent, 1) %}
          {% set force_allowance = water_hyst * force_blend %}
          {% set mode_num = mode | int(-1) %}
          {% set heat = mode_num in [3, 4] %}
          {% set dir = 'floor' if mode_num == 0 else 'ceil' %}
          {% set band_min = (states('input_number.therma_v_min_water_temperature_heat') if heat
                             else states('input_number.therma_v_min_water_temperature_cool')) | float(10) %}
          {% set band_max = (states('input_number.therma_v_max_water_temperature_heat') if heat
                             else states('input_number.therma_v_max_water_temperature_cool')) | float(35) %}
          {% set water_floor = max(band_min, water - max(hys_pos, force_allowance)) %}
          {% set water_ceil = min(band_max, water + max(-hys_neg, force_allowance)) %}
          {% set desired = min(max(req, water_floor), water_ceil) %}
          {% set chase = desired - req if heat else req - desired %}
          {% set force_dir = 'ceil' if e > 0 else ('floor' if e < 0 else dir) %}
          {% set active = is_state('input_boolean.therma_v_controlled_startup', 'on')
                          and is_state('switch.therma_v_heating_cooling_on_off', 'on')
                          and mode_num in [0, 4]
                          and cm in [0, 1]
                          and hz > 1
                          and req > band_min
                          and chase <= release_gap
                          and (mode_num != 4
                               or (not is_state('input_boolean.therma_v_passive_gain_stop', 'on')
                                   and not is_state('input_boolean.therma_v_antitrip_timeout', 'on')))
                          and (mode_num != 0
                               or (not is_state('input_boolean.therma_v_passive_cooling_stop', 'on')
                                   and not is_state('input_boolean.therma_v_antitrip_timeout', 'on'))) %}
          {% if not active %}
          {{ req | round(0, force_dir) | int }}
          {% else %}
          {{ desired | round(0, force_dir) | int }}
          {% endif %}

      # The delta to write on register 4 in auto mode. Auto follows a heating curve, so the
      # reachable water target is `curve +/- 5`; the layer solves for the delta that puts the water
      # where the hysteresis clamp wants it. The heat min/max helpers bound that band exactly as in
      # heat - floor = max(band_min, water - hys_pos), ceiling = min(band_max, water - hys_neg) - so
      # the band hugs the water temperature here too (2026-10-11). Auto only ever heats, so the
      # whole-degree rounding goes up like heat. The curve is derived from the two registers -
      # register 2 is the resulting water target, register 4 the delta the pump applies - verified
      # live 2026-10-10: auto with delta 0 read register 2 = 23, with delta +2 it read 25.
      # The chase limit above applies to the water target here too: if the band pushes the asked-for
      # water up by more than `input_number.therma_v_water_setpoint_release_gap` (the runaway case,
      # the side
      # where the pump switches off on a too-hot water), the raw request delta goes back in.
      # Passthrough: the raw request delta when the compressor is off, the toggle is off, the pump
      # is off, the pump is in room control, or the asked-for water is already at/below
      # `water - hys_pos` - in heating that means "let the pump go off on hysteresis".
      - name: "Therma V auto delta effective"
        unique_id: therma_v_auto_delta_effective
        state_class: measurement
        device_class: temperature
        unit_of_measurement: "°C"
        availability: >-
          {{ has_value('input_number.therma_v_auto_delta_request')
             and has_value('sensor.therma_v_controlled_water_temperature')
             and has_value('sensor.therma_v_operation_mode')
             and has_value('sensor.therma_v_control_mode')
             and has_value('sensor.therma_v_compressor_hz')
             and has_value('sensor.therma_v_target_temperature_circuit_1')
             and has_value('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1')
             and has_value('sensor.therma_v_room_temperature_effective')
             and has_value('input_number.room_setpoint_heating')
             and has_value('input_number.therma_v_room_hysteresis_min')
             and has_value('input_number.therma_v_room_hysteresis_max')
             and has_value('input_number.therma_v_room_force_exponent')
             and states('input_number.therma_v_room_hysteresis_min') | is_number
             and states('input_number.therma_v_room_hysteresis_max') | is_number
             and states('input_number.therma_v_room_force_exponent') | is_number
             and 15 <= states('input_number.therma_v_room_hysteresis_min') | float(0)
                       < states('input_number.therma_v_room_hysteresis_max') | float(0) <= 30 }}
        state: >-
          {% set req = states('input_number.therma_v_auto_delta_request') | float(0) %}
          {% set water = states('sensor.therma_v_controlled_water_temperature') | float(0) %}
          {% set mode = states('sensor.therma_v_operation_mode') | int(-1) %}
          {% set cm = states('sensor.therma_v_control_mode') | int(-1) %}
          {% set hys_pos = states('input_number.therma_v_startup_hysteresis_pos') | float(3) %}
          {% set hys_neg = states('input_number.therma_v_startup_hysteresis_neg') | float(-3) %}
          {% set release_gap = states('input_number.therma_v_water_setpoint_release_gap') | float(6) %}
          {% set hz = states('sensor.therma_v_compressor_hz') | float(0) %}
          {% set room = states('sensor.therma_v_room_temperature_effective') | float(20) %}
          {% set target = states('input_number.room_setpoint_heating') | float(20) %}
          {% set room_lower = states('input_number.therma_v_room_hysteresis_min') | float(19.5) %}
          {% set room_upper = states('input_number.therma_v_room_hysteresis_max') | float(21) %}
          {% set e = target - room %}
          {% set room_hyst = max((target - room_lower) if e >= 0 else (room_upper - target), 0.1) %}
          {% set water_hyst = max(hys_pos | abs, hys_neg | abs) %}
          {% set exponent = states('input_number.therma_v_room_force_exponent') | float(2) %}
          {% set force_allowance = water_hyst * min(((e | abs) / room_hyst) ** exponent, 1) %}
          {# Auto readback: register 2=target, register 4=signed delta; operation mode 3 selects auto. #}
          {% set applied = states('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1') | float(0) %}
          {% set water_target = states('sensor.therma_v_target_temperature_circuit_1') | float(0) %}
          {% set band_min = states('input_number.therma_v_min_water_temperature_heat') | float(20) %}
          {% set band_max = states('input_number.therma_v_max_water_temperature_heat') | float(35) %}
          {% set curve = water_target - applied %}
          {% set water_request = curve + req %}
          {% set water_floor = max(band_min, water - max(hys_pos, force_allowance)) %}
          {% set water_ceil = min(band_max, water + max(-hys_neg, force_allowance)) %}
          {% set desired = min(max(water_request, water_floor), water_ceil) %}
          {% set active = is_state('input_boolean.therma_v_controlled_startup', 'on')
                          and is_state('switch.therma_v_heating_cooling_on_off', 'on')
                          and mode == 3
                          and cm in [0, 1]
                          and hz > 1
                          and water_request > water - hys_pos
                          and desired - water_request <= release_gap %}
          {% if not active %}
          {{ req | round(0, 'ceil') | int }}
          {% else %}
          {{ min(max(desired - curve, -5), 5) | round(0, 'ceil') | int }}
          {% endif %}

automation:
  # A clear room rise without normal heat demand is treated as passive gain. The condition itself
  # is continuously recomputed; only after the hold time does it release the anti-trip layer.
  - id: therma_v_passive_gain_stop
    alias: "Therma V passive heat gain stop"
    description: "Releases the start-up hold after sustained room warming without heat demand"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.therma_v_passive_heat_surplus
        to: "on"
        for: "00:40:00"
        id: arm
      - trigger: state
        entity_id: binary_sensor.therma_v_passive_heat_surplus
        to: "off"
        id: release
      - trigger: homeassistant
        event: start
        id: release
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arm
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.therma_v_passive_gain_stop
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.therma_v_passive_gain_stop

  # The cooling mirror: the room falls without a normal cooling request. This is mostly symmetry,
  # because the cooling source is far too weak to create a pronounced overshoot in this house, but
  # it keeps the anti-trip layer from holding a useless compressor run indefinitely.
  - id: therma_v_passive_cooling_stop
    alias: "Therma V passive cooling stop"
    description: "Releases the start-up hold after sustained room cooling without cooling demand"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.therma_v_passive_cooling
        to: "on"
        for: "00:40:00"
        id: arm
      - trigger: state
        entity_id: binary_sensor.therma_v_passive_cooling
        to: "off"
        id: release
      - trigger: homeassistant
        event: start
        id: release
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arm
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.therma_v_passive_cooling_stop
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.therma_v_passive_cooling_stop

  # Slow but persistent no-demand hold. This backstop deliberately ignores the room slope and limits
  # how long the anti-trip layer can keep the compressor alive by itself.
  - id: therma_v_antitrip_timeout
    alias: "Therma V anti-trip maximum hold timeout"
    description: "Releases the start-up hold after the maximum no-demand hold time"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.therma_v_no_demand_anti_trip_hold
        to: "on"
        for: "03:00:00"
        id: arm
      - trigger: state
        entity_id: binary_sensor.therma_v_no_demand_anti_trip_hold
        to: "off"
        id: release
      - trigger: homeassistant
        event: start
        id: release
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: arm
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.therma_v_antitrip_timeout
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.therma_v_antitrip_timeout

  # The only writer of Modbus register 2 (heat/cool/room). Four ways in: the effective value
  # changing, the register changing (the pump's own logic, or a manual change on the unit), a mode
  # change, and a 15-minute heartbeat as the safety net (a Home Assistant restart or a Modbus
  # hiccup). The mode trigger is what closes the gap found live on 2026-10-10: switching auto ->
  # heat leaves the pump's own heating-curve value behind in register 2 (22) while our effective
  # value does not change (26), so a change trigger on the effective value alone never fires. (A
  # template trigger on the divergence was tried first and does not work: a template trigger that is
  # already true at load time never starts its `for:` timer.) The write is guarded by a comparison
  # with the register, so our own writes - and the pump's own clamping, e.g. asking 35 lands as 30 -
  # cannot feed back into a write loop. Auto mode is a branch of its own below: register 4, the delta
  # on the pump's own heating curve, with its own register guard.
  - id: therma_v_apply_water_setpoint_auto
    alias: "Therma V apply water setpoint auto"
    description: "Writes the controlled-start-up water setpoint (register 2) or the auto delta (register 4)"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.therma_v_water_setpoint_effective
      - trigger: state
        entity_id: sensor.therma_v_auto_delta_effective
      - trigger: state
        entity_id: sensor.therma_v_target_temperature_circuit_1
      - trigger: state
        entity_id: sensor.therma_v_auto_mode_target_temperature_delta_circuit_1
      - trigger: state
        entity_id: sensor.therma_v_operation_mode
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      # Holding-register 0 values: 0=cool, 3=auto, 4=heat.
      - condition: template
        value_template: "{{ states('sensor.therma_v_operation_mode') | int(-1) in [0, 3, 4] }}"
    actions:
      - choose:
          # Auto mode: the delta on register 4. It is a signed 16-bit register, so a negative
          # delta goes out as two's complement - the same as the climate template does.
          - conditions:
              # Operation-mode value 3 selects auto; register address 4 holds the delta.
              - condition: template
                value_template: "{{ states('sensor.therma_v_operation_mode') | int(-1) == 3 }}"
            sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {# Compare the computed delta with the register-4 readback. #}
                      {{ states('sensor.therma_v_control_mode') | is_number
                         and states('sensor.therma_v_auto_delta_effective') | is_number
                         and (states('sensor.therma_v_auto_mode_target_temperature_delta_circuit_1') | float(0)
                              - states('sensor.therma_v_auto_delta_effective') | float(0)) | abs > 0.5 }}
                then:
                  - variables:
                      delta: "{{ states('sensor.therma_v_auto_delta_effective') | int(0) }}"
                  - action: modbus.write_register
                    data:
                      address: 4
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: "{{ delta + 65536 if delta < 0 else delta }}"
        default:
          # Heat / cool / room control: the water setpoint on register 2. Only write when the
          # register really differs from the effective value, so our own writes (and the pump's own
          # truncation) cannot feed back into a write loop.
          - if:
              - condition: template
                value_template: >-
                  {{ states('sensor.therma_v_operation_mode') | int(-1) in [0, 4]
                     and states('sensor.therma_v_control_mode') | is_number
                     and states('sensor.therma_v_water_setpoint_effective') | is_number }}
            then:
              - if:
                  - condition: template
                    value_template: >-
                      {# Compare the effective target with the register-2 readback. #}
                      {% set registered = states('sensor.therma_v_target_temperature_circuit_1') %}
                      {% set effective = states('sensor.therma_v_water_setpoint_effective') | float(0) %}
                      {{ not (registered | is_number) or ((registered | float(0)) - effective) | abs > 0.5 }}
                then:
                  - action: modbus.write_register
                    data:
                      address: 2
                      slave: 1
                      hub: modbus_gateway_therma_v
                      value: "{{ (states('sensor.therma_v_water_setpoint_effective') | float(0) * 10) | int }}"
