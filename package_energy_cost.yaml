input_datetime:
  start_time_electricity_lowest_hours:
    name: Start time electricity lowest hours
    has_date: false
    has_time: true
  start_time_electricity_highest_hour:
    name: Start time electricity highest hour
    has_date: false
    has_time: true

input_number:
  electric_energy_tax_ex:
    name: "Electric energy tax ex. VAT"
    min: 0
    max: 100 # Deliberately high ceiling so it never limits a valid tariff value.
    step: 0.00001
    initial: 0.09161
    mode: box
    unit_of_measurement: "€"
  electric_energy_purchasing_fee_ex:
    name: "Electric energy purchasing fee ex. VAT"
    min: 0
    max: 100 # Deliberately high ceiling so it never limits a valid tariff value.
    step: 0.00001
    initial: 0.0165
    mode: box
    unit_of_measurement: "€"
  electric_energy_selling_fee_ex:
    name: "Electric energy selling fee ex. VAT"
    min: 0
    max: 100 # Deliberately high ceiling so it never limits a valid tariff value.
    step: 0.00001
    initial: 0.0165
    mode: box
    unit_of_measurement: "€"
  electric_energy_vat:
    name: "Electric energy VAT"
    min: 0
    max: 1
    step: 0.01
    initial: 0.21
    mode: box

template:
  - sensor:
      # Buying price: what a kWh from the grid costs, including VAT. For the Zonneplan
      # dynamic contract that is the Nord Pool price plus the purchasing fee and the energy
      # tax, all plus VAT. It is derived from the selling price so both sensors stay on the
      # same day-ahead prices; the levies that only apply when buying are a constant:
      #   buying = selling + (purchasing fee + energy tax - selling fee) * (1 + VAT)
      - name: "Electricity buying price"
        unique_id: electricity_buying_price
        unit_of_measurement: "€/kWh"
        state_class: measurement
        availability: "{{ states('sensor.electricity_selling_price') | is_number }}"
        state: >
          {% set sell       = states('sensor.electricity_selling_price') | float(0) %}
          {% set buy_fee    = states('input_number.electric_energy_purchasing_fee_ex') | float(0) %}
          {% set energy_tax = states('input_number.electric_energy_tax_ex') | float(0) %}
          {% set sell_fee   = states('input_number.electric_energy_selling_fee_ex') | float(0) %}
          {% set VAT        = states('input_number.electric_energy_vat') | float(0.21) %}
          {{ ( sell + (buy_fee + energy_tax - sell_fee) * (1 + VAT) ) | round(2, default=0) }}
        attributes:
          prices: >
            {% set buy_fee    = states('input_number.electric_energy_purchasing_fee_ex') | float(0) %}
            {% set energy_tax = states('input_number.electric_energy_tax_ex') | float(0) %}
            {% set sell_fee   = states('input_number.electric_energy_selling_fee_ex') | float(0) %}
            {% set VAT        = states('input_number.electric_energy_vat') | float(0.21) %}
            {% set sell_prices = state_attr('sensor.electricity_selling_price', 'prices') | default([], true) %}
            {% set delta       = (buy_fee + energy_tax - sell_fee) * (1 + VAT) %}
            {% set ns = namespace(list=[]) %}
            {% for i in range(sell_prices|length) %}
            {%   set time  = sell_prices[i]['time'] %}
            {%   set price = (sell_prices[i]['price'] | float) + delta %}
            {%   set ns.list = ns.list + [{'time': time, 'price': price | round(4)}] %}
            {% endfor %}
            {{ ns.list }}

          
      # Where the current price sits between today's cheapest and most expensive hour
      - name: "Current percentage of electricity price"
        unique_id: current_percentage_of_electricity_price
        unit_of_measurement: "%"
        state_class: measurement
        availability: >
          {% set prices = state_attr('sensor.electricity_selling_price', 'prices') | default([], true) %}
          {{ states('sensor.electricity_selling_price') | is_number and prices | count > 1 }}
        state: >
          {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
          {% set high    = cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices',time_key='time', value_key='price', mode='max', use_hourly_avg=false, hours='all', look_ahead=false, include_today=true, include_tomorrow=false) | float(0) %}
          {% set low     = cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices',time_key='time', value_key='price', mode='min', use_hourly_avg=false, hours='all', look_ahead=false, include_today=true, include_tomorrow=false) | float(0) %}
          {% set current = states('sensor.electricity_selling_price') | float(0) %}

          {{ ( (current-low) / max(high-low,0.0001) * 100 ) | round(1, default=0) }} {# max to prevent dix0 #}

      # Difference between the most and least expensive hour today
      - name: "Difference in electricity price today"
        unique_id: difference_in_electricity_price_today
        state_class: measurement
        unit_of_measurement: '€'
        availability: >
          {% set prices = state_attr('sensor.electricity_selling_price', 'prices') | default([], true) %}
          {{ states('sensor.electricity_buying_price') | is_number and prices | count > 1 }}
        state: >
          {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
          {# | float(0): when the macro returns no number (e.g. prices not published yet) the subtraction raised a TypeError #}
          {% set high = cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices',time_key='time', value_key='price', mode='max', use_hourly_avg=false, hours='all', look_ahead=false, include_today=true, include_tomorrow=false) | float(0) %}
          {% set low = cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices',time_key='time', value_key='price', mode='min', use_hourly_avg=false, hours='all', look_ahead=false, include_today=true, include_tomorrow=false) | float(0) %}
          
          {{ ( (high-low) )  | round(3) }}

      # Cost per hour in EUR/h including tax; uses the export price when the power is negative
      - name: "Electric power cost per hour including tax"
        unique_id: electric_power_cost_per_hour_including_tax
        state_class: measurement
        unit_of_measurement: "€/h"
        availability: >
          {% set power      = states('sensor.p1_meter_3c39e72e6af0_active_power') | float("unknown") %}
          {% set cost_in    = states('sensor.electricity_buying_price') | float("unknown") %}
          {% set cost_ex    = states('sensor.electricity_selling_price') | float("unknown") %}
          {{ power|is_number and cost_in|is_number and cost_ex|is_number}}
        state: >
            {% set power   = states('sensor.p1_meter_3c39e72e6af0_active_power') | float(0) %}
            {% set cost_in = states('sensor.electricity_buying_price') | float(0) %}
            {% set cost_ex = states('sensor.electricity_selling_price') | float(0) %}
            {{ power/1000*cost_in if power > 0 else power/1000*cost_ex }}
      # Cost per hour in EUR/h excluding tax
      - name: "Electric power cost per hour excluding tax"
        unique_id: electric_power_cost_per_hour_excluding_tax
        state_class: measurement
        unit_of_measurement: "€/h"
        availability: >
          {% set power   = states('sensor.p1_meter_3c39e72e6af0_active_power') | float("unknown") %}
          {% set cost    = states('sensor.nord_pool_nl_current_price') | float("unknown") %}
          {{ power|is_number and cost|is_number}}
        state: >
            {% set power   = states('sensor.p1_meter_3c39e72e6af0_active_power') | float(0) %}
            {% set cost    = states('sensor.nord_pool_nl_current_price') | float(0) %}
            {{ power/1000*cost }}
      # Total energy used in the home. Feeds the statistics sensors that calculate the
      # daily figure, which is then averaged
      - name: "Electric energy used in home"
        unique_id: electric_energy_used_in_home
        device_class: energy
        state_class: total
        unit_of_measurement: "kWh"
        availability: >
          {% set tot_import = states('sensor.p1_meter_3c39e72e6af0_total_power_import') | float("unknown") %}
          {% set tot_export = states('sensor.p1_meter_3c39e72e6af0_total_power_export') | float("unknown") %}
          {% set tot_solar = states('sensor.total_pv_generation_preserved') | float("unknown") %}
          {% set tot_battery_charge = states('sensor.sessy_total_charged_energy') | float("unknown") %}
          {% set tot_battery_discharge= states('sensor.sessy_total_discharged_energy') | float("unknown") %}
          {{ tot_import|is_number and tot_export|is_number and tot_solar|is_number and tot_battery_charge|is_number and tot_battery_discharge|is_number }}
        state: >
          {% set tot_import = states('sensor.p1_meter_3c39e72e6af0_total_power_import') | float(0) %}
          {% set tot_export = states('sensor.p1_meter_3c39e72e6af0_total_power_export') | float(0) %}
          {% set tot_solar = states('sensor.total_pv_generation_preserved') | float(0) %}
          {% set tot_battery_charge = states('sensor.sessy_total_charged_energy') | float(0) %}
          {% set tot_battery_discharge= states('sensor.sessy_total_discharged_energy') | float(0) %}
          
          {{ (tot_import - tot_export + tot_solar + tot_battery_discharge - tot_battery_charge) | round(2) }}

  # Triggered PV sensor that holds its value overnight, when the source resets
  - trigger:
      - platform: state
        entity_id: sensor.total_pv_generation
        not_to:
          - unknown
          - unavailable
    sensor:
      - name: "Total PV Generation Preserved"
        unique_id: total_pv_generation_preserved
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: "{{ trigger.to_state.state }}"


  # Triggered Nord Pool sensor for the selling side: what a kWh that goes back to the grid
  # earns. Zonneplan adds its selling fee to the Nord Pool price (it is income, not a cost)
  # and pays VAT over it; no energy tax, that only applies to buying. Exposes the current
  # price as state and the rest of today plus tomorrow in the 'prices' attribute.
  - trigger:
      - platform: state
        entity_id: sensor.nord_pool_nl_current_price
      - platform: homeassistant
        event: start
    action:
      - variables:
          previous_prices: "{{ state_attr('sensor.electricity_selling_price', 'prices') | default([], true) }}"
      - action: nordpool.get_prices_for_date
        continue_on_error: true
        response_variable: today_prices
        data:
          config_entry: !secret nord_pole_config_entry
          date: "{{ now().strftime('%Y-%m-%d') }}"
          areas: NL
          currency: EUR
      - action: nordpool.get_prices_for_date
        continue_on_error: true
        response_variable: tomorrow_prices
        data:
          config_entry: !secret nord_pole_config_entry
          date: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
          areas: NL
          currency: EUR
    sensor:
      name: Electricity selling price
      unique_id: electricity_selling_price
      unit_of_measurement: "€/kWh"
      availability: "{{ states('sensor.nord_pool_nl_current_price') | is_number }}"
      state: >
        {% set price    = states('sensor.nord_pool_nl_current_price') | float(0) %}
        {% set sell_fee = states('input_number.electric_energy_selling_fee_ex') | float(0) %}
        {% set VAT      = states('input_number.electric_energy_vat') | float(0.21) %}
        {{ (price + sell_fee) * (1 + VAT) }}
      attributes:
        prices: >
          {% set sell_fee = states('input_number.electric_energy_selling_fee_ex') | float(0) %}
          {% set VAT      = states('input_number.electric_energy_vat') | float(0.21) %}
          {% set today    = today_prices['NL'] | default([], true) if today_prices is defined else [] %}
          {% set tomorrow = tomorrow_prices['NL'] | default([], true) if tomorrow_prices is defined else [] %}
          {% set previous = previous_prices
             if previous_prices is defined and previous_prices is iterable and previous_prices is not string
             else [] %}
          {% set energy_prices = today + tomorrow if (today | count + tomorrow | count) > 0 else previous %}
          {% set ns = namespace(list=[]) %}
          {% for i in range(energy_prices|length) %}
          {%   set start = ((energy_prices[i]['start'] | as_datetime) | as_local).isoformat() %}
          {%   set price = (((energy_prices[i]['price'] | float) / 1000) + sell_fee) * (1 + VAT) %}
          {%   set ns.list = ns.list + [{'time': start, 'price': price}] %}
          {% endfor %}
          {{ ns.list }}


  # triggered sensors for the total energy cost per day based on the statistics sensors
  - trigger:  # triggers at mid night
      - trigger: time
        at: "00:00:00"
    sensor: # handy to get a grasp of the energy cost
      - name: "Energy cost per day including tax"
        unique_id: energy_cost_per_day_including_tax
        state_class: measurement
        unit_of_measurement: "€"
        state: "{{ states('sensor.energy_cost_over_one_day_including_tax')|float(0) }}"
  - trigger:  # triggers at mid night
      - trigger: time
        at: "00:00:00"
    sensor: # handy to get a grasp of the energy cost
      - name: "Energy cost per day excluding tax"
        unique_id: energy_cost_per_day_excluding_tax
        state_class: measurement
        unit_of_measurement: "€"
        state: "{{ states('sensor.energy_cost_over_one_day_excluding_tax')|float(0) }}"
  - trigger:  # triggers at mid night
      - trigger: time
        at: "00:00:00"
    sensor:   # Energy used per day in home for sessy API strategy automations
      - name: "Daily Energy used in home"
        unique_id: daily_energy_used_in_home
        state_class: measurement
        unit_of_measurement: "kWh"
        state: "{{ states('sensor.energy_used_in_home_today')|float(0) }}"

sensor:
  # Integrating EUR/h gives EUR (Riemann sum)
  - platform: integration
    name: "Energy cost including tax"
    unique_id: energy_cost_including_tax
    source: sensor.electric_power_cost_per_hour_including_tax
    method: left
    unit_time: h
    round: 2
  - platform: integration
    name: "Energy cost excluding tax"
    unique_id: energy_cost_excluding_tax
    source: sensor.electric_power_cost_per_hour_excluding_tax
    method: left
    unit_time: h
    round: 2
  # Difference over the last 24 hours, used by the templates that snapshot at midnight.
  # Utility meters cycle at midnight and cannot be combined reliably with those triggers.
  - platform: statistics
    name: Energy cost over one day including tax
    unique_id: energy_cost_over_one_day_including_tax
    entity_id: sensor.energy_cost_including_tax
    state_characteristic: change
    max_age:
      hours: 24
    precision: 2
  - platform: statistics
    name: Energy cost over one day excluding tax
    unique_id: energy_cost_over_one_day_excluding_tax
    entity_id: sensor.energy_cost_excluding_tax
    state_characteristic: change
    max_age:
      hours: 24
    precision: 2
  - platform: statistics
    name: "Energy used in home today"
    unique_id: energy_used_in_home_today
    entity_id: sensor.electric_energy_used_in_home
    state_characteristic: change
    max_age:
      hours: 24
    precision: 2
  # Seven-day moving average of the daily consumption, used by the Sessy API strategy
  - platform: statistics
    name: "Average daily energy used in home"
    unique_id: average_daily_energy_used_in_home
    entity_id: sensor.daily_energy_used_in_home
    # average_step = time-weighted average. A restart flap carries the same value as the
    # daily value and only splits one interval, so it no longer moves the average.
    # With 'mean' every flap got a full vote of its own.
    state_characteristic: average_step
    # large enough that a burst of restarts/reloads cannot push the daily values out of the buffer
    sampling_size: 60
    max_age:
      days: 7

# The utility meters cycle daily automatically 
utility_meter:
  todays_energy_cost_including_tax:
    name: "Today's energy cost including tax"
    source: sensor.energy_cost_including_tax
    cycle: daily
#    delta_values: true #input is delta energy
    net_consumption: true #allows negative power
  todays_energy_cost_excluding_tax:
    name: "Today's energy cost excluding tax"
    source: sensor.energy_cost_excluding_tax
    cycle: daily
#    delta_values: true # input is delta energy
    net_consumption: true #allows negative power
  todays_energy_used_in_home:
    name: "Today's energy used in home"
    source: sensor.electric_energy_used_in_home
    cycle: daily
#    delta_values: true # input is delta energy
    net_consumption: true #allows negative power

automation:
  # Plan the cheapest and most expensive hours of the day
  - id: plan_electricity_lowest_hours_auto
    alias: "Plan electricity highest and lowest hours auto"
    description: "Plans the start of the cheapest and most expensive hours of today"
    mode: single
    triggers:
      - trigger: time_pattern
        # Run hourly across the whole day, so a missed run cannot skip a day.
        hours: "/1"
    actions:
      - variables:
          number_of_lowest_hours: 1 # Start time of the cheapest hour.
          start_lowest_hours: >
            {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
            {{ cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices', time_key='time', value_key='price', use_hourly_avg=true, hours=number_of_lowest_hours, look_ahead=true, include_today=true, include_tomorrow=false) }}
          start_highest_hour: >
            {% from 'cheapest_energy_hours.jinja' import cheapest_energy_hours %}
            {{ cheapest_energy_hours( sensor='sensor.electricity_selling_price', attr_all='prices', time_key='time', value_key='price', use_hourly_avg=true, mode='time_max', hours='all', look_ahead=false, include_today=true, include_tomorrow=false) }}
      # Only write a usable future time. If no complete hour remains, keep the previous value.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ start_lowest_hours | as_datetime is not none }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.start_time_electricity_lowest_hours
                data:
                  datetime: "{{ start_lowest_hours }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ start_highest_hour | as_datetime is not none }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.start_time_electricity_highest_hour
                data:
                  datetime: "{{ start_highest_hour }}"
